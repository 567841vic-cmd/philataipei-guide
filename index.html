cy.", "script": "Early in the Second Sino-Japanese War many Chinese stamps were printed in Hong Kong, and some by the American Bank Note Co. of New York — the \"Dr. SYS New York Print\". Its significance: it was the first American printing house to produce stamps for China, reflecting pragmatic diplomatic ties. It had 16 values, issued during inflation, so some values were impractical. In 1942, with much of Kwangtung occupied, stamps were overprinted for use only in Kwangtung to stop smuggling from the unoccupied zone; many local overprints followed, and local overprints on covers are extremely rare — some fewer than ten known. The exhibit covers surcharges of 1, 20 and 40 cents, military post, anti-bandit and postal savings overprints, and Chinese National Currency surcharges, with proofs, specimens, settings, errors and covers. Items marked (C) at lower right have certificates.", "facts": ["Printer: American Bank Note Co., New York — first US printer of Chinese stamps", "16 values; issued during inflation", "1942 Kwangtung overprints to prevent smuggling", "Local overprints on cover extremely rare, some fewer than 10 known", "Items marked (C) carry certificates"], "frames": [["Frame 1", "½c to 1c: proofs, settings, errors, postal usage", ""], ["Frame 2", "2c to 8c", ""], ["Frame 3", "8c to 17c", ""], ["Frame 4", "25c to 50c", ""], ["Frame 5", "$1 to $5", ""], ["Frame 6", "$5 to $20", ""], ["Frame 7", "Surcharged 1c, 20c, 40c; Pai Cheng trial stamps for the Northeast; military post, postal savings", ""], ["Frame 8", "Anti-bandit stamps (currency control); CNC surcharges (Temporarily Sold, Shanghai Union, Chungking Central, Ta Tung)", ""]], "qa": [], "refs": "Lee Sung Ping 1969/1963; Ma Ren Quan 1988; Chan Shiu Hon 2000"}, {"id": "C05", "cat": "C", "star": 3, "en": "大清國家郵政史（1897–1911）", "title": "Postal History of Imperial China 1897–1911", "year": "1897–1911 | 8 frames", "src": "Source ② pp.8–11", "tags": ["Qing dynasty", "Imperial Post", "Customs Post", "Postmarks", "Foreign PO", "Letter agencies", "Sun Yat-sen", "Unique"], "hook": "From Customs-run mail to a national post — the Imperial Post lasted only 15 years, yet laid the foundation for the Republic's postal service.", "script": "Modern Chinese postal service began with the Customs Postal Department in 1867, run by foreign Customs officials for thirty years until the Chinese Imperial Post was established on 20 February 1897. It began with 31 offices based on the Customs posts and expanded rapidly. From April 1899 uniform bilingual date stamps were introduced, used until 1923; from 1904 a second wave used lunar-calendar dates until the end of 1911. The exhibit also covers domestic and overseas rates and mail to Korea, Sinkiang, Mongolia, Tibet and Yunnan. In the last frame is a cover addressed to \"ROC Provisional President Sun Yat-sen\" — the latest usage of the Imperial Post.", "facts": ["1867: Customs trial postal service", "20 Feb 1897: Chinese Imperial Post (CIP) founded; 31 offices; currency from tael to dollar", "April 1899: first uniform bilingual cds (to 1923); branch offices, agencies, post boxes; special Shantung and Fukien types", "From 1904: lunar-calendar cds (to end of 1911)", "Special areas: Korea, Sinkiang, Mongolia, Tibet, Yunnan"], "frames": [["Frame 1", "Before 1897: Customs Post, Korean Customs, Hwa-Yang Letter Agency", "Earliest Ningpo Customs cover (1876); 2nd earliest Chinkiang (1879); one of 3 Chefoo Customs (1880); external rate 11c (<10 known); unique Wenchow Customs cds Type I (1884); only native cover Jenchuan–Shanghai (1897); only Hwa-Yang Chefoo (1878)"], ["Frame 2", "1897: new post offices and postmarks", "2nd earliest Peking Postage Paid chop; earliest R chop (17 Feb 1897); earliest Peking dollar cds (7 May 1897); earliest Wenchow dollar cds (7 Jun 1897); one of 3 registered Lungchow; one of 3 Kiungchow intercalary month; unique Tientsin intercalary month; earliest and latest Tientsin \"CUSTOMS\" excised"], ["Frame 3", "From April 1899: bilingual and oval daters; tombstone cancels", "7 first-year bilingual cds (Peking, Amoy, Foochow, Canton, Tientsin, Shasi); 2nd earliest Hokow, Yunnan; Tajianlu (Tibet area) tombstone; Wafangdien, earliest PO in Manchuria"], ["Frame 4", "Shantung and Fukien regional types; 2nd uniform lunar cds", "Very early sun-moon cds; rare sun-moon on overseas mail; 2nd-day usage of the 3rd postal card"], ["Frame 5", "Domestic and foreign rates; reduction period; differential tariff; Korea, Taiwan, HK, Tsingtao, Kouang-Tchéou-Wan", "Double-registered Tsingtao special rate; 1897 newspaper wrapper Chinkiang–Sweden; Chefoo–France 7.5c differential; postage due card via Japanese PO"], ["Frame 6", "Border areas; CIP vs. foreign POs and private agencies", "1898 Jenchuan–Shanghai; 1898 Russian PO Yili–Peking via agency; Batang IPO to Calcutta; Yunnan horse courier via French PO in Annam; earliest domestic mail via international route (Mengtze 1897); latest Mengtze Customs (Dec 1899); combination covers (<5 each); latest French PO Annam (Sep 1902)"], ["Frame 7", "New services: IPO tie-print, remittance, bulk mail, mobile PO, postage due, overseas remittance", "Unique winter-rate Peking IPO; 2nd earliest remittance certificate; earliest steamer letter box; earliest postage due on inward cover"], ["Frame 8", "Express, bisects, letter sheets, \"Received Damaged\", censorship, parcels, undeliverable, contracted mail", "Peking Telegraph Office express; unique Changsha bisect cover; very early \"Received Damaged\" label; earliest \"Not deliverable\" label; cover to Provisional President Sun Yat-sen (latest IPO usage)"]], "qa": [["What is a foreign post office?", "A post office run by a foreign country inside China, e.g. the French PO in Annam route or Japanese POs."], ["What is a lunar-date (ganzhi) cds?", "A date stamp using the traditional sexagenary lunar calendar, introduced from 1904."]], "tip": "Easiest stories: the cover to Sun Yat-sen (Frame 8) and the Yunnan horse-courier mail (Frame 6).", "refs": "Sun Jun-Yi, The History of Postal Marks in Ching Dynasty, 1984; Paul K.S. Chang, The History of Chinese Postal Marks, 1989; Ping-Wen Hsueh, Postal Rates of China, 1981"}, {"id": "C06", "cat": "C", "star": 2, "en": "衝突與重建：抗戰時期中國軍郵（1937–1945）（暫譯）", "title": "Conflict and Reconstruction: Military Postal Services in China During the War of Resistance, 1937–1945", "year": "1894–1949 | 8 frames", "src": "Source ② p.12", "tags": ["War of Resistance", "Military post", "War zones", "IJA Field Post", "CBI", "POW", "Civil war"], "hook": "Wartime military mail turned into a map of shifting front lines.", "script": "Focused on ROC military post, this exhibit adds Imperial Japanese Army field post for comparison, using enemy mail as geographical evidence of shifting front lines and the hardships of the defenders. It begins with the 1894 Sino-Japanese War and the 1900 Boxer Rebellion, through border crises in Outer Mongolia and Tibet and the postal non-recognition of Manchukuo after 1931. After the Marco Polo Bridge Incident on 7 July 1937, a military postal system was organised by war zone. From 1941 China joined the Allies in the China-Burma-India Theatre; Japan's surrender in 1945 led directly into the civil war. Eight frames of covers, puppet-regime mail, POW items and route changes tell the postal history of a nation fighting to survive.", "facts": ["Main focus: ROC military post; comparison: Imperial Japanese Army Field Post", "Key dates: 1894, 1900, 1931 Mukden Incident, 7 Jul 1937 Marco Polo Bridge, 1941 Pacific War, 1945 surrender", "CBI = China-Burma-India Theatre; CEF = Chinese Expeditionary Force"], "frames": [["Frame 1", "Prologue: geopolitical origins and border crises (1894–1936)", "Sino-Japanese War, Boxer IJA posts, Qing mail; Outer Mongolia, warlords, Manchukuo non-recognition (1932–36)"], ["Frame 2", "ROC military post infrastructure and financial resistance (from 1937)", "System established; military postal savings and remittances"], ["Frame 3", "Conflict and confrontation: Central China", "3rd and 9th War Zones (1939–44)"], ["Frame 4", "Shielding the Northwest: Yichang and Shanxi-Shaanxi defences", "9th, 5th and 1st War Zones"], ["Frame 5", "Yellow River standoff: guerrillas and special stamps", "2nd War Zone; military stamp usage"], ["Frame 6", "Occupied China and southern fronts", "Puppet governments, POWs, internee camps, south/southwest lines"], ["Frame 7", "Maritime blockade and the CBI Theatre", "Japanese naval blockade; Chinese Expeditionary Force in Burma"], ["Frame 8", "Epilogue: demobilisation and cross-strait split (1945–49)", "Victory reclamation, demobilisation, civil-war turning points"]], "qa": [], "refs": "Elleman, Modern Chinese Warfare, 2001; DGP, History of Military Postal Services, 1976; DGP, A Study of Chinese Postal Rates, 1980"}, {"id": "C07", "cat": "C", "star": 1, "en": "中國童子軍郵政活動與歷史（暫譯）", "title": "Postal Activities and History of the Scouts of China", "year": "From 1912", "src": "Source ① p.1", "tags": ["Scouts", "Camp post office", "Commemorative postmark", "Nanking", "Republic era"], "hook": "A national scout jamboree with its own temporary post office and special postmark.", "script": "Scouting in the Republic of China began in its first year, 1912, when Mr. Yan Jialin piloted scouting at Wenhua College in Wuchang, Hubei, and it spread nationwide. In 1934 the China Scout Association was formally established, with Chiang Kai-shek as president; in 1937 it applied to join the World Scout organisation. The title page features the Second National Review and Camp, held beside Dr. Sun Yat-sen's mausoleum outside Zhongshan Gate in Nanking, with more than 1,000 troops and 13,268 scouts from 31 provinces and cities. A camp post office operated there; on 3 October 1936, its first day, cards were postmarked with its double-circle stamp, and a Peiping school for the blind and deaf helped run the camp post office.", "facts": ["1912: scouting begun at Wenhua College, Wuchang (Mr. Yan Jialin)", "1934: China Scout Association established", "1937: applied to join the World Scout organisation", "2nd National Review & Camp, Nanking: 1,000+ troops, 13,268 scouts, 31 provinces/cities", "Camp PO double-circle cds, first day 3 Oct 1936 (ROC 25)", "Also: Shanghai Scout 7th Congress camp commemorative postmark (1937.6)"], "frames": [["1", "Homepage", ""], ["2", "Mainland China Activities", ""], ["3", "National Jamboree", ""], ["4", "Local Activities", ""], ["5", "Commemorative Stamps and International Reach", ""]], "qa": []}, {"id": "C08", "cat": "C", "star": 2, "en": "島嶼上的鳥類：邁向生物多樣性，卻步入瀕危之路", "title": "Birds on Islands: The Road to Biodiversity but Endangered", "year": "Thematic | 40 pages (5 chapters)", "src": "Source ① pp.2–3", "tags": ["Thematic", "Birds", "Biodiversity", "Evolution", "Conservation", "Darwin", "Wallace", "Family"], "hook": "Follow bird guide Robert through island birds' Discovery, Colonization, Evolution, Decline and Recovery — told in stamps.", "script": "This thematic exhibit tells a story. Robert, a seasoned bird guide, keeps asking: why do so many extraordinary birds live only on islands? Islands cover only about 3.5% of Earth's land but support nearly 20% of its terrestrial species — natural laboratories of evolution. Building on Darwin and Wallace, the exhibit has five chapters: Discovery, Colonization, Evolution, Decline and Recovery. On the title page is the unique original 2001 artwork adopted for the Solomon Islands 5c Yellow-throated White-eye stamp, rated three stars.", "facts": ["Islands ≈ 3.5% of land, ≈ 20% of terrestrial species", "Chapters: Discovery (p.2, 7 pp.) → Colonization (p.9, 8) → Evolution (p.17, 8) → Decline (p.25, 8) → Recovery (p.33, 8); 40 pages total", "Title-page gem: 2001 original artwork for the Solomon Islands 5c Yellow-throated White-eye (★★★, unique)", "Symbols: ★–★★★ = unique, rare, error or important; ⇨ = content flow; 🔍 = personal research"], "frames": [["1 Discovery", "Where Robert's island journey began", "Island origins; pre-scientific myths; naturalists; Galápagos; crossing the Wallace Line"], ["2 Colonization", "How birds reached the islands", "First arrivals; travel between islands; why some islands support more life; endemics; isolation"], ["3 Evolution", "Island biodiversity up close", "New roles; flightlessness; giants and dwarfs; mating; tool use; seasonal movements"], ["4 Decline", "When islands lost their birdsong", "Habitat loss; pressures; bird trade; invasive species; climate shocks; disease; extinct birds"], ["5 Recovery", "Securing the future of island birds", "Rediscoveries; coexistence; sanctuaries; managing predators; a secure future"]], "qa": [["Thematic vs. traditional exhibits?", "A thematic exhibit uses philatelic items to tell a story; a traditional exhibit studies a stamp issue itself — printings, varieties and usage."]], "tip": "Top pick for families with children: strong story and rich images.", "refs": "Quammen 1997, The Song of the Dodo; Myers et al. 2000, Nature 403:853–858"}], "top": [["B01", "Inverted centre: 2 corner copies, only top-right one"], ["B02", "Dragon & Horse: only surviving red and green sheets"], ["B06", "FORMOSA essays: unique interpanneau block"], ["B05", "Letters home from Hu Shih's parents in Tainan"], ["A02", "Provisional Neutrality: sold only in Foochow, 4 values"], ["A03", "Cross overprint: even more awkward, withdrawn"], ["A08", "Xiluo Bridge: 2 proofs in different colours"], ["A12", "1949 move: no-value Flying Geese sheet of 200"], ["C01", "Revenues: jumbled-character errors"], ["C05", "Imperial Post: cover to Provisional President Sun"]], "routes": [{"name": "3-minute highlights (long queues)", "path": ["B01", "B02", "A02", "A03"], "say": "Four unique or near-unique items plus a story of stamps changing with regimes."}, {"name": "Taiwan postal story (~8 min)", "path": ["B02", "B04", "B06", "B05", "C01", "A12", "A06"], "say": "From Liu Ming-chuan's relay post, Customs essays and Hu Shih's family letters to revenue stamps and the 1949 move."}, {"name": "Republic stamp variations (~6 min)", "path": ["A01", "A02", "A03", "A04", "A05", "B01"], "say": "A commemorative redesigned for a new president, two neutrality overprints, regional overprints and the Four Treasures."}, {"name": "Post-1949 development stamps (~5 min)", "path": ["A06", "A07", "A08", "A09", "A10", "A11"], "say": "Proofs and die proofs: colours at the design stage differ from the issued stamps."}, {"name": "Families (~5 min)", "path": ["C08", "C07", "A08", "C02"], "say": "Bird stories, a scout camp post office, a giant bridge and stamp vending machines."}], "timeline": [["1867", "Customs trial postal service (British-led)", "C05"], ["1876", "Ningpo Customs cover: earliest known", "C05"], ["1884", "Liu Ming-chuan takes charge of Taiwan", "B02"], ["1888.03", "Liu founds Taiwan Post (relay stations modernised)", "B02,B06"], ["1888.06", "London-printed Dragon & Horse stamps arrive, never used", "B02"], ["1888", "Hart's FORMOSA Small Dragon essays", "B06"], ["1890.09.16", "Taipei Wenbaoju cover to Nanking", "B03"], ["1892.04.04", "Hu Tiehhwa red-band cover (Tainan → Tunxi)", "B05"], ["1893.07.01", "Feng Shundi red-band cover (Tainan → Tunxi)", "B05"], ["1894", "Lukang → Hobe relay cover (6 days); Sino-Japanese War", "B04,C06"], ["1895", "Taiwan ceded to Japan; Customs Post never opened in Taiwan", "B06,C01"], ["1896.03.20", "Post becomes state-operated (basis of 60th anniversary)", "A10"], ["1897.02.20", "Chinese Imperial Post founded", "C05"], ["1899.04", "Uniform bilingual cds (to 1923)", "C05"], ["1904起", "Lunar-date cds (to 1911)", "C05"], ["1908.06.21", "Taiwan Stamp Duty Rules take effect", "C01"], ["1912", "Republic founded; scouting begins in Wuchang", "C07"], ["1912.01", "\"Provisional Neutrality\": 4 values sold in Foochow", "A02"], ["1912.03", "Cross overprint: Hankow / Nanking / Changsha", "A03"], ["1912.12.15", "Revolution & Republic commemoratives issued", "A01"], ["1913–1936", "Junk series period (Four Treasures)", "B01"], ["1914", "Inverted centre $2", "B01"], ["1915", "Sinkiang overprint characters transposed", "B01"], ["1922", "2c on 3c surcharge inverted", "B01"], ["1925", "\"Ch'ien\" overprint; 3c on 4c surcharge inverted", "A04,B01"], ["1926", "\"Yunnan only\" overprint", "A05"], ["1930", "12 March designated Arbor Day", "A09"], ["1934", "China Scout Association founded", "C07"], ["1936.10.03", "Nanking scout camp post office opens (ROC 25)", "C07"], ["1937.07.07", "Marco Polo Bridge; military post established", "C06"], ["1942", "New York Print overprinted for Kwangtung", "C04"], ["1945.10.25", "Retrocession of Taiwan", "C01"], ["1946.01", "Japanese revenues overprinted \"Taiwan Province, ROC\"", "C01"], ["1946.08.16", "Taiwan Stamp Duty Law", "C01"], ["1949底", "DGP moves to Taipei; Flying Geese overprinted in NT$", "A12"], ["1950.06.26", "Koxinga definitives", "A06"], ["1953.01.28", "Xiluo Bridge opens", "A08"], ["1953.07.01", "Anti-TB stamps; pre-printed aerogrammes", "A07,C03"], ["1954.01.28", "Xiluo Bridge stamps", "A08"], ["1954.03.12", "Reforestation, first set", "A09"], ["1955.04.01", "Reforestation high values", "A09"], ["1956.03.20", "Postal service 60th anniversary stamps", "A10"], ["1957.10.25", "Cross-Island Highway anniversary stamps", "A11"], ["1966.11.01", "NT$4 Asia & Oceania aerogramme", "C03"], ["1995.07.31", "1st ATM stamp (Sun Yat-sen Memorial Hall)", "C02"], ["1996.11.05", "2nd ATM stamp (CKS Memorial Hall)", "C02"], ["2000初", "US-style ATM machines withdrawn", "C02"]], "glossary": [["Full sheet / pane", "A complete printed sheet, uncut, with margins and printing data."], ["Block / large block", "Stamps still joined together, e.g. a block of four (2×2)."], ["Interpanneau (gutter)", "The blank strip between two panes; blocks across it are scarce."], ["Overprint", "Extra text or value printed on an existing stamp to revalue, restrict or repurpose it."], ["Surcharge", "An overprint that changes the face value."], ["Inverted centre / overprint", "Centre design or overprint printed upside down — very rare errors."], ["Variety / error", "A stamp with a printing or overprint mistake: omitted, doubled, inverted, misplaced characters."], ["Proof", "A trial print made before production; colours often differ from the issued stamp."], ["Die proof", "Printed directly from the original engraved die — the earliest physical stage of a design."], ["Specimen", "A stamp marked SPECIMEN for records or exchange; not valid for postage."], ["Imperforate / perforated", "Without or with perforation holes between stamps."], ["Unwatermarked", "Paper without a security watermark."], ["Used cover / card", "An envelope or card that actually went through the post with postmarks."], ["Large official cover", "Big envelope used for Qing government documents."], ["Red-band cover", "Traditional Chinese envelope with a red central strip for private letters."], ["Wenbaoju", "Qing government bureau for carrying official documents."], ["Relay station post", "Liu Ming-chuan's government courier system in Taiwan, relayed station to station."], ["Private letter agency (Min Hsin Chu)", "A privately run mail business."], ["Foreign post office (IPO)", "A post office run by a foreign country inside China."], ["Date stamp (cds)", "Postmark showing the date; bilingual cds show Chinese and English."], ["Tombstone cancel", "Postmark shaped like a gravestone, used at remote Qing offices."], ["Lunar-date (ganzhi) cds", "Postmark dated with the sexagenary lunar calendar."], ["Revenue stamp", "Proof of stamp-duty payment, affixed to contracts, receipts and certificates."], ["ATM stamp", "Postage label with its value printed by a vending machine."], ["Aerogramme", "Pre-paid airmail sheet that folds into its own envelope."], ["Frame", "Display unit at an exhibition, usually 16 album pages."], ["Red mat", "Red backing used to highlight key items in an exhibit."], ["Census / recorded", "The number of examples known to exist."], ["Ex (provenance)", "A famous former owner of the item."], ["Certificate", "Authentication issued by an expert committee."]], "faq": [["How much is it worth?", "These are rare items with no public price; we don't give valuations here — enjoy the story behind them."], ["Why are printing errors valuable?", "Most errors were destroyed before release; very few escaped, so they are scarce."], ["Why show a full sheet rather than one stamp?", "A sheet keeps its margins, numbers and layout, showing how it was printed — and intact sheets are even rarer."], ["How do proofs differ from issued stamps?", "Proofs are made before production; they often lack perforations or a value, or are in different colours."], ["I have old stamps at home — are they valuable?", "Please consult a philatelic society or an authentication service; we cannot appraise on site."], ["Can I take photos? Where are souvenirs sold?", "Please follow the on-site notices and staff instructions (confirm with the organiser before opening and fill in)."], ["I don't know where to start.", "Start with the Must-see list or follow a tour route — just take away one story per item."]], "scripts": [["Queue opener (20 s)", "Hello everyone, I'm your docent today. This area has three parts: Chunghwa Post's own rarities, world-class pieces from invited collectors, and the competitive exhibits. Time is short, so let me first show you a few items that are the only ones in the world — please follow me as we move along."], ["Keep the line moving (10 s)", "If you've finished with this item, please move on to your right — the next highlight is just there, and the people behind you can come closer. Thank you!"], ["One-line hook template", "\"This is the [only known / one of a few] [item]; what makes it special is [one story].\""], ["Closing (10 s)", "That's today's highlights. Please take your time with the rest — anything on a red backing is a key item in its exhibit. Thank you!"], ["When you don't know the answer", "Great question — let me check the label or ask a specialist on site, rather than give you an answer I'm not sure of."]], "notes": [["Two dates for the national post", "A10 says the post became state-operated on 20 Mar 1896; C05 says the Imperial Post was founded on 20 Feb 1897. Commonly: approved 20 Mar 1896, opened 20 Feb 1897. Mention both if asked."], ["C05 Frame 3 year", "The Chinese text says April 1894; the English text and introduction say April 1899. Use April 1899."], ["C05 Frame 5 year", "Chefoo–France 7.5c cover: Chinese says 1898, English 1899. Avoid stating the year."], ["C03 jet aerogramme year", "The introduction says NT$6 jet in 1965; the chapter says 1962. Say \"NT$6 jet design, used until 1972\"."], ["C07 date", "Text gives 3 Oct ROC 25 (1936); a caption reads 4 Oct 1937. Use ROC 25 (1936)."], ["C01 Frames 1–2", "Chinese says entertainment tax stamps; English says eating, drinking and lodging tax stamps. Go by the items in the frame."], ["Translated titles", "C03, C04, C06 and C07 had English-only titles in the source; their Chinese titles are translations."], ["On-site information", "Stand numbers, opening hours, photo rules and souvenir sales were not in the materials — confirm with the organiser before opening."]]}, "ja": {"meta": {"title": "台北2026世界切手展　専門ガイド速查原稿", "subtitle": "PHILATAIPEI 2026｜臺北2026世界郵展 導覽速查講稿", "venue": "台北世界貿易センター 展示ホール1", "dates": "2026年11月20日（金）～25日（水）", "version": "v1.1｜2026-11-16 主催者提供資料に基づき作成", "sources": ["資料①（3頁）：出品作品タイトルページ — 中国ボーイスカウトの郵便活動と歴史／島の鳥たち（中英併記）", "資料②（12頁）：出品作品概要 — 台湾収入印紙、台湾ATM切手（米国規格）、国際航空書簡、孫文像ニューヨーク版、大清国家郵政史、抗日戦争期の軍事郵便", "資料③（28頁）：展覧会図録 p.120–175 — 中華郵政精選珍品、招待出品珍品"]}, "cats": [{"key": "A", "name": "中華郵政 精選珍品", "en": "中華郵政精選珍郵 / Chunghwa Post Philatelic Rarities", "desc": "中華郵政の所蔵品と民間コレクションからの精選：中華民国建国から政府の台湾移転後までの全シート、大型ブロック、試刷。（図録 p.120–155）"}, {"key": "B", "name": "招待出品 珍品", "en": "邀請類珍郵 / Invited Philatelic Rarities", "desc": "招待コレクターによる世界的名品：民国四珍、劉銘伝の龍馬切手、清代台湾の大型公文封と紅条封、FORMOSA小龍試作。（図録 p.156–175）"}, {"key": "C", "name": "出品作品", "en": "參展郵集 / Exhibits", "desc": "各出品作品のテーマ、フレーム構成、主要品。「（仮訳）」は原資料に一言語のタイトルしかないもの。"}], "items": [{"id": "A01", "cat": "A", "star": 2, "en": "中華民國光復紀念郵票（國父像）全張", "title": "中華民国光復記念切手（孫文像）全シート", "year": "1912年（民国元年）", "src": "図録 p.122–125", "tags": ["民国初期", "記念切手", "全シート", "孫文", "袁世凱"], "hook": "大総統が交代したため、印刷済みの建国記念切手が廃棄され作り直された。", "script": "中華民国が成立したとき、2種類の記念切手が計画されました。「光復」記念は孫文大総統の肖像、「共和」記念は中国地図に「大中華民国」の5文字を入れたものです。印刷も終わり発行直前でしたが、孫文が大総統を退き、袁世凱が後を継ぎました。袁世凱は共和記念切手に自分の肖像を使うよう強く求め、印刷済みの孫文像と地図の切手はすべて廃棄されました。民国元年12月15日、孫文像と袁世凱像の同じ図案の2シリーズが改めて発行されました。今回は孫文像の光復記念切手1円・2円・5円の全シート（各50枚）を展示しています。", "facts": ["発行日：1912年（民国元年）12月15日", "2シリーズ各12種、額面と色は同じ；中央に肖像", "見分け方：肖像枠の両側が「稲穂」＝光復記念（孫文）、「麦穂」＝共和記念（袁世凱）"], "items": ["孫文像光復記念切手 1円・2円・5円 全シート各1（各50枚、計3シート）"], "qa": [["2つのシリーズの見分け方は？", "肖像枠の両側を見てください。稲穂なら光復記念（孫文）、麦穂なら共和記念（袁世凱）です。"], ["最初の地図切手はどうなった？", "解説によれば、最初に印刷された孫文像と地図の切手は「廃棄され使われなかった」とされています。"]]}, {"id": "A02", "cat": "A", "star": 3, "en": "臨時中立郵票", "title": "臨時中立加刷切手", "year": "1912年（民国元年1月）", "src": "図録 p.126–131", "tags": ["民国初期", "加刷", "未発行", "大型ブロック", "福州"], "hook": "清朝の切手に「臨時中立」と加刷して民国切手に——福州で4種だけ売られ、すぐ販売停止。", "script": "民国成立後、清朝の切手をそのまま使うのは不適切とされました。そこで在庫の蟠龍・躍鯉・飛雁の透かしなし切手15種を造冊処（印刷局）に送り、5号宋朝体で切手中央に赤または黒の「臨時中立」4文字を横に加刷し、移行期に使うことにしました。1912年1月から福州郵便局でのみ、3分・1円・2円・5円の4種が販売されましたが、加刷の文言が不適切とされてすぐに販売停止となり、残る11種は発行されませんでした。今回は発行4種と未発行11種の大型ブロック一式を展示しており、15種すべてを一度に見られます。", "facts": ["原切手：清代の蟠龍・躍鯉・飛雁、透かしなし、15種", "額面：半分、1分、2分、3分、4分、5分、7分、1角、1角6分、2角、3角、5角、1円、2円、5円", "加刷：造冊処、5号宋朝体、中央に横書き、赤または黒の「臨時中立」", "1912年1月から福州郵便局のみで販売：3分、1円、2円、5円の4種", "文言不適切として販売停止；残り11種は未発行"], "items": ["「臨時中立」発行4種＋未発行11種の大型ブロック（4×5、5×5または8×6）一式"], "qa": [["なぜ文言が不適切だったの？", "解説には「加刷の文言が不適切」とだけ書かれているので、それ以上の推測はしないのが無難です。"], ["余白の00027などの数字は？", "シート余白の印刷番号です。大型ブロックが余白付きで残っているため見られます。"]], "tip": "A03と続けて話すと効果的：「最初は横、次に縦に加刷して十字形に。どちらもすぐ販売停止」。"}, {"id": "A03", "cat": "A", "star": 3, "en": "中華民國臨時中立郵票（十字加蓋）", "title": "中華民国臨時中立加刷切手（十字形加刷）", "year": "1912年（民国元年3月）", "src": "図録 p.132–137", "tags": ["民国初期", "加刷", "未発行", "大型ブロック", "漢口", "南京", "長沙"], "hook": "「臨時中立」に「中華民国」を縦に重ねて十字形に——文意はさらにおかしくなり、また販売停止。", "script": "「臨時中立」が販売停止になった後、造冊処は5号宋朝体で「中華民国」4文字を赤または黒で縦に加刷し、元の横書き「臨時中立」と十字形にしました。1912年3月、漢口・南京・長沙の郵便局に配布されました。原切手は同じ15種ですが、漢口で8種、南京で6種、長沙ではわずか1種しか売られませんでした。加刷で文意がいっそう不適切になったため、すぐに販売停止となり、残り7種は発行されませんでした。発行8種と未発行7種の大型ブロック一式を展示しています。", "facts": ["2回目の加刷：「中華民国」を縦書き、「臨時中立」と十字形（赤または黒、5号宋朝体）", "1912年3月 漢口・南京・長沙に配布", "漢口販売8種：1分、3分、7分、1角6分、5角、1円、2円、5円", "南京販売6種：1分、3分、1角6分、1円、2円、5円", "長沙販売1種：1分", "残り7種は未発行"], "items": ["「中華民国臨時中立」発行8種＋未発行7種の大型ブロック（4×5、5×5または8×6）一式"], "qa": [["A02とA03をひと目で見分けるには？", "A02は横書きの「臨時中立」のみ、A03は縦の「中華民国」が加わり十字形になっています。"]]}, {"id": "A04", "cat": "A", "star": 2, "en": "北京二版辟雍「黔」區貼用郵票（未發行全張）", "title": "北京二版辟雍図「黔」地区加刷切手（未発行全シート）", "year": "1925年（民国14年）", "src": "図録 p.138–139", "tags": ["地域限定加刷", "貴州", "未発行", "全シート", "北京二版"], "hook": "貴州では高額切手が送金代わりに使われ、強盗の標的にもなった。", "script": "貴州省は山が多く、民国初期は交通が不便で送金手数料も高かったため、商人や住民は高額切手を買って郵送し、送金の代わりにしていました。しかし治安が悪く盗賊が横行し、高額切手も略奪の対象となって郵便業務と郵便物の安全に影響しました。そこで1925年、北京の郵政総局は北京二版辟雍図の高額切手の橋門の上に、貴州の略称「黔」を赤の5号宋朝体で加刷し、省外での流通を制限しました。5種の額面が用意され、1円・2円・5円は発行、10円と20円は未発行でした。今回はこの未発行2種の全シート（各50枚）を展示しています。", "facts": ["経緯：切手を送金代わりに → 強盗の標的に → 省内限定の加刷", "加刷位置：辟雍図の橋門の上；赤の5号宋朝体「黔」", "5種：1円・2円・5円は発行；10円・20円は未発行"], "items": ["「黔」加刷 10円・20円 未発行切手 全シート各1（各50枚）"], "qa": [["「黔」とは？", "貴州省の略称です。"]], "tip": "地域限定加刷3兄弟をつなげて：A04「黔」貴州、A05「限滇省」雲南、B01の「限新省」新疆。"}, {"id": "A05", "cat": "A", "star": 2, "en": "北京二版帆船「限滇省貼用」郵票（未發行全格）", "title": "北京二版帆船「限滇省貼用」加刷切手（未発行全シート）", "year": "1926年（民国15年）", "src": "図録 p.140–141", "tags": ["地域限定加刷", "雲南", "未発行", "全シート", "北京二版", "帆船"], "hook": "雲南省内でしか使えない切手——茶色の6分だけは加刷されたのに発行されなかった。", "script": "1926年、財政部印刷局は楷書の凸版で「限滇省貼用」（雲南省内専用）の5文字を、北京二版の帆船・農穫・辟雍切手の上部に横書きで加刷しました。発行は20種。5円は薄紙、3分は厚紙と薄紙の両方、その他は厚紙です。ほかに茶色の6分も加刷されましたが発行されませんでした。今回はこの未発行の茶色6分の全シート（10×5、50枚）を展示しています。", "facts": ["財政部印刷局；楷書凸版；切手上部に横書き", "原切手：北京二版 帆船・農穫・辟雍", "発行20種：5円は薄紙、3分は厚紙・薄紙、その他は厚紙", "茶色6分：加刷済みだが未発行"], "items": ["「限滇省貼用」北京二版帆船 茶色6分 未発行 全シート（10×5、50枚）"], "qa": [["「滇」とはどこ？", "雲南省の略称です。"]]}, {"id": "A06", "cat": "A", "star": 2, "en": "鄭成功像郵票　5元全張", "title": "鄭成功像切手　5元 全シート", "year": "1950年（民国39年6月26日から）", "src": "図録 p.142–143", "tags": ["台湾移転後", "普通切手", "全シート", "鄭成功"], "hook": "鄭成功像の最高額5元切手、200枚の全シート。", "script": "政府の台湾移転後、鄭成功を手本として失地回復と台湾を復興基地として建設する使命が強調され、各額面の普通切手に鄭成功の肖像が使われました。1950年6月26日から発行。図案は国立台湾博物館所蔵の延平郡王鄭成功の肖像画をもとに描かれ、「延平郡王鄭成功」と表示されています。全13種のうち、最高額5元の全シート（10×20、200枚）を展示しています。", "facts": ["原画：国立台湾博物館所蔵「延平郡王鄭成功」肖像画", "全13種：3分、1角、1角5分、2角、3角、4角、5角、8角、1元、1元5角、1元6角、2元、5元"], "items": ["最高額 5元 全シート（10×20、200枚）"], "qa": []}, {"id": "A07", "cat": "A", "star": 1, "en": "臺灣防癆協會成立紀念票　陰版反印試樣票", "title": "台湾防癆協会成立記念切手　陰版逆刷り試刷", "year": "1953年（民国42年7月1日）", "src": "図録 p.144–145", "tags": ["台湾移転後", "記念切手", "試刷", "公衆衛生"], "hook": "切手で結核予防を宣伝——展示は珍しい「陰版逆刷り」の試刷一式。", "script": "1952年、内政部は結核予防を強化し、中央衛生実験院と台湾省の各衛生機関にツベルクリン反応検査とBCG接種を行わせました。同年8月1日に防癆協会が設立されました。郵政総局は結核予防の宣伝と国民の健康増進のため、1953年7月1日に記念切手を発行。額面は4角・1.6元・2元・5元の4種です。今回は特殊な陰版逆刷りの試刷一式を展示しています。", "facts": ["1952年：ツベルクリン検査＋BCG接種；8月1日に防癆協会設立", "1953年7月1日発行、4種：4角、1.6元、2元、5元"], "items": ["特殊な陰版逆刷り試刷 一式（英文：reverse-printed die proofs）"], "qa": [["試刷とは？", "本番の印刷前に図案や色を確認するための刷りで、数が極めて少なく販売もされません。"]]}, {"id": "A08", "cat": "A", "star": 3, "en": "西螺大橋落成紀念票　無齒試印樣張", "title": "西螺大橋落成記念切手　目打ちなし試刷", "year": "1954年（民国43年1月28日）", "src": "図録 p.146–147", "tags": ["台湾移転後", "記念切手", "試刷", "目打ちなし", "交通インフラ", "西螺大橋"], "hook": "当時極東最長の道路橋——試刷のうち2枚は発行切手と色が違う。", "script": "台湾の川は幅が広く、いくつもの大河が南北の交通を分断していました。濁水渓は台湾最大の川で、南北を結ぶ橋が不可欠でした。西螺大橋は1953年1月28日に開通、中米の技術協力で建設され、長さ1,938メートル、幅7.5メートル、31径間で、当時極東最長の道路橋でした。橋面には台湾製糖の鉄道網につながる線路もありました。開通1周年の1954年1月28日に記念切手4種を発行。今回は4種すべての目打ちなし試刷を展示しています。1.6元と3.6元の2枚は発行切手と色が違うので、比べてみてください。", "facts": ["開通：1953年1月28日；中米技術協力", "長さ1,938m、幅7.5m、31径間；当時極東最長の道路橋", "橋面に台湾製糖の鉄道線路", "切手発行：1954年1月28日、4種：4角、1.6元、3.6元、5元"], "items": ["4種すべての目打ちなし試刷；1.6元・3.6元の2枚は発行切手と色が異なる"], "qa": [["発行された切手とどこが違う？", "目打ちがなく、1.6元と3.6元の2枚は色が違います。"]]}, {"id": "A09", "cat": "A", "star": 2, "en": "造林保林常用票　未印面值無齒試印樣張", "title": "造林保林普通切手　額面なし目打ちなし試刷", "year": "1954年／1955年", "src": "図録 p.148–149", "tags": ["台湾移転後", "普通切手", "試刷", "目打ちなし", "植樹節", "環境"], "hook": "額面のない試刷6枚——うち5枚は発行切手と色が違う。", "script": "国の発展には長期計画と環境保護が必要で、森林は重要な資源です。孫文の造林建設の遺訓に従い、1930年に毎年3月12日が植樹節と定められました。政府の台湾移転後は緑化と水力開発のために造林が進められました。郵政総局はこれをテーマに、1954年3月12日に第1組（4角・10元）、1955年4月1日に第2組の高額切手（20元・50元）を発行しました。今回は額面の入っていない目打ちなし試刷6枚を展示。50元以外の5枚は発行切手と色が異なります。", "facts": ["1930年：3月12日を植樹節に制定", "第1組：1954年3月12日、4角・10元", "第2組（高額）：1955年4月1日、20元・50元"], "items": ["額面なし目打ちなし試刷6枚：4角2枚、10元2枚、20元・50元各1枚；50元以外の5枚は色が異なる"], "qa": []}, {"id": "A10", "cat": "A", "star": 1, "en": "郵政60週年紀念票　無齒母版試樣", "title": "郵政60周年記念切手　目打ちなし原版試刷", "year": "1956年（民国45年3月20日）", "src": "図録 p.150–151", "tags": ["台湾移転後", "記念切手", "原版試刷", "郵政節"], "hook": "国営郵政60周年を記念——同じ額面の2色の原版試刷。", "script": "郵政は国の重要な通信機関です。中国の郵便は最初は海関（税関）が兼営し、1896年3月20日に国営となりました。政府の台湾移転後は大小の町村に郵便局が置かれ、人々にとって身近な存在になりました。1956年3月20日、郵政60周年を記念して4種（4角・1元・1.6元・2元）が発行されました。今回は4角の2色の目打ちなし原版試刷を展示しています。", "facts": ["1896年3月20日：海関兼営から国営へ（解説による）", "1956年3月20日発行4種：4角、1元、1.6元、2元"], "items": ["4角 色違いの目打ちなし原版試刷 2枚"], "qa": [["3月20日の意味は？", "解説では1896年3月20日に国営化されたとあり、台湾の郵政節でもあります（補足）。"]]}, {"id": "A11", "cat": "A", "star": 1, "en": "臺灣省橫貫公路開工週年紀念票　母版試印樣", "title": "台湾省横貫公路着工1周年記念切手　原版試刷", "year": "1957年（民国46年10月25日）", "src": "図録 p.152–153", "tags": ["台湾移転後", "記念切手", "原版試刷", "交通インフラ", "中部横貫公路"], "hook": "同じ4角切手の6色の試刷——デザイナーの色選びが見える。", "script": "台湾の東西は中央山脈に隔てられ、かつては南北の端を回り道するしかなく、経済や文化の発展を大きく妨げていました。台湾省横貫公路は1956年7月7日に着工、本線186km、支線120kmで、東西の近道となるだけでなく、沿線の鉱業・農林業・牧畜・水利灌漑の発展も促しました。1957年10月25日に着工1周年記念切手3種を発行。今回は4角の原版による色違い試刷6枚を展示しています。", "facts": ["着工：1956年7月7日；本線186km、支線120km", "1957年10月25日発行3種：4角、1.4元、2元"], "items": ["4角 原版による色違い試刷 6枚"], "qa": []}, {"id": "A12", "cat": "A", "star": 3, "en": "上海版飛雁無面值郵票　全張", "title": "上海版飛雁額面なし切手　全シート", "year": "1949年（民国38年末）", "src": "図録 p.154–155", "tags": ["台湾移転後", "額面なし", "全シート", "飛雁"], "hook": "額面のない切手が、1949年に郵政が台湾へ移った過渡期を記録している。", "script": "1949年末、郵政総局は政府とともに台北へ移りました。新しい切手が刷り上がるまで、大陸から持ち込んだ上海版飛雁切手に新台湾ドルの額面を加刷して使いました。原切手は大東書局上海印刷所の印刷で、地球の上を2羽の雁が飛ぶ図案、額面は印刷されていません。今回は原切手の全シート（20×10、200枚）を展示しています。英文解説では台湾で極めて珍しい品とされています。", "facts": ["1949年末 郵政総局が台北で業務開始（英文：1949年12月）", "原切手：大東書局上海印刷所；地球上を飛ぶ2羽の雁；額面なし", "台湾では新台湾ドル額面を加刷して使用"], "items": ["原切手 全シート（20×10、200枚）"], "qa": [["額面がないのにどう使ったの？", "台湾ではまず新台湾ドルの額面を加刷してから使いました。展示は加刷前の原切手です。"]]}, {"id": "B01", "cat": "B", "star": 3, "en": "「民國四珍」錯異票", "title": "「民国四珍」エラー切手", "year": "1914–1925", "src": "図録 p.156–159", "tags": ["民国四珍", "宮門倒", "逆加刷", "エラー", "帆船切手", "世界的名品"], "hook": "24年続いた帆船切手から生まれた世界級エラー4点が、今日ここに勢ぞろい。", "script": "帆船切手は中華民国最初の普通切手シリーズで、1913年から1936年まで24年間使われました。長い発行期間に珍しい試作・見本・変種が多く生まれ、その頂点が「民国四珍」です。1つ目、北京一版 圖橋牌坊2元の中心図案逆刷り、通称「宮門倒」。市場に出たのは2シート100枚だけ、角付きは2点、右上角はこの1点のみです。2つ目、北京一版帆船3分に「暫作貳分」の逆加刷、単片14枚と実逓封2通。3つ目、北京二版帆船4分に「暫作叁分」の逆加刷、わずか10枚。4つ目、北京一版帆船1円「限新省貼用」加刷の「新」と「省」の位置が入れ替わったもので、田型ブロックは2点しか知られていません。", "facts": ["① 1914 北京一版 2元 黒・青 中心逆刷り（宮門倒）｜市場流出は2シート計100枚のみ；角付き2点、右上角は1点（展示品）｜旧蔵 Huang", "② 1922 北京一版帆船3分「暫作貳分」逆加刷（青緑）｜単片14枚、実逓封2通｜旧蔵 Fletcher, Beckeman", "③ 1925 北京二版帆船4分「暫作叁分」逆加刷（灰）｜10枚（未使用7、使用済3）｜旧蔵 Ruland, Starr, Olsson", "④ 1915 北京一版帆船1円「限新省貼用」（黒・橙）「新」「省」入れ替わり｜田型ブロック2点のみ（展示品は田型）｜旧蔵 Pederson, Lee"], "items": ["民国四珍の4種すべて（宮門倒は右上角付き、限新省入れ替わりは田型ブロック）"], "qa": [["なぜ印刷ミスの方が価値が高いの？", "ミスの多くは出荷前に見つかって廃棄されるため、外に出たものは極めて少なく希少です。"], ["「Ex Huang」とは？", "「Ex」はかつての著名な所蔵者を示し、来歴（プロヴナンス）の一部です。"], ["いくらくらいするの？", "推奨回答：存在数が極めて少ない名品で公開価格はなく、ガイドでは評価額をお答えしていません。"]], "tip": "行列での最強の掴み：「宮門倒の角付きは世界に2点、右上角はこの1点だけです。」", "exhibitor": "姚頡林氏（Frank Yao）"}, {"id": "B02", "cat": "B", "star": 3, "en": "劉銘傳印備未用的臺灣龍馬郵票全張（紅、綠）", "title": "劉銘伝が準備し未使用に終わった台湾龍馬切手 全シート（赤・緑）", "year": "1888年（光緒14年）", "src": "図録 p.160–161", "tags": ["清代台湾", "劉銘伝", "龍馬切手", "全シート", "現存唯一", "未使用"], "hook": "ロンドンで精巧に印刷され、3か月遅れて届き一度も使われなかった台湾の切手——赤と緑の全シートは各1枚のみ現存。", "script": "1884年、劉銘伝が台湾の統治を担いました。清仏戦争でフランス軍が台湾を攻撃した教訓から、戦時の軍政一体と迅速な情報伝達を目指し、1888年に台湾の駅站制度を改革しました。通信の証票として格式ある精巧な切手を使おうと、淡水の英国領事館を通じてロンドンの文具商ワストネスに発注し、ブラッドベリー・ウィルキンソン社が凹版彫刻で印刷しました。赤と緑の2色、額面はいずれも20文、1シート5×5の25枚で、「上に龍、下に馬」の図案、右に「大清臺灣郵政局」、左に「制錢貳拾文」、上下に英文があります。しかし製作に時間がかかり、台湾に届いたのは1888年6月、郵便開始の3か月後。劉銘伝はすでに現地の紙で刷った簡易な証票を使っていたため、この龍馬切手は郵便に使われず、のちに文字を加刷して鉄道切符に転用されました。展示は現存唯一の赤・緑2色の全シートです。", "facts": ["発注経路：淡水英国領事館 → ロンドンの文具商 P. W. Wastnace → Bradbury, Wilkinson & Co.（凹版彫刻）", "赤・緑2色；額面各20文；1シート5×5＝25枚", "図案「上龍下馬」；右に「大清臺灣郵政局」、左に「制錢貳拾文」、上下に英文", "1888年6月着（駅站郵便開始の3か月後）；すでに現地紙の「臺灣郵票」「郵政商票」を使用", "郵便には未使用；のちに加刷して鉄道切符に転用"], "items": ["現存唯一の赤・緑2色 全シート（各5×5、25枚）"], "qa": [["なぜ使われなかったの？", "1888年6月に届いた時には郵便開始から3か月が過ぎ、簡易な現地切手がすでに使われていました。"], ["その後どうなった？", "解説によれば、のちに文字を加刷して鉄道切符として使われました。"]], "tip": "B04・B06とつなげて「劉銘伝の台湾郵政」テーマで。", "exhibitor": "李鏡禹氏（King Yue Lee）"}, {"id": "B03", "cat": "B", "star": 2, "en": "官辦文報局跨省寄遞大官封", "title": "官営文報局による省間逓送の大型公文封", "year": "1890年・1892年（光緒16・18年）", "src": "図録 p.162–165", "tags": ["清代台湾", "文報局", "大型公文封", "公文書", "省間"], "hook": "清代台湾の公文書はどうやって海を越え南京や福建へ届いたのか？封筒の赤い手書き記入印を見てください。", "script": "この2通は清朝の官営「文報局」が運んだ大型公文封です。図1は1890年9月16日、台北の「臺灣善後總局」から南京の直隷州の官員宛てで、中の公文書も残っています。左下に縦書き枠なしの赤い印「光緒十　年　月　日到臺北文報局　月　日　時遞出」があり、空欄に「六」年「八」月「初三」日と手書きされています。図2は1892年10月20日、台湾第2代巡撫の邵友濂が台北から福建福寧府の長官宛てに送ったもので、福州文報局で中継され、「十」月「初八」日受領、「初九」日即送と記入されています。", "facts": ["図1：1890年9月16日 台北「臺灣善後總局」→ 南京（試用直隷州、正五品官）；公文書在中；台北文報局の赤い手書き印；南京到着日の記載なし", "図2：1892年10月20日 巡撫邵友濂（第2代）→ 福建福寧府；福州文報局印：十月初八受領、初九即送"], "items": ["図1 台北文報局経由 南京宛て大型公文封", "図2 福州文報局中継の大型公文封"], "qa": [["文報局とは？", "清代の官営の公文書逓送機関です。"]], "exhibitor": "何輝慶氏（Huei-Ching Ho）"}, {"id": "B04", "cat": "B", "star": 2, "en": "官辦驛站郵政島內寄遞大官封", "title": "官営駅站郵便による島内逓送の大型公文封", "year": "1894年（光緒20年）", "src": "図録 p.166–169", "tags": ["清代台湾", "駅站", "大型公文封", "鹿港", "滬尾", "淡水"], "hook": "1894年、鹿港から淡水まで6日——途中の駅ごとに印を押し時刻を記入。", "script": "劉銘伝が創設した台湾の駅站郵便で島内を運ばれた大型公文封です。図3は「辦理鹿港稅釐分局委員會」から「辦理臺北滬尾海關邵」宛てで、1894年6月10日に鹿港を出発。彰化城站、大甲站、吞霄腰站、後壠站、竹塹城站、中壢站、台北総站を経て滬尾旁站へ。途中で時刻を記入する駅站印が押され、6日かけて台北に着きました。図4は1894年12月19日、淡水県の長官から滬尾海関の官員宛て。翌日の卯の刻（午前5〜7時）に台北総站を通過し、同日の午の刻（午前11時〜午後1時）に滬尾旁站へ到着した極短距離の駅站封で、台北総站を通った駅站封として現在確認されている最も遅いものです。", "facts": ["図3：1894年6月10日 鹿港 → 台北滬尾；所要6日", "経路：彰化城站 → 大甲站 → 吞霄腰站 → 後壠站 → 竹塹城站 → 中壢站 → 台北総站 → 滬尾旁站", "図4：1894年12月19日 淡水県 → 滬尾海関；卯の刻に台北総站、同日午の刻に滬尾旁站；駅站印2つ", "図4は台北総站経由で確認されている最も遅い駅站封"], "items": ["図3 鹿港→滬尾 駅站大型公文封", "図4 淡水→滬尾 極短距離駅站封"], "qa": [["これらの駅は今のどこ？", "彰化、大甲、吞霄（現・通霄）、後壠（現・後龍）、竹塹（現・新竹）、中壢、台北、滬尾（現・淡水）です。"], ["卯の刻・午の刻は何時？", "卯の刻は午前5〜7時ごろ、午の刻は午前11時〜午後1時ごろです。"]], "exhibitor": "何輝慶氏（Huei-Ching Ho）"}, {"id": "B05", "cat": "B", "star": 3, "en": "民辦民信局跨省寄遞紅條封（胡適父母家書）", "title": "民営民信局による省間逓送の紅条封（胡適の両親の家書）", "year": "1892年・1893年（光緒18・19年）", "src": "図録 p.170–173", "tags": ["清代台湾", "民信局", "紅条封", "胡適", "家書", "台南"], "hook": "学者・胡適の父と母が台南から安徽の実家へ送った手紙——民間の「汽船信局」のリレーで届けられた。", "script": "紅条封は中央に赤い帯のある伝統的な中国式封筒です。図5の差出人は胡適の父・胡鉄花で、当時台南で官職にありました。1892年4月4日に台南の全泰成輪船信局から発送され、廈門の全泰成輪船信局、上海の全泰盛長江輪船局、金陵（南京）の全泰盛輪船信局とリレーされ、安徽省屯溪の胡家に届きました。図6の差出人は胡適の母・馮順弟で、1893年7月1日、台南の協興昌記輪船信局から廈門の支店を経て、屯溪の胡三老爺嘉言宛てに送られました。当時、馮順弟は胡適ら子どもを連れて台南に身を寄せたばかりで、無事到着を知らせる家書と思われます。", "facts": ["図5：1892年4月4日 胡鉄花（胡適の父）台南 → 安徽屯溪；台南全泰成 → 廈門全泰成 → 上海全泰盛長江輪船局 → 金陵全泰盛輪船信局", "図6：1893年7月1日 馮順弟（胡適の母）台南 → 屯溪 胡三老爺嘉言；台南協興昌記 → 廈門協興昌記", "背景：馮順弟が子どもたちと台南に来たばかり、無事を知らせる家書とみられる"], "items": ["図5 胡鉄花の紅条封", "図6 馮順弟の紅条封"], "qa": [["民信局とは？", "民間経営の書信逓送業者です。この2通は沿岸の汽船信局がリレーで運びました。"], ["胡適は子どもの頃台湾にいたの？", "解説によれば、1893年に母が胡適ら子どもを連れて台南に身を寄せました。"]], "tip": "有名人の物語は行列の注意を引きやすく、導入にぴったり。", "exhibitor": "何輝慶氏（Huei-Ching Ho）"}, {"id": "B06", "cat": "B", "star": 3, "en": "小龍郵票紅色加蓋「臺灣郵票」／\"FORMOSA\"（海關郵政試印）", "title": "小龍切手 赤色加刷「臺灣郵票」／\"FORMOSA\"（海関郵政の試作）", "year": "1888年前後", "src": "図録 p.174–175", "tags": ["清代台湾", "海関郵政", "小龍", "FORMOSA", "試作", "ガター", "現存唯一", "ロバート・ハート"], "hook": "海関が台湾郵政を取り込もうとして試作したFORMOSA切手——結局幻に終わった。", "script": "1888年、海関総税務司ロバート・ハート卿は、巡撫劉銘伝が1888年3月に創設した台湾郵政が成果を上げ、郵便規則も公布されていることに注目し、これを国営の海関郵政に組み込もうとしました。そこで海関小龍の3分・5分切手を少量試し刷りし、英文\"FORMOSA\"または漢字「臺灣郵票」を加刷、一部は新しい12目打ち機で目打ちしました。用紙は透かしなし、版の配列も正式発行品とまったく異なり、3分は第V版式、5分は第VI版式と呼ばれます。全6種のうち、5分目打ちなし\"FORMOSA\"加刷が最も少なく、1シートしか見つかっていません。全種をまたぐガター付き8枚ブロックは現存1点のみで、それがこの展示品です。海関は淡水と打狗（高雄）に税関と郵便部門を置いていましたが、1895年の日本統治開始まで台湾で海関郵政は開設されず、台湾専用に作られたこの切手は幻となりました。", "facts": ["人物：海関総税務司 ロバート・ハート卿；台湾巡撫 劉銘伝（1888年3月 台湾郵政創設）", "試作：海関小龍 3分・5分、赤色加刷\"FORMOSA\"または「臺灣郵票」", "特徴：透かしなし用紙；版配列が正式品と異なる（3分＝第V版式、5分＝第VI版式）；一部12目打ち", "全6種：3分目打ちあり2、5分目打ちあり2、5分目打ちなし2（漢字・英文加刷）", "最稀少：5分目打ちなし\"FORMOSA\"、1シートのみ確認", "下耳紙付きガター8枚ブロック：現存1点（展示品）", "版の特徴：第VI版式 第15版位 右下角欠け；第V版式 第12版位 左下「3」欠け"], "items": ["現存唯一のガター8枚ブロックと関連試作"], "qa": [["ガター（過橋）とは？", "シート中央の2つのペーンの間の余白帯で、そこをまたぐブロックは珍しいものです。"], ["打狗はどこ？", "現在の高雄です。"]], "exhibitor": "黃明正氏（Ming-Jeng Huang）"}, {"id": "C01", "cat": "C", "star": 3, "en": "台灣：台灣印花稅票（1908–1949）", "title": "台湾：台湾収入印紙（1908–1949）", "year": "1908–1949｜8フレーム", "src": "資料② p.1–2", "tags": ["台湾", "収入印紙", "日本統治期", "光復", "加刷", "エラー", "現存唯一"], "hook": "日本の収入印紙から「中華民國臺灣省」加刷へ——印紙も政権交代を物語る。", "script": "1895年に台湾が日本に割譲され、1908年6月21日に「台湾印紙税規則」が施行されて日本の収入印紙が台湾で使われるようになりました。1945年10月25日の光復で印紙税の徴収は中断しましたが、人々は財産と権利を守るため日本の印紙を貼り続けました。1946年1月初め、台湾省行政長官公署財政処は郵電管理委員会に日本の印紙の販売停止を求め、在庫に「中華民國臺灣省」と加刷して郵便局で販売し、1944年1月18日公告の中華民国印紙税率表に基づき貼付させました。1946年8月16日に「台湾印紙税法」が公布され、台湾省専用の収入印紙が使われ始めました。この作品は見本、変種、各種書類での使用例を展示し、重要品は赤い台紙で示しています。", "facts": ["1908年6月21日（明治41年）台湾印紙税規則施行", "1945年10月25日 光復、日本の印紙は民間で継続使用", "1946年1月初め：日本の印紙に「中華民國臺灣省」加刷し郵便局で販売；1944年1月18日の税率表", "1946年8月16日 台湾印紙税法公布、台湾省専用印紙使用開始", "見どころ：重要品は赤い台紙付き"], "frames": [["第1–2フレーム", "日本統治期：明治型印紙、震災暫用印紙、大正型印紙、台湾娯楽税証紙、台湾総督府帽子検査証紙、印紙貼用済", "台湾最古の印紙使用書類；台湾で唯一の明治型50円使用書類；大正型10円・100円の未使用ペーン；現存3枚の1つの赤色帽子検査証紙"], ["第3–4フレーム", "日本の収入印紙に手押し「中華民國臺灣省」", "最古日付の使用例；台湾省印紙税法施行初日の使用例；唯一の10銭逆加刷（領収書貼付）；現存2点の1つ3銭使用領収書；唯一の10銭L3型；現存2点の1つ1銭使用領収書；唯一の10円加刷"], ["第5フレーム", "機械押し「中華民國臺灣省」", "唯一の50銭小字加刷と使用書類；5円田型；1円貼付の大学卒業証書"], ["第6フレーム", "日本の収入印紙の改値加刷（台幣）", "10c/5s額面「台幣拾錢」脱落の領収書；給与明細に$1/3sの誤加刷「台華民國」「中民華國」2枚；抵当借款契約書の$50/5r補加刷"], ["第7フレーム", "国父像収入印紙", "見本帳；兵役免除証"], ["第8フレーム", "国父像ヤシの木図印紙；台幣から新台幣への改値", "「貳伍分角」エラー（2〜4文字目の位置違い）；唯一の「貳圓分伍」エラー未使用"]], "qa": [["収入印紙と切手の違いは？", "収入印紙は税金の納付証明で、領収書・契約書・証書に貼ります。切手は郵便料金の支払いに使います。"], ["「台華民國」「中民華國」とは？", "加刷の文字順を誤ったエラーで、給与明細に貼られています（第6フレーム）。"]], "tip": "来場者に受けるのは第6フレームの文字順エラーと、第5フレームの印紙付き大学卒業証書。", "refs": "臺灣省行政長官公署公報；She Horng Wu, Revenue stamps of Taiwan area Republic of China, 1st ed., 1981"}, {"id": "C02", "cat": "C", "star": 2, "en": "台灣郵資票（美規）", "title": "台湾ATM切手（米国規格）", "year": "1995–2000｜5フレーム", "src": "資料② p.3–5", "tags": ["ATM切手", "自動販売機", "国父紀念館", "中正紀念堂", "現代郵便"], "hook": "世界で台湾・米国・アルゼンチンだけが使った「米国規格」のATM切手。", "script": "中華郵政は自動販売機の利便性と時代の流れを受け、1995年7月31日に米国から3台の販売機を導入し、第1版「国父紀念館」ATM切手を30万枚発行しました。好評だったため、1996年11月5日に第2版「中正紀念堂」を270万枚発行、実際の使用は約45万枚余りでした。しかし機械の故障が多く、メーカーも保守できなかったため、2000年初めに使用停止となりました。「米国規格」とは米国のABN社が印刷した独特の規格で、約22.1×25.0mm、上下は目打ちなし、左右に目打ちがあり、米国Unisys PMC製の販売機でしか売られません。この規格を使ったのは台湾・米国・アルゼンチンだけです。作品は2つの版の版式、印字書体、裁断のずれを研究し、国内外の実逓封なども展示しています。", "facts": ["1995年7月31日：Unisys PMC販売機3台導入；第1版「国父紀念館」30万枚", "1996年11月5日：第2版「中正紀念堂」270万枚、実使用約45万枚余り", "2000年初め：故障多発、保守不能で使用停止", "規格：ABN印刷、約22.1×25.0mm、上下目打ちなし・左右目打ちあり", "使用国：台湾・米国・アルゼンチンのみ"], "frames": [["第1フレーム", "第1版：印刷版式、テスト券、印字研究と変種", "最高額500元の実逓便"], ["第2フレーム", "第1版：額面印字のインク汚れ、濃淡、脱落、重複", "国内外の実逓便"], ["第3フレーム", "第2版：版式、固定版式、版欠け、印字書体、インク汚れ", "高額券ストリップと実逓便"], ["第4フレーム", "第2版：脱落、重複、多重変種", "国内実逓便"], ["第5フレーム", "第2版の特殊料金・受領証での使用", "中国大陸・国際宛て、高額券貼付便"]], "qa": [["ATM切手は本当の切手？", "機械がその場で額面を印字する郵便料金証紙で、切手と同じように使えます。"]]}, {"id": "C03", "cat": "C", "star": 1, "en": "中華郵政國際航空郵簡（1953–1972）（暫譯）", "title": "中華郵政 国際航空書簡（1953–1972）（仮訳）", "year": "1953–1972", "src": "資料② p.6", "tags": ["航空書簡", "郵便料金", "台湾移転後", "香港", "マカオ", "アジア・オセアニア"], "hook": "折りたためばそのまま封筒になる1枚の紙——額面から地域ごとの航空料金が分かる。", "script": "UPUの規定に沿い利用者の便を図るため、中華郵政は1953年7月1日に料額印面付きの航空書簡を発行しました。1949年に大陸で作られたものは料額印面のない書式用紙でした。国際用は1953年の3元輸送機図、1954年の3元4発機図、そして1972年まで使われた6元ジェット機図。香港・マカオ宛ては1955年4月20日から1.5元に値上げ（以前は国内と同じ1元）で、1.5元4発機図と1962〜1970年の2元ジェット機図があります。アジア・オセアニア宛ては1966年11月1日から4元ジェット機図が1972年まで使われました。この作品は国内用を含まず国際用のみで、試刷、見本、未使用、実逓品、特に料金追加・書留・珍しい宛先のものを集めています。", "facts": ["1953年7月1日 料額印面付き航空書簡を初発行（1949年大陸版は料額なし書式用紙）", "国際：1953年 3元 輸送機；1954年 3元 4発機；6元 ジェット機（1972年まで）", "香港・マカオ：1955年4月20日から1.5元（以前は1元）；4発機1.5元；ジェット機2元（1962–1970）", "アジア・オセアニア：1966年11月1日から4元ジェット機（1972年まで）；以前は国際と同じ5元", "範囲：国際用のみ；試刷・見本・未使用・実逓（料金追加、書留、珍しい宛先）"], "frames": [["1.1", "1953 国際 輸送機図", ""], ["1.2", "1954 国際 4発機図", ""], ["1.3", "1962 国際 ジェット機図", ""], ["2.1", "1955 香港・マカオ 4発機図", ""], ["2.2", "1962 香港・マカオ ジェット機図", ""], ["3.1", "1966 アジア・オセアニア ジェット機図", ""]], "qa": [["航空書簡とは？", "料金が印刷済みで、便箋を折るとそのまま封筒になる航空郵便用紙です。同封物は入れられません。"]], "refs": "Han Ho-Yun 1984; Donald R. Alexander 1993; Lin Chang-Long, Postal Letter Sheets of ROC (1894–2003)"}, {"id": "C04", "cat": "C", "star": 2, "en": "國父像紐約版郵票（暫譯）", "title": "孫文像ニューヨーク版切手（仮訳）", "year": "抗日戦争期｜8フレーム", "src": "資料② p.7", "tags": ["抗日戦争", "孫文像", "ニューヨーク版", "加刷", "広東", "改値", "鑑定書"], "hook": "米国の印刷会社が初めて中国のために作った切手——戦時外交の証。", "script": "日中戦争初期、多くの中国切手が香港で印刷され、一部はニューヨークのアメリカン・バンクノート社が印刷しました。これが「孫文像ニューヨーク版」です。郵便史上の意義は、米国の印刷会社が初めて中国の切手を作ったことで、両国の実務的な外交関係を示しています。全16種で、インフレの最中に発行されたため一部の額面は実用に合いませんでした。1942年、広東の大部分が日本軍に占領されたため、未占領地域からの密輸を防ぐ目的で広東限定の加刷が行われ、その後各地で独自の加刷もされました。封筒上の地方加刷は極めて珍しく、10点未満のものもあります。作品は1分・20分・40分への改値、軍郵・剿匪・儲金加刷、国幣改値などを、試刷・見本・版式・エラー・実逓品とともに展示しています。右下に（C）印があるものは鑑定書付きです。", "facts": ["印刷：American Bank Note Co.（ニューヨーク）— 中国切手を印刷した初の米国企業", "全16種；インフレ期の発行", "1942年 密輸防止のため広東限定加刷", "地方加刷の実逓封は極めて稀、10点未満のものも", "右下に（C）印＝鑑定書付き"], "frames": [["第1フレーム", "半分〜1分：試刷、版式、エラー、郵便使用", ""], ["第2フレーム", "2分〜8分", ""], ["第3フレーム", "8分〜17分", ""], ["第4フレーム", "25分〜50分", ""], ["第5フレーム", "1元〜5元", ""], ["第6フレーム", "5元〜20元", ""], ["第7フレーム", "1分・20分・40分改値；Pai Cheng印刷局試作（東北限定）；軍郵・儲金", ""], ["第8フレーム", "剿匪切手（通貨管理）；国幣改値（暫售、上海聯合、重慶中央、大東加刷）", ""]], "qa": [], "refs": "Lee Sung Ping 1969/1963; Ma Ren Quan 1988; Chan Shiu Hon 2000"}, {"id": "C05", "cat": "C", "star": 3, "en": "大清國家郵政史（1897–1911）", "title": "大清国家郵政史（1897–1911）", "year": "1897–1911｜8フレーム", "src": "資料② p.8–11", "tags": ["清代", "国家郵政", "海関郵政", "消印", "外国局", "民信局", "孫文", "現存唯一"], "hook": "海関の代行から国家郵政へ——大清郵政はわずか15年、それでも民国郵政の基礎を築いた。", "script": "中国の近代郵便は1867年、英国人主導の海関による試行郵便に始まり、外国人が30年間運営した後、1897年2月20日に「大清国家郵政局」が設立されました。当初は海関の郵便局を中心に31局で、その後急速に拡大しました。1899年4月から全国統一の英漢日付印が使われ1923年まで続き、1904年からは旧暦の干支で日付を示す第2段階の消印が1911年末まで使われました。作品は国内外の料金や、朝鮮・新疆・モンゴル・チベット・雲南など辺境や特殊地域宛ての郵便も整理しています。最後のフレームには「中華臨時大総統孫逸仙君」宛ての封筒があり、大清郵政の最も遅い使用例です。", "facts": ["1867年 海関試行郵便（英国人主導）", "1897年2月20日 大清国家郵政局（CIP）設立；当初31局；銀両から銀元へ", "1899年4月：第1段階 統一英漢日付印（1923年まで）；支局・代弁所・郵便箱を設置；山東・福建に独自の消印", "1904年から：第2段階 旧暦干支印（1911年末まで）", "重点地域：朝鮮、新疆、モンゴル、チベット、雲南"], "frames": [["第1フレーム", "1897年以前：海関時期、朝鮮海関の代行、華洋書信館", "1876年 現存最古の寧波海関封；1879年 鎮江海関 2番目に古い封；1880年 現存3通の1つの煙台海関封；10通未満の外国宛11分料金；1884年 温州第I型海関日付印の唯一の封；1897年 仁川海関→上海の唯一の中式封；1878年 煙台華洋書信館の唯一の封"], ["第2フレーム", "1897年 郵政局設立初期：局の開設と消印の変遷", "北京信力已付印 2番目に古い使用；1897年2月17日 最古のR字書留印；1897年5月7日 北京大円印の最古使用；1897年6月7日 温州大円印の最古封；現存3通の龍州大円印書留封；現存3通の瓊州閏月大円印封；唯一の天津閏月大円印封；天津「CUSTOMS」削り取り印の最古・最晩"], ["第3フレーム", "1899年4月から 英漢日付印・英漢楕円印；辺境の墓碑型印", "初年使用の英漢日付印7通（北京、廈門、福州、広州、天津、沙市）；雲南河口開局2番目の封；チベット地域の打箭爐墓碑型印；東北最初の瓦房店墓碑型印"], ["第4フレーム", "山東・福建の地域独自の消印；第2次統一の干支印", "極初期の日月印；国際郵便に使われた珍しい日月印；清代第3次はがき発行2日目の使用"], ["第5フレーム", "国内外料金の変遷、減額期、差別料金；韓国・台湾・香港・青島・広州湾宛て", "減額期の青島宛て二重書留特殊料金；1897年 鎮江→スウェーデン新聞紙封；煙台→フランス7.5分差別料金；日本局経由の不足料金はがき"], ["第6フレーム", "辺境郵便；民信局・外国局と国家郵政の競争と協力", "1898年 仁川海関→上海；1898年 伊犂のロシア局→北京→民信局で天津；巴塘IPO印→カルカッタ；雲南の馬幇郵便（安南のフランス局経由）；1897年 蒙自→上海 国際経路経由の最古の国内書状；1899年12月 蒙自海関印の最晩；馬幇・麻郷約民信局との合同逓送封（各5通未満）；1902年9月 安南フランス局の最晩"], ["第7フレーム", "新業務：IPO印、送金、大量郵便、移動郵便局、不足料金、僑批", "唯一の冬季料金北京IPO；2番目に古い送金証書；汽船郵便箱の最古使用；輸入封の最古の不足料金切手貼付"], ["第8フレーム", "速達、分割切手、大清郵簡、破損郵便の代封、検閲、小包、配達不能、契約新聞", "北京文報局の速達；唯一の湖南長沙分割切手実逓封；極初期の「破損受領」代封；最古の配達不能付箋；辛亥年「中華臨時大総統孫逸仙君」宛て封（最晩のIPO使用）"]], "qa": [["外国局（客郵）とは？", "外国が中国国内に置いた郵便局です（安南のフランス局、日本局など）。"], ["干支印とは？", "干支（旧暦）で年月日を示す消印で、1904年から導入されました。"]], "tip": "話しやすいのは第8フレームの孫文宛て封と、第6フレームの雲南馬幇郵便。", "refs": "孫君毅『清代郵戳志』1984；張愷升『中國郵戳史』1989；薛聘文『中國郵資』1981"}, {"id": "C06", "cat": "C", "star": 2, "en": "衝突與重建：抗戰時期中國軍郵（1937–1945）（暫譯）", "title": "衝突と再建：抗日戦争期の中国軍事郵便（1937–1945）（仮訳）", "year": "1894–1949｜8フレーム", "src": "資料② p.12", "tags": ["抗日戦争", "軍事郵便", "戦区", "日本陸軍野戦郵便", "CBI", "捕虜", "国共内戦"], "hook": "戦時の軍事郵便で、前線の移り変わりを地図のように描く。", "script": "この作品は国民政府軍の軍事郵便を中心に、日本陸軍の野戦郵便を比較材料として加え、敵味方双方の郵便から前線の変化と防衛の苦難を示しています。1894年の日清戦争、1900年の義和団事件から始まり、民国初期の外モンゴル・チベット危機、1931年の満州事変後の「満州国」郵便不承認問題を経て、1937年7月7日の盧溝橋事件後に戦区ごとの軍事郵便体制が築かれました。1941年の太平洋戦争開戦後は連合国と中国・ビルマ・インド戦域で協力し、1945年の日本降伏後はそのまま国共内戦へ移ります。8フレームの戦時封、傀儡政権の郵便、捕虜関連品、郵便経路の変化で、生き残りをかけて戦った国の郵便史をたどります。", "facts": ["中心：国民政府軍の軍事郵便；比較：日本陸軍野戦郵便", "主要年：1894、1900、1931満州事変、1937年7月7日盧溝橋、1941太平洋戦争、1945降伏", "CBI＝中国・ビルマ・インド戦域；CEF＝中国遠征軍"], "frames": [["第1フレーム", "序章：地政学的起源と辺境危機（1894–1936）", "日清戦争、義和団期の日本軍郵便、清代郵便；外モンゴル危機、軍閥、満州国郵便不承認（1932–36）"], ["第2フレーム", "国民政府軍の軍事郵便体制と金融抗戦（1937年から）", "体制の確立；軍郵貯金・送金"], ["第3フレーム", "衝突と対峙：華中戦線", "第3・第9戦区（1939–44）"], ["第4フレーム", "西北の防壁：西部戦役、宜昌、山西・陝西防衛線", "第9・第5・第1戦区"], ["第5フレーム", "黄河の対峙：西北のゲリラと特殊切手", "第2戦区；軍郵切手の使用"], ["第6フレーム", "占領地と南部前線", "傀儡政権、捕虜、民間人抑留所、華南・西南防衛線"], ["第7フレーム", "海上封鎖とCBI戦域", "日本海軍の沿岸封鎖；ビルマの中国遠征軍"], ["第8フレーム", "終章：戦後の復員と両岸分断（1945–49）", "戦勝接収、復員、国共内戦の転換点"]], "qa": [], "refs": "Elleman, Modern Chinese Warfare, 2001；交通部郵政総局『軍郵史』1976、『中国郵便料金研究』1980（英文書名からの直訳）"}, {"id": "C07", "cat": "C", "star": 1, "en": "中國童子軍郵政活動與歷史（暫譯）", "title": "中国ボーイスカウトの郵便活動と歴史（仮訳）", "year": "1912年から", "src": "資料① p.1", "tags": ["ボーイスカウト", "キャンプ郵便局", "記念印", "南京", "民国"], "hook": "全国ジャンボリーには臨時郵便局があり、専用の記念印が押された。", "script": "中華民国のスカウト運動は民国元年（1912年）、湖北省武昌の文華書院で嚴家麟氏が試行したのが始まりで、その後全国に広がりました。1934年に中国童子軍総会が正式に設立され、会則により蒋介石が会長に就任、1937年には世界スカウト機構への加盟を申請しました。タイトルページでは第2回全国大検閲・大キャンプを紹介しています。南京中山門外の中山陵のそばで開かれ、1,000以上の隊、31の省・市から13,268人のスカウトが参加しました。キャンプには臨時郵便局が置かれ、1936年10月3日の開局初日に二重丸日付印の実逓はがきがあり、北平の盲唖学校も郵便局業務に参加しました。", "facts": ["1912年：武昌文華書院でスカウト試行（嚴家麟、英文 Mr. Yan Jialin）", "1934年：中国童子軍総会設立", "1937年：世界スカウト機構への加盟申請", "第2回全国大検閲・大キャンプ（南京）：1,000隊以上、13,268人、31省市", "キャンプ郵便局の二重丸日付印：1936年（民国25年）10月3日 開局初日", "ほか：上海スカウト第7回大会キャンプ局記念印（1937.6）"], "frames": [["1", "トップページ", ""], ["2", "大陸時代の活動", ""], ["3", "全国ジャンボリー", ""], ["4", "地方の活動", ""], ["5", "記念切手と国際交流", ""]], "qa": []}, {"id": "C08", "cat": "C", "star": 2, "en": "島嶼上的鳥類：邁向生物多樣性，卻步入瀕危之路", "title": "島の鳥たち：生物多様性への道、そして絶滅の危機へ", "year": "テーマ作品｜40頁（5章）", "src": "資料① p.2–3", "tags": ["テーマ作品", "鳥類", "生物多様性", "進化", "保全", "ダーウィン", "ウォレス", "親子"], "hook": "バードガイドのロバートと一緒に、島の鳥の「探索・定着・進化・衰退・回復」を切手でたどる。", "script": "これは物語仕立てのテーマ作品です。主人公ロバートはベテランのバードガイドで、「なぜこれほど多くの珍しい鳥が島にしかいないのか」と問い続けています。島は地球の陸地面積の約3.5%にすぎませんが、陸上生物種の約20%を育み、進化の天然の実験室となってきました。作品はダーウィンとウォレスの研究を受け継ぎ、探索・定着・進化・衰退・回復の5章で構成されています。タイトルページの品は、2001年ソロモン諸島5セント「キノドメジロ」切手に採用された水彩原画で、唯一無二の三つ星です。", "facts": ["島は陸地の約3.5%、陸上生物種の約20%", "5章：探索 DISCOVERY（p.2、7頁）→ 定着 COLONIZATION（p.9、8頁）→ 進化 EVOLUTION（p.17、8頁）→ 衰退 DECLINE（p.25、8頁）→ 回復 RECOVERY（p.33、8頁）；計40頁", "タイトルページの名品：2001年ソロモン諸島5c キノドメジロ切手の採用原画（★★★、唯一）", "記号：★〜★★★＝唯一・希少・エラー・重要品；⇨＝テーマの流れ；🔍＝独自研究"], "frames": [["1 探索", "島をめぐる旅の始まり", "島の成り立ち；科学以前の鳥の神話；博物学者；ガラパゴスの進化の謎；ウォレス線を越えて"], ["2 定着", "鳥はどうやって島にたどり着いたか", "最初の到達；島から島への旅；多様性の差の謎；固有種の形成；隔離が生む独自性"], ["3 進化", "島の生物多様性を間近に", "独自の生態的役割；飛べなくなった鳥；巨大化と小型化；求愛と繁殖；道具の使用；季節移動"], ["4 衰退", "島から鳥のさえずりが消えるとき", "生息地の消失；複合的な圧力；鳥の取引；外来種；気候変動；病気；絶滅した島の鳥"], ["5 回復", "島の鳥の未来を守る", "再発見；人と生態系の共存；保護区；外来捕食者の管理；持続可能な未来"]], "qa": [["テーマ作品と伝統作品の違いは？", "テーマ作品は郵便物で物語を語り、伝統作品は特定の切手そのものの版式・変種・使用を研究します。"]], "tip": "子ども連れの家族に一番のおすすめ：物語性が強く図版も豊富。", "refs": "Quammen 1997, The Song of the Dodo; Myers et al. 2000, Nature 403:853–858"}], "top": [["B01", "宮門倒：角付き2点、右上角はこの1点のみ"], ["B02", "龍馬切手：赤・緑全シート各1点のみ現存"], ["B06", "FORMOSA小龍試作：ガター8枚ブロックは現存唯一"], ["B05", "胡適の両親が台南から送った家書"], ["A02", "臨時中立：福州で4種だけ売られ販売停止"], ["A03", "十字加刷：文意がさらに不適切で再び停止"], ["A08", "西螺大橋：試刷2枚が発行品と色違い"], ["A12", "1949年移転：額面なし飛雁全シート200枚"], ["C01", "収入印紙：「台華民國」「中民華國」文字順エラー"], ["C05", "大清郵政：「臨時大総統孫逸仙君」宛て封"]], "routes": [{"name": "3分ハイライト（行列が長いとき）", "path": ["B01", "B02", "A02", "A03"], "say": "現存唯一・極希少の4点と、「政権交代と切手」の物語。"}, {"name": "台湾郵政ストーリー（約8分）", "path": ["B02", "B04", "B06", "B05", "C01", "A12", "A06"], "say": "劉銘伝の駅站郵便、海関の試作、胡適の家書から、日本統治期の印紙、1949年の移転まで。"}, {"name": "民国切手の変奏曲（約6分）", "path": ["A01", "A02", "A03", "A04", "A05", "B01"], "say": "大総統交代で作り直された記念切手、2度の臨時中立加刷、地域限定加刷、そして民国四珍。"}, {"name": "台湾移転後の建設切手（約5分）", "path": ["A06", "A07", "A08", "A09", "A10", "A11"], "say": "試刷と原版試刷：デザイン段階の色は発行品と違う。" <script>
const ALL = JSON.parse(document.getElementById('data').textContent);
const LANGS = ['zh', 'en', 'ja'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (t, n) => t.replace('{n}', n);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let lang = store.get('docent-lang');
const qp = (location.search.match(/[?&]lang=(zh|en|ja)/) || [])[1];
if (qp) lang = qp;
if (!LANGS.includes(lang)) lang = 'zh';
let D, U, byId, cards = [], orig = new Map(), glItems = [], cur = 'all', allOpen = false;

const codeTag = id => `<span class="code c${id[0]}">${id}</span>`;
const link = id => `<a href="#${id}" data-go="${id}">${codeTag(id)}</a>`;

function card(it) {
  const stars = '★'.repeat(it.star) + '☆'.repeat(3 - it.star);
  let h = `<details class="card ${it.cat}" id="${it.id}" data-cat="${it.cat}" data-star="${it.star}"><summary>
   <div class="t1">${codeTag(it.id)}<span class="stars">${stars}</span>${it.star === 3 ? `<span class="must">${esc(U.must)}</span>` : ''}</div>
   <h3>${esc(it.title)}</h3><div class="en">${esc(it.en)}</div>
   <div class="yr">${esc(it.year)}${it.exhibitor ? '｜' + esc(U.exhibitor) + esc(it.exhibitor) : ''}｜${esc(U.src)}${esc(it.src)}</div>
   <div class="hook"><span class="hp">${esc(U.hook)}</span>${esc(it.hook)}</div>
   <div class="toggle"><span class="o">${esc(U.open)}</span><span class="c">${esc(U.close)}</span></div>
  </summary><div class="body">
   <h4>${esc(U.hScript)}</h4><div class="script">${esc(it.script)}</div>`;
  if (it.facts?.length) h += `<h4>${esc(U.hFacts)}</h4><ul>${it.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  if (it.items?.length) h += `<h4>${esc(U.hItems)}</h4><ul>${it.items.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  if (it.frames?.length) {
    const hl = it.frames.some(f => f[2]);
    h += `<h4>${esc(U.hFrames)}</h4><table class="fr"><tr><th>${esc(U.thFrame)}</th><th>${esc(U.thContent)}</th>${hl ? `<th>${esc(U.thHL)}</th>` : ''}</tr>${it.frames.map(f => `<tr><td>${esc(f[0])}</td><td>${esc(f[1])}</td>${hl ? `<td>${esc(f[2])}</td>` : ''}</tr>`).join('')}</table>`;
  }
  if (it.qa?.length) h += `<h4>${esc(U.hQa)}</h4><dl class="qa">${it.qa.map(([q, a]) => `<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join('')}</dl>`;
  if (it.tip) h += `<div class="tip"><span class="tp">${esc(U.tip)}</span>${esc(it.tip)}</div>`;
  if (it.refs) h += `<div class="refs">${esc(U.refs)}${esc(it.refs)}</div>`;
  h += `<div class="tags">${it.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div></div></details>`;
  return h;
}

function render() {
  D = ALL[lang]; U = ALL.ui[lang]; byId = Object.fromEntries(D.items.map(i => [i.id, i]));
  document.documentElement.lang = U.htmlLang;
  document.title = D.meta.title;
  $('#kicker').textContent = U.kicker; $('#ttl').textContent = D.meta.title; $('#sub').textContent = D.meta.subtitle;
  $('#meta').innerHTML = [D.meta.dates, D.meta.venue, D.meta.version].map(x => `<span class="pill">${esc(x)}</span>`).join('');
  $('#q').placeholder = U.ph; $('#fsminus').title = U.fsMinus; $('#fsplus').title = U.fsPlus; $('#totop').setAttribute('aria-label', U.top);
  $('#lang').setAttribute('aria-label', U.langLabel);
  $('#lang').innerHTML = LANGS.map(l => `<button data-lang="${l}" class="${l === lang ? 'on' : ''}" lang="${ALL.ui[l].htmlLang}">${ALL.ui[l].label}</button>`).join('');
  const fk = ['all', 'star', 'A', 'B', 'C'];
  $('#filters').innerHTML = fk.map((k, i) => `<button class="chip${k === cur ? ' on' : ''}" data-f="${k}">${esc(U.filters[i])}</button>`).join('');
  const nk = ['#sec-top', '#sec-routes', '#sec-scripts', '#sec-A', '#sec-B', '#sec-C', '#sec-tl', '#sec-gl', '#sec-faq', '#sec-notes'];
  $('#navs').innerHTML = nk.map((h, i) => `<a class="chip nav" href="${h}" data-nav="${h}">${esc(U.nav[i])}</a>`).join('') + `<button class="chip nav" id="expand">${esc(allOpen ? U.collapse : U.expand)}</button>`;
  [['#h-top', 'secTop'], ['#h-routes', 'secRoutes'], ['#h-scripts', 'secScripts'], ['#h-tl', 'secTl'], ['#h-gl', 'secGl'], ['#h-faq', 'secFaq'], ['#h-notes', 'secNotes'], ['#notesDesc', 'notesDesc']].forEach(([s, k]) => $(s).textContent = U[k]);

  $('#top').innerHTML = D.top.map(([id, t]) => `<a href="#${id}" data-go="${id}">${codeTag(id)}<span><b>${esc(byId[id].title)}</b><br><small>${esc(t)}</small></span></a>`).join('');
  $('#routes').innerHTML = D.routes.map(r => `<div class="route"><b>${esc(r.name)}</b><div class="path">${r.path.map(link).join('<span class="arr">→</span>')}</div><p>${esc(r.say)}</p></div>`).join('');
  $('#scripts').innerHTML = D.scripts.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
  $('#cards').innerHTML = D.cats.map(c => `<section id="sec-${c.key}" data-catsec="${c.key}"><div class="cat-head"><h2>${c.key}｜${esc(c.name)} <small style="font-weight:400;color:var(--muted)">${esc(c.en)}</small></h2><p>${esc(c.desc)}</p></div>${D.items.filter(i => i.cat === c.key).map(card).join('')}</section>`).join('');
  $('#tl').innerHTML = D.timeline.map(([d, x, k]) => `<div class="r"><span class="d">${esc(d)}</span><span class="x">${esc(x)}</span><span class="k">${k.split(',').map(link).join(' ')}</span></div>`).join('');
  $('#gl').innerHTML = D.glossary.map(([a, b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join('');
  $('#faq').innerHTML = D.faq.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
  $('#notes').innerHTML = D.notes.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
  $('#foot').innerHTML = esc(U.srcHead) + '<br>' + D.meta.sources.map(esc).join('<br>') + '<br>' + esc(U.footNote);

  cards = [...document.querySelectorAll('details.card')];
  if (allOpen) cards.forEach(c => c.open = true);
  orig = new Map(cards.map(c => [c, c.innerHTML]));
  glItems = [...document.querySelectorAll('#gl > div')];
  apply();
}

function setLang(l, keepId) {
  if (!LANGS.includes(l) || l === lang) return;
  const openIds = cards.filter(c => c.open).map(c => c.id);
  lang = l; store.set('docent-lang', l); render();
  openIds.forEach(id => { const el = document.getElementById(id); if (el) el.open = true; });
  if (keepId) { const el = document.getElementById(keepId); if (el) el.scrollIntoView({ block: 'start' }); }
}
function visibleCardId() {
  const barH = $('#bar').getBoundingClientRect().bottom;
  const c = cards.find(c => !c.classList.contains('hide') && c.getBoundingClientRect().bottom > barH + 10);
  return c && c.getBoundingClientRect().top < innerHeight ? c.id : null;
}

function apply() {
  const q = $('#q').value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  let n = 0;
  cards.forEach(c => {
    const wasOpen = c.open; c.innerHTML = orig.get(c); c.open = wasOpen;
    const it = byId[c.id];
    const okF = cur === 'all' || (cur === 'star' ? it.star === 3 : it.cat === cur);
    const text = c.textContent.toLowerCase() + ' ' + c.id.toLowerCase();
    const show = okF && terms.every(t => text.includes(t));
    c.classList.toggle('hide', !show);
    if (show) n++;
    if (show && terms.length) { highlight(c, terms); if (terms.some(t => !c.querySelector('summary').textContent.toLowerCase().includes(t))) c.open = true; }
  });
  document.querySelectorAll('[data-catsec]').forEach(s => s.classList.toggle('hide', !s.querySelector('details.card:not(.hide)')));
  glItems.forEach(g => g.classList.toggle('hide', terms.length > 0 && !terms.every(t => g.textContent.toLowerCase().includes(t))));
  const filtered = terms.length > 0 || cur !== 'all';
  ['#sec-top', '#sec-routes', '#sec-scripts'].forEach(s => $(s).classList.toggle('hide', filtered));
  $('#count').textContent = filtered ? fmt(U.found, n) + (terms.length ? U.glSync : '') : fmt(U.all, cards.length);
  if (/^[abc]\d{2}$/.test(q) && byId[q.toUpperCase()]) $('#' + q.toUpperCase()).open = true;
}
function highlight(root, terms) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  nodes.forEach(t => {
    if (!re.test(t.nodeValue)) return; re.lastIndex = 0;
    const s = document.createElement('span'); s.innerHTML = esc(t.nodeValue).replace(re, '<mark>$1</mark>'); t.replaceWith(s);
  });
}
function go(id) {
  const el = document.getElementById(id); if (!el) return;
  if (el.classList.contains('hide')) { $('#q').value = ''; cur = 'all'; document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x.dataset.f === 'all')); apply(); }
  el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]'); if (lb) { setLang(lb.dataset.lang, visibleCardId()); return; }
  const f = e.target.closest('[data-f]'); if (f) { cur = f.dataset.f; document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x === f)); apply(); return; }
  if (e.target.closest('#expand')) { allOpen = !allOpen; cards.forEach(c => c.open = allOpen); $('#expand').textContent = allOpen ? U.collapse : U.expand; return; }
  const a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); go(a.dataset.go); try { history.replaceState(null, '', '#' + a.dataset.go); } catch (err) { /* sandboxed preview */ } }
});
let tmr; $('#q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(apply, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('#q').value.trim().toUpperCase(); if (byId[v]) go(v); e.target.blur(); } });

let fs = +store.get('docent-fs') || 17;
const setFs = v => { fs = Math.min(24, Math.max(13, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('docent-fs', fs); };
setFs(fs);
$('#fsplus').onclick = () => setFs(fs + 1); $('#fsminus').onclick = () => setFs(fs - 1);

window.addEventListener('beforeprint', () => cards.forEach(c => c.open = true));
render();
if (location.hash === '#print') cards.forEach(c => c.open = true);
else if (location.hash.length === 4 && byId[location.hash.slice(1)]) setTimeout(() => go(location.hash.slice(1)), 50);
</script>
</body>
