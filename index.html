<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺北2026世界郵展｜專業導覽速查講稿</title>
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1d2433; --muted:#5b6475; --line:#e3dccb;
  --red:#b8322a; --redsoft:#f6e3df; --green:#1f6b4f; --greensoft:#e1efe8;
  --blue:#24508f; --bluesoft:#e2eaf6; --gold:#a8741a; --goldsoft:#f5ebd6;
  --fs:17px; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14171d; --card:#1c2029; --ink:#ece8df; --muted:#a3a9b6; --line:#2e3441;
    --redsoft:#3a2321; --greensoft:#1d3229; --bluesoft:#1f2a3c; --goldsoft:#352b18; --red:#e0665d; --green:#5fb48f; --blue:#7fa5e0; --gold:#d9a54a;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
:lang(ja) body{font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
:lang(en) body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans TC","Noto Sans CJK TC",sans-serif}
body{margin:0; background:var(--paper); color:var(--ink); font-size:var(--fs); line-height:1.7;
  font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;}
a{color:inherit}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px 80px}
header.hero{background:var(--ink); color:#fff; padding:22px 16px 18px; position:relative}
@media (prefers-color-scheme: dark){ header.hero{background:#0b0d11} }
header.hero::after{content:""; position:absolute; left:0; right:0; bottom:-9px; height:18px;
  background:radial-gradient(circle at 9px 0, var(--paper) 6px, transparent 6.5px) 0 0/18px 18px repeat-x;}
.hero .inner{max-width:1080px; margin:0 auto}
.hero .kicker{font-size:.8em; letter-spacing:.12em; opacity:.75}
.hero h1{margin:4px 0 2px; font-size:1.55em; line-height:1.3}
.hero .sub{opacity:.85; font-size:.9em}
.hero .meta{margin-top:10px; display:flex; flex-wrap:wrap; gap:8px}
.pill{display:inline-block; border:1px solid rgba(255,255,255,.35); border-radius:99px; padding:2px 12px; font-size:.82em}

.bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 0 10px; margin-top:12px}
.bar .row{display:flex; gap:8px; align-items:center}
#q{flex:1; font-size:1.05em; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); min-width:0}
#q:focus{outline:none; border-color:var(--red)}
.btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:.9em; cursor:pointer; white-space:nowrap}
.chips{display:flex; gap:6px; overflow-x:auto; padding-top:8px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line); background:var(--card); border-radius:99px; padding:5px 13px; font-size:.86em; cursor:pointer; color:var(--ink); text-decoration:none}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip.nav{background:transparent}
.lang{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none}
.lang button{border:none; background:var(--card); color:var(--ink); padding:10px 10px; font-size:.85em; cursor:pointer}
.lang button.on{background:var(--red); color:#fff; font-weight:700}
.lang button+button{border-left:1px solid var(--line)}
@media (max-width:520px){ .card{scroll-margin-top:250px} .bar .row{flex-wrap:wrap} #q{flex-basis:100%} .lang{flex:1} .lang button{flex:1} }
#count{font-size:.8em; color:var(--muted); padding-top:6px}

h2.sec{font-size:1.2em; margin:30px 0 10px; display:flex; align-items:center; gap:10px}
h2.sec::before{content:""; width:6px; height:1.1em; background:var(--red); border-radius:3px}
.secdesc{color:var(--muted); font-size:.9em; margin:-4px 0 12px}

.top{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px}
.top a{display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-decoration:none}
.code{font-weight:800; font-variant-numeric:tabular-nums; border-radius:8px; padding:1px 8px; font-size:.85em; flex:none}
.cA{background:var(--greensoft); color:var(--green)} .cB{background:var(--redsoft); color:var(--red)} .cC{background:var(--bluesoft); color:var(--blue)}

.routes{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px}
.route{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px}
.route b{display:block; margin-bottom:4px}
.route .path{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0}
.route .path a{text-decoration:none}
.route .path span.arr{color:var(--muted); font-size:.8em}
.route p{margin:4px 0 0; color:var(--muted); font-size:.9em}

.cat-head{margin-top:34px; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--card)}
.cat-head h2{margin:0; font-size:1.2em}
.cat-head p{margin:4px 0 0; color:var(--muted); font-size:.9em}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin:12px 0; position:relative; overflow:hidden; scroll-margin-top:150px}
.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px}
.card.A::before{background:var(--green)} .card.B::before{background:var(--red)} .card.C::before{background:var(--blue)}
.card summary{list-style:none; cursor:pointer; padding:14px 16px 12px 20px}
.card summary::-webkit-details-marker{display:none}
.card .t1{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.stars{color:var(--gold); letter-spacing:1px; font-size:.9em}
.must{font-size:.72em; background:var(--red); color:#fff; border-radius:6px; padding:1px 7px; font-weight:700}
.card h3{margin:6px 0 0; font-size:1.12em; line-height:1.4}
.card .en{color:var(--muted); font-size:.8em; line-height:1.4; margin-top:2px}
.card .yr{color:var(--muted); font-size:.82em; margin-top:4px}
.hook{margin-top:8px; padding:8px 12px; background:var(--goldsoft); border-radius:10px; font-weight:600}
.hook .hp{color:var(--gold); font-weight:800; font-size:.85em}
.toggle{margin-top:8px; font-size:.82em; color:var(--muted)}
details[open] .toggle .o{display:none} details:not([open]) .toggle .c{display:none}
.body{padding:0 16px 16px 20px; border-top:1px dashed var(--line)}
.body h4{margin:14px 0 6px; font-size:.92em; color:var(--muted); letter-spacing:.05em}
.script{background:var(--greensoft); border-radius:10px; padding:10px 12px; font-size:1.02em}
.body ul{margin:0; padding-left:1.2em} .body li{margin:3px 0}
table.fr{width:100%; border-collapse:collapse; font-size:.92em}
table.fr td,table.fr th{border-bottom:1px solid var(--line); padding:7px 6px; vertical-align:top; text-align:left}
table.fr th{color:var(--muted); font-weight:600; font-size:.85em}
table.fr td:first-child{white-space:nowrap; font-weight:700}
.qa dt{font-weight:700; margin-top:6px} .qa dt::before{content:"Q "; color:var(--red)}
.qa dd{margin:2px 0 0 0} .qa dd::before{content:"A "; color:var(--green); font-weight:700}
.tip{margin-top:12px; border-left:4px solid var(--gold); padding:6px 10px; background:var(--goldsoft); border-radius:0 8px 8px 0; font-size:.94em}
.tip .tp{font-weight:800; color:var(--gold)}
.refs{margin-top:10px; font-size:.8em; color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px}
.tags span{font-size:.75em; border:1px solid var(--line); border-radius:99px; padding:0 8px; color:var(--muted)}

.tl{border-left:3px solid var(--line); margin-left:6px; padding-left:14px}
.tl .r{position:relative; padding:5px 0; display:flex; gap:12px; flex-wrap:wrap}
.tl .r::before{content:""; position:absolute; left:-21px; top:13px; width:11px; height:11px; border-radius:50%; background:var(--red); border:2px solid var(--paper)}
.tl .d{font-weight:800; min-width:96px; font-variant-numeric:tabular-nums}
.tl .x{flex:1; min-width:180px}
.tl .k a{text-decoration:none; margin-left:2px}

.gl{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px}
.gl div{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
.gl b{display:block}
.box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:6px 14px 10px}
.box dt{font-weight:700; margin-top:10px} .box dd{margin:2px 0 0}
.notes dt{color:var(--red)}
mark{background:#ffe27a; color:#000; border-radius:3px; padding:0 1px}
.hide{display:none!important}
footer{margin-top:40px; color:var(--muted); font-size:.8em; border-top:1px solid var(--line); padding-top:12px}
.totop{position:fixed; right:14px; bottom:16px; z-index:30; width:46px; height:46px; border-radius:50%; border:none; background:var(--ink); color:var(--paper); font-size:1.2em; box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* ---------- print ---------- */
@page{size:A4; margin:14mm 13mm}
@media print{
  :root{--fs:10pt !important; --paper:#fff; --card:#fff; --ink:#111; --muted:#555}
  body{background:#fff}
  .bar,.totop,.toggle,.noprint{display:none!important}
  header.hero{background:#fff; color:#111; border-bottom:2px solid #111; padding:0 0 8px}
  header.hero::after{display:none}
  .pill{border-color:#999}
  .wrap{max-width:none; padding:0}
  .card{break-inside:auto; border:1px solid #bbb; margin:8px 0}
  .card summary{padding:8px 10px 6px 14px}
  .body{padding:0 10px 8px 14px}
  .hook,.script,.tip{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .cat-head{break-before:page; break-after:avoid}
  h2.sec{break-after:avoid}
  .card summary, .hook{break-inside:avoid}
  table.fr tr{break-inside:avoid}
  .top,.routes,.gl{display:block; column-count:2; column-gap:6mm} .top a,.route,.gl div{margin:0 0 4px; break-inside:avoid; display:flex}
  .route,.gl div{display:block}
  #sec-A .cat-head{break-before:auto}
  .tl .r{break-inside:avoid}
  a{text-decoration:none}
  #sec-tools{break-before:page}
}
</style>
</head>

<header class="hero"><div class="inner">
  <div class="kicker" id="kicker"></div>

    <section id="sec-gl"><h2 class="sec" id="h-gl"></h2><div class="gl" id="gl"></div></section>

  </section>
  <footer id="foot"></footer>
</div>

齊。", "facts": ["原票：清代蟠龍、躍鯉、飛雁「無水印」郵票共15種", "15種面值：半分、壹分、貳分、參分、肆分、伍分、柒分、壹角、壹角陸分、貳角、參角、伍角、壹圓、貳圓、伍圓", "加蓋：造冊處（Bureau of Engraving and Printing），5號宋字，票面中央「橫行」紅色或黑色「臨時中立」", "民國元年（1912）1月起僅福州郵局售出：參分、壹圓、貳圓、伍圓 4種", "因加蓋文字用詞欠妥即停售；其餘 11 種未發行"], "items": ["「臨時中立」4種發行＋11種未發行之大方連（4×5、5×5 或 8×6）1組"], "qa": [["為什麼說用詞不妥？", "展品說明只寫「加蓋文字用詞欠妥」，建議照此說明，不自行延伸解釋。"], ["票上看到的 00027、00068 是什麼？", "是全張邊紙上的印刷編號（版號／張號類標記），大方連保留了邊紙，所以看得到。"]], "tip": "建議與 A03 連著講：「先橫蓋、再直蓋成十字，兩次都很快停售」。"}, {"id": "A03", "cat": "A", "star": 3, "title": "中華民國臨時中立郵票（十字加蓋）", "en": "Republic of China & Provisional Neutrality Issue", "year": "1912（民國元年3月）", "src": "專刊 p.132–137", "tags": ["民國初年", "加蓋", "未發行", "大方連", "漢口", "南京", "長沙"], "hook": "在「臨時中立」上再直蓋「中華民國」，變成十字形——結果文意更不妥，又停售。", "script": "「臨時中立」停售後，造冊處再用5號宋字，直行加蓋紅色或黑色「中華民國」四個字，和原本橫的「臨時中立」形成十字形。民國元年3月分發漢口、南京、長沙三地郵局販售。原票一樣是15種，但漢口只賣出8種、南京6種、長沙只有1種。因為加蓋後文意更加不妥，很快又停售，其餘7種沒有發行。展出的是8種已發行加7種未發行的大方連一組。", "facts": ["第二次加蓋：「中華民國」直行，與「臨時中立」成十字形（紅色或黑色，5號宋字）", "民國元年（1912）3月分發：漢口、南京、長沙", "漢口售出8種：壹分、叁分、柒分、壹角陸分、伍角、壹圓、貳圓、伍圓", "南京售出6種：壹分、叁分、壹角陸分、壹元、貳圓、伍圓", "長沙只售出1種：壹分", "其餘7種未發行"], "items": ["「中華民國臨時中立」8種發行＋7種未發行之大方連（4×5、5×5 或 8×6）1組"], "qa": [["A02 和 A03 怎麼一眼分辨？", "A02 只有橫的「臨時中立」；A03 多了直的「中華民國」，兩者交叉成十字。"]]}, {"id": "A04", "cat": "A", "star": 2, "title": "北京二版辟雍「黔」區貼用郵票（未發行全張）", "en": "Second Peking Print Hall of Classics Issue with Overprinted Character Ch'ien", "year": "1925（民國14年）", "src": "專刊 p.138–139", "tags": ["地區加蓋", "貴州", "未發行", "全張", "北京二版"], "hook": "在貴州，高面值郵票被拿來當「匯款」，結果也成了強盜搶劫的目標。", "script": "貴州山多、民國初年交通不便、匯費很高，商人和民眾常常買高面值郵票寄出，代替匯款。但當地治安不好、盜賊橫行，高值郵票也成了劫掠目標，影響郵局業務和郵件安全。所以民國14年，北京郵政總局在北京二版辟雍圖高面值郵票的橋門頂上，用紅色5號宋字加蓋貴州的簡稱「黔」，限制它只能在本省流通。原本準備5種面值，壹圓、貳圓、伍圓有發行，拾圓和廿圓沒有發行。今天展出的就是這兩種未發行票，各一整張50枚。", "facts": ["原因：郵票代替匯款 → 成為劫掠目標 → 加蓋限省使用", "加蓋位置：辟雍圖「橋門頂上」；紅色5號宋字「黔」", "5種面值：壹圓、貳圓、伍圓已發行；拾圓、廿圓未發行"], "items": ["加蓋「黔」區票 拾圓、廿圓 未發行票 各1全張（每張50枚）"], "qa": [["「黔」是什麼意思？", "貴州省的簡稱。"]], "tip": "可串講地區限定加蓋三兄弟：A04「黔」貴州、A05「限滇省」雲南、B01 的「限新省」新疆。"}, {"id": "A05", "cat": "A", "star": 2, "title": "北京二版帆船「限滇省貼用」郵票（未發行全格）", "en": "Second Peking Print Junk Issue with Overprint \"Restricted for Use in Yunnan\"", "year": "1926（民國15年）", "src": "專刊 p.140–141", "tags": ["地區加蓋", "雲南", "未發行", "全格", "北京二版", "帆船"], "hook": "只准在雲南使用的郵票；其中棕色陸分印好了卻從未發行。", "script": "民國15年，財政部印刷局用楷字凸版，在北京二版帆船、農穫、辟雍郵票的上半部，橫著加印「限滇省貼用」五個字，限定在雲南使用。總共發行20種；其中伍圓票用薄紙，叁分票厚紙、薄紙都有，其餘都是厚紙。另外曾加蓋一種棕色陸分，但沒有發行。今天展出的就是這種棕色陸分未發行票一整格，10×5共50枚。", "facts": ["加印單位：財政部印刷局；楷字凸版；橫行蓋於票面上半部", "底票：北京二版帆船、農穫、辟雍", "發行20種：伍圓為薄紙；叁分有厚紙、薄紙兩種；其餘厚紙", "棕色陸分：已加蓋但未發行"], "items": ["「限滇省貼用」北京二版帆船 棕色陸分未發行票 1全格（10×5，50枚）"], "qa": [["「滇」是哪裡？", "雲南省的簡稱。"]]}, {"id": "A06", "cat": "A", "star": 2, "title": "鄭成功像郵票　5元全張", "en": "Cheng Cheng-kung (Koxinga) Issue", "year": "1950（民國39年6月26日起）", "src": "專刊 p.142–143", "tags": ["政府遷臺", "常用郵票", "全張", "鄭成功"], "hook": "一整張 200 枚的鄭成功像最高面值 5 元票。", "script": "政府遷臺後，以鄭成功為楷模，強調收復失土、建設臺灣為復興基地，所以各種面值的常用郵票都用鄭成功像，提醒民眾記得他的民族士氣。民國39年6月26日起發行。主圖是根據國立臺灣博物館典藏的延平郡王鄭成功畫像描繪，票面寫著「延平郡王鄭成功」。全套13枚，今天展出最高面值5元票一整張，10×20共200枚。", "facts": ["主圖藍本：國立臺灣博物館典藏「延平郡王鄭成功」畫像", "全套13枚：3分、1角、1角5分、2角、3角、4角、5角、8角、1元、1元5角、1元6角、2元、5元"], "items": ["最高面值 5元票 1全張（10×20，200枚）"], "qa": []}, {"id": "A07", "cat": "A", "star": 1, "title": "臺灣防癆協會成立紀念票　陰版反印試樣票", "en": "Taiwan Anti-Tuberculosis Association Commemorative Issue", "year": "1953（民國42年7月1日）", "src": "專刊 p.144–145", "tags": ["政府遷臺", "紀念郵票", "試樣", "公共衛生"], "hook": "用郵票宣導防癆；展出的是特殊的「陰版反印」全套試樣。", "script": "民國41年，內政部加強推行防癆保健，要求中央衛生實驗院和臺灣省各級衛生機構辦理結核菌素反應檢驗和卡介苗接種；同年8月1日成立防癆協會。郵政總局為了協助宣導防癆、增進國民健康，在民國42年7月1日發行「臺灣防癆協會成立紀念郵票」，面值4角、1.6元、2元、5元共4種。這次展出特殊的陰版反印全套試樣票。", "facts": ["1952（民國41年）：結核病反應檢驗＋卡介苗接種；8月1日成立防癆協會", "1953-07-01 發行，4種：4角、1.6元、2元、5元"], "items": ["特殊之陰版反印全套試樣票（英文說明：reverse-printed die proofs）"], "qa": [["什麼是試樣票？", "正式印製前用來檢查圖案、顏色的印樣，通常數量極少、不對外發售。"]]}, {"id": "A08", "cat": "A", "star": 3, "title": "西螺大橋落成紀念票　無齒試印樣張", "en": "Silo Bridge Commemorative Issue", "year": "1954（民國43年1月28日）", "src": "專刊 p.146–147", "tags": ["政府遷臺", "紀念郵票", "試印", "無齒", "交通建設", "西螺大橋"], "hook": "當年遠東最長的公路橋；試印樣張有 2 枚顏色跟正式票不一樣。", "script": "臺灣河流寬闊，多條大河阻斷南北交通。濁水溪是臺灣最大的河流，興建大橋連接南北很有必要。西螺大橋在民國42年1月28日通車，是中美技術合作建造，橋長1,938公尺、寬7.5公尺、31孔，是當年遠東最長的公路橋，橋面還附設鐵軌，連接臺糖公司鐵路網。通車一週年，民國43年1月28日發行紀念郵票4枚。這次展出全套4枚的無齒試印樣張，其中1.6元和3.6元兩枚的顏色跟正式發行票不同，可以請大家比對看看。", "facts": ["通車：1953-01-28（民國42年）；中美技術合作", "橋長 1,938 公尺、寬 7.5 公尺、31 孔；當年遠東最長公路橋", "橋面附設鐵軌，連接臺糖鐵路網", "郵票發行：1954-01-28，4枚：4角、1.6元、3.6元、5元"], "items": ["全套4枚無齒試印樣張；1.6元、3.6元 2枚顏色與正式發行票不同"], "qa": [["跟正式郵票哪裡不同？", "沒有齒孔（無齒），而且 1.6 元、3.6 元兩枚的顏色和正式發行票不同。"]]}, {"id": "A09", "cat": "A", "star": 2, "title": "造林保林常用票　未印面值無齒試印樣張", "en": "Reforestation Movement Issue", "year": "1954 / 1955（民國43/44年）", "src": "專刊 p.148–149", "tags": ["政府遷臺", "常用郵票", "試印", "無齒", "植樹節", "環境"], "hook": "6 枚「沒有面值」的試印票，其中 5 枚顏色跟正式票不同。", "script": "國家發展需要長遠規劃、注意環境保護，森林是重要資源，造林保林是經建基礎。國父逝世後，遵從國父造林建設遺訓，民國19年規定每年3月12日為植樹節。政府遷臺後推動綠化臺灣、輔助水力建設。郵政總局以此為題，民國43年3月12日發行第一組，面值4角及10元；民國44年4月1日發行第二組高額票20元及50元。這次展出6枚未印面值的無齒試印樣張，除了50元以外，其他5枚顏色都和正式發行票不同。", "facts": ["1930（民國19年）定每年3月12日為植樹節", "第一組：1954-03-12，4角、10元", "第二組（高額）：1955-04-01，20元、50元"], "items": ["6枚未印面值無齒試印樣張：4角票2枚、10元票2枚、20元及50元票各1枚；除50元外其餘5枚顏色與正式票不同"], "qa": []}, {"id": "A10", "cat": "A", "star": 1, "title": "郵政60週年紀念票　無齒母版試樣", "en": "60th Anniversary of Postal Service Commemorative Issue", "year": "1956（民國45年3月20日）", "src": "專刊 p.150–151", "tags": ["政府遷臺", "紀念郵票", "母版試樣", "郵政節"], "hook": "紀念國家郵政 60 週年；同一面值兩種不同顏色的母版試樣。", "script": "郵政是國家重要的通信機構。我國郵政業務最早由海關兼辦，1896年3月20日改由國家經營。政府遷臺後，大小鄉鎮普設郵局，民眾把郵局當成好鄰居。民國45年3月20日為郵政六十週年紀念，發行郵票4枚，面值4角、1元、1.6元、2元。今天展出的是4角面值、兩種不同顏色的無齒母版試樣。", "facts": ["1896-03-20：郵政由海關兼辦改為國家經營（展品說明）", "1956-03-20 發行4枚：4角、1元、1.6元、2元"], "items": ["面值4角 2枚不同顏色之無齒母版試樣（master die proofs）"], "qa": [["3月20日有什麼意義？", "展品說明指1896年3月20日郵政改由國家經營；這天也是我國的郵政節（補充說明）。"]]}, {"id": "A11", "cat": "A", "star": 1, "title": "臺灣省橫貫公路開工週年紀念票　母版試印樣", "en": "1st Anniversary of the Commencement of Cross Island Highway Construction", "year": "1957（民國46年10月25日）", "src": "專刊 p.152–153", "tags": ["政府遷臺", "紀念郵票", "母版試樣", "交通建設", "中橫"], "hook": "同一張 4 角票的 6 種顏色試印樣——看設計師怎麼挑顏色。", "script": "臺灣東西兩岸被中央山脈阻隔，早年交通要從南北兩端繞道，對經濟和文化發展阻礙很大。臺灣省橫貫公路在民國45年7月7日開工，主線長186公里、支線長120公里，不但是東西部交通捷徑，也促進沿線礦產、農林、畜牧、水力灌溉等事業。民國46年10月25日發行「臺灣東西橫貫公路開工週年紀念郵票」全套3枚。今天展出4角面值的母版不同顏色試印樣6枚。", "facts": ["開工：1956-07-07；主線186公里、支線120公里", "1957-10-25 發行全套3枚：4角、1.4元、2元"], "items": ["面值4角之母版不同顏色試印樣 6枚"], "qa": []}, {"id": "A12", "cat": "A", "star": 3, "title": "上海版飛雁無面值郵票　全張", "en": "The Whole Sheet of Shanghai Print Flying Geese Stamps without any denomination", "year": "1949（民國38年底）", "src": "專刊 p.154–155", "tags": ["政府遷臺", "無面值", "全張", "飛雁"], "hook": "一張沒有面值的郵票，記錄了 1949 年郵政隨政府遷臺的過渡時刻。", "script": "民國38年年底，郵政總局隨政府遷到臺北辦公。新郵票還沒印好之前，先把從大陸帶來的上海版飛雁郵票，加蓋新臺幣面值來使用。原票是大東書局上海印廠承印，主圖是兩隻大雁飛翔在地球上，票面本身沒有印面值。今天展出的是原票全張，20×10共200枚，英文說明形容是在臺灣極為稀少的珍品。", "facts": ["1949年底郵政總局遷臺北辦公（英文說明：1949年12月）", "原票：大東書局上海印廠承印；主圖雙雁飛翔於地球上；票面未印面值", "在臺使用方式：加蓋新臺幣面值"], "items": ["原票全張（20×10，200枚）"], "qa": [["沒有面值怎麼用？", "在臺灣先加蓋新臺幣面值後才使用；展出的是未加蓋的原票全張。"]]}, {"id": "B01", "cat": "B", "star": 3, "title": "「民國四珍」錯異票", "en": "Four Treasures of the Republic", "exhibitor": "姚頡林先生（Frank Yao）", "year": "1914–1925", "src": "專刊 p.156–159", "tags": ["民國四珍", "宮門倒", "倒蓋", "錯體", "帆船票", "世界級"], "hook": "帆船票 24 年歷史中誕生的四枚世界級錯票，今天一次到齊。", "script": "帆船郵票是中華民國發行的第一套常用系列郵票，從1913年用到1936年，長達24年。長期發行過程中出現很多稀有的印樣、樣票和變體票，其中最頂級的四種被稱為「民國四珍」。第一，北京一版圖橋牌坊貳元中心倒印，俗稱「宮門倒」，市面只流出兩張、共100枚，角位只見兩件，右上角只有一件，就是今天這件。第二，北京一版帆船3分加蓋「暫作貳分」倒蓋，存世單票14枚、實寄封2件。第三，北京二版帆船4分加蓋「暫作叁分」倒蓋，存世只有10枚。第四，北京一版帆船加蓋「限新省貼用」壹圓，「新」和「省」兩字位置顛倒，四方連只見兩件。", "facts": ["① 宮門倒（1914）：北京一版圖橋牌坊 貳元 黑藍色 中心倒印｜存世：僅兩張50枚（共100枚）流出；角位僅見二件，右上角僅一件（展品）｜舊藏 Ex Huang", "② 1922：北京一版帆船 3分 加蓋「暫作貳分」倒蓋（藍綠色）｜存世：單票14枚、實寄封2件｜Ex Fletcher, Beckeman", "③ 1925：北京二版帆船 4分 加蓋「暫作叁分」倒蓋（灰色）｜存世：10枚（7枚未使用、3枚已使用）｜Ex Ruland, Starr, Olsson", "④ 1915：北京一版帆船 加蓋「限新省貼用」壹圓（黑橙色）「新」「省」二字倒置｜存世：四方連僅見二件（展品為四方連）｜Ex Pederson, Lee"], "items": ["民國四珍全部四種（宮門倒為右上角位；限新省倒置為四方連）"], "qa": [["為什麼印錯反而更值錢？", "印刷錯誤大多在出廠前被檢出銷毀，能流出的極少；存世數量越少越稀有。"], ["Ex Huang、Ex Lee 是什麼？", "「Ex」表示曾經由這位收藏家收藏（舊藏來源），是珍郵身分履歷的一部分。"], ["這一枚值多少錢？", "建議應答：展品多為存世極少的珍品，沒有公開定價，導覽不做價格評估。"]], "tip": "排隊時最強開場：「全世界角位宮門倒只有兩件，右上角只有這一件。」"}, {"id": "B02", "cat": "B", "star": 3, "title": "劉銘傳印備未用的臺灣龍馬郵票全張（紅、綠）", "en": "Complete Sheets of Taiwan Dragon and Horse Stamps Prepared but Never Issued under Liu Ming-Chuan", "exhibitor": "李鏡禹先生（King Yue Lee）", "year": "1888（光緒14年）", "src": "專刊 p.160–161", "tags": ["清代臺灣", "劉銘傳", "龍馬票", "全張", "存世唯一", "未使用"], "hook": "在倫敦精印、晚到三個月而從未使用的臺灣郵票——紅綠全張存世各只有一張。", "script": "1884年劉銘傳主政臺灣，記取清法戰爭法軍攻臺的教訓，希望戰時軍政一體、訊息快速傳達。1888年改良臺灣舊有驛站制度，原本想用格式嚴謹、印刷精良的郵票當作通信憑證，於是透過淡水英國領事館，向倫敦的文具商韋斯特尼訂印，再委由伯雷特伯里·威金生公司用雕刻凹版印製。龍馬票有紅、綠兩色，面值都是制錢20文，每張5×5共25枚，圖案是「上龍下馬」，右邊寫「大清臺灣郵政局」，左邊寫「制錢貳拾文」，上下有英文。但因為印工複雜、費時，1888年6月才送到臺灣，比驛站郵政開辦晚了3個月，劉銘傳已經改用本地土紙印的簡單票證，所以這套精美的龍馬票從來沒有實際使用，後來加蓋文字改成火車票。今天展出的是存世唯一的紅、綠兩色全張。", "facts": ["訂印路徑：淡水英國領事館 → 倫敦文具商 P. W. Wastnace → Bradbury, Wilkinson & Co. 雕刻凹版印製", "紅、綠2色；面值均為20文；每全張 5×5＝25枚", "圖案「上龍下馬」；右直行「大清臺灣郵政局」、左直行「制錢貳拾文」，上下英文對應", "1888年6月才送達臺灣（驛站郵政開辦後3個月）；已改用本地土紙印製之「臺灣郵票」及「郵政商票」", "從未作郵資使用；後加蓋文字改作火車票證"], "items": ["存世唯一的紅、綠2色全張（各5×5，25枚）"], "qa": [["為什麼印好了卻沒用？", "印製費時，1888年6月才送到，驛站郵政已開辦3個月並改用本地簡易票證。"], ["後來去哪了？", "依展品說明，之後加蓋文字改成火車票證使用。"]], "tip": "可與 B04、B06 串成「劉銘傳的臺灣郵政」主題。"}, {"id": "B03", "cat": "B", "star": 2, "title": "官辦文報局跨省寄遞大官封", "en": "Large Official Covers Carried Between Provinces by the Government-Operated Wenbaoju", "exhibitor": "何輝慶先生（Huei-Ching Ho）", "year": "1890、1892（光緒16、18年）", "src": "專刊 p.162–165", "tags": ["清代臺灣", "文報局", "大官封", "公文", "跨省"], "hook": "清代臺灣的官方公文，怎麼跨海送到南京和福建？看封上的紅色手填戳記。", "script": "這兩件是清代官方「文報局」遞送的大官封。圖1在光緒16年8月初3，也就是1890年9月16日，由臺北「臺灣善後總局」寄往南京給一位直隸州官員，裡面的公文還在。封面左下有直式無框紅色文字戳「光緒十 年 月 日到臺北文報局 月 日 時遞出」，空格用手填上十「六」年「八」月「初三」日。圖2在光緒18年8月30日，也就是1892年10月20日，由臺灣第二任巡撫邵友濂從臺北寄給福建福寧府正堂，經福州文報局轉遞，戳記填著「十」月「初八」日收到、「初九」日即送。", "facts": ["圖1：1890-09-16 臺北「臺灣善後總局」→ 南京（試用直隸州，正五品官）；內附公文仍在；臺北文報局紅色手填戳；到南京未註明收到時日", "圖2：1892-10-20 臺灣巡撫邵友濂（第二任）→ 福建福寧府正堂；福州文報局戳：十月初八收到、初九即送"], "items": ["圖1 經臺北文報局寄南京大官封", "圖2 經福州文報局轉遞大官封"], "qa": [["文報局是什麼？", "清代官辦的公文遞送機構，負責傳遞官方文書。"]]}, {"id": "B04", "cat": "B", "star": 2, "title": "官辦驛站郵政島內寄遞大官封", "en": "Large Official Covers Carried Within Taiwan by the Government-Operated Postal Relay Station System", "exhibitor": "何輝慶先生（Huei-Ching Ho）", "year": "1894（光緒20年）", "src": "專刊 p.166–169", "tags": ["清代臺灣", "驛站", "大官封", "鹿港", "滬尾", "淡水"], "hook": "1894 年從鹿港寄到淡水要 6 天，沿途每一站都蓋章填時間。", "script": "這是劉銘傳創辦的臺灣驛站郵政在島內寄送的大官封。圖3由「辦理鹿港稅釐分局委員會」寄給「辦理臺北滬尾海關邵」，光緒20年5月初7，也就是1894年6月10日，從鹿港寄出，經過彰化城站、大甲站、吞霄腰站、後壠站、竹塹城站、中壢站、臺北總站，到滬尾旁站，沿途蓋有填寫時間的驛站戳記，5月13日到臺北，歷時6天。圖4是淡水縣正堂李姓官員寄給滬尾海關蔣姓官員，1894年12月19日寄出，隔天卯時（早上5到7點）經過臺北總站，同一天午時（11點到下午1點）就到滬尾旁站，是極短程的驛站封，也是目前發現最晚經過臺北總站的驛站封。", "facts": ["圖3：1894-06-10 鹿港 → 臺北滬尾；歷時6天", "路線：彰化城站 → 大甲站 → 吞霄腰站 → 後壠站 → 竹塹城站 → 中壢站 → 臺北總站 → 滬尾旁站", "圖4：1894-12-19 淡水縣 → 滬尾海關；11月24日卯時經臺北總站、同日午時到滬尾旁站；2個驛站戳", "圖4 為目前發現最晚到臺北總站的驛站封"], "items": ["圖3 鹿港寄滬尾驛站大官封", "圖4 淡水寄滬尾極短程驛站封"], "qa": [["這些站名現在是哪裡？", "可依字面對照：彰化、大甲、吞霄（今通霄）、後壠（今後龍）、竹塹（今新竹）、中壢、臺北、滬尾（今淡水）。"], ["卯時、午時是幾點？", "卯時約清晨5–7點；午時約上午11點–下午1點。"]]}, {"id": "B05", "cat": "B", "star": 3, "title": "民辦民信局跨省寄遞紅條封（胡適父母家書）", "en": "Red-Band Covers Carried Between Provinces by Privately Operated Letter Agencies", "exhibitor": "何輝慶先生（Huei-Ching Ho）", "year": "1892、1893（光緒18、19年）", "src": "專刊 p.170–173", "tags": ["清代臺灣", "民信局", "紅條封", "胡適", "家書", "臺南"], "hook": "胡適的父親和母親從臺南寄回安徽老家的信——靠民間「輪船信局」接力送達。", "script": "紅條封是傳統中式信封，中間有一條紅色長條。圖5的寄件人是胡適先生的父親胡鐵花，當時在臺南任官。光緒18年3月8日，也就是1892年4月4日，由臺南全泰成輪船信局寄出，經廈門全泰成輪船信局、上海全泰盛長江輪船局、金陵全泰盛輪船信局一路遞送，再轉到安徽屯溪的胡家。圖6的寄件人是胡適的母親馮順弟女士，光緒19年5月18日，也就是1893年7月1日，由臺南協興昌記輪船信局經廈門分局，一路送到安徽屯溪給胡三老爺嘉言收。那時馮女士剛帶著胡適等孩子到臺南依親，這封很可能是報平安的家書。", "facts": ["圖5：1892-04-04 胡鐵花（胡適之父）臺南 → 安徽屯溪；經 臺南全泰成 → 廈門全泰成 → 上海全泰盛長江輪船局 → 金陵全泰盛輪船信局", "圖6：1893-07-01 馮順弟（胡適之母）臺南 → 安徽屯溪胡三老爺嘉言；經 臺南協興昌記 → 廈門協興昌記", "背景：馮女士帶胡適等孩童初到臺南依親，應為報平安家書"], "items": ["圖5 胡鐵花紅條封", "圖6 馮順弟紅條封"], "qa": [["民信局是什麼？", "民間經營的信件遞送商號；此兩件是沿海輪船信局接力跨省寄遞。"], ["胡適小時候住過臺灣？", "依展品說明，1893年馮女士帶胡適等孩童到臺南依親。"]], "tip": "名人故事最能吸引排隊民眾，適合當開場鉤子。"}, {"id": "B06", "cat": "B", "star": 3, "title": "小龍郵票紅色加蓋「臺灣郵票」／\"FORMOSA\"（海關郵政試印）", "en": "Small Dragon Stamp with \"FORMOSA\", \"臺灣郵票\" Overprinting — Taiwan: The 19th Century Post (Customs Post)", "exhibitor": "黃明正先生（Ming-Jeng Huang）", "year": "1888 前後", "src": "專刊 p.174–175", "tags": ["清代臺灣", "海關郵政", "小龍", "FORMOSA", "試印", "過橋", "存世唯一", "赫德"], "hook": "海關想把「臺灣郵政」收編而試印的 FORMOSA 郵票，最後成了絕響。", "script": "1888年，海關總稅務司赫德爵士發現劉銘傳在1888年3月創辦的臺灣郵政成效很好，還公布了郵政章程，很有發展潛力，因此想把臺灣郵政納入國家經辦的海關郵政系統。於是試印少量海關小龍3分、5分郵票，加蓋英文\"FORMOSA\"或中文「臺灣郵票」，部分用新式12度齒孔機打孔。這批試印票用紙無水印，子模排列也和正式發行的完全不同，3分俗稱第V版式、5分俗稱第VI版式。全套6枚，其中5分無齒加蓋FORMOSA最少，只發現一全格；而全套的過橋八方連存世只有一件，就是今天展出的這件。海關雖然早在淡水和打狗（高雄）設有海關和郵務處，但直到1895年日本占領臺灣，海關郵政都沒能在臺灣開辦，這套專為臺灣設計的郵票就成了絕響。", "facts": ["人物：海關總稅務司 赫德爵士（Sir Robert Hart）；臺灣巡撫 劉銘傳（1888年3月創辦臺灣郵政）", "試印：海關小龍 3分、5分，紅色加蓋 \"FORMOSA\" 或「臺灣郵票」", "特徵：無水印紙；子模排列與正式票不同（3分＝第V版式、5分＝第VI版式）；部分12度齒孔", "全套6枚：3分有齒2枚、5分有齒2枚、5分無齒2枚（各中、英文加蓋）", "最稀少：5分無齒加蓋 FORMOSA，僅發現一全格", "全套過橋八方連（帶下邊紙）存世僅一件（展品）", "版式特徵：Setting VI 第15子模右下角破角；Setting V 第12子模左下「3」字破損"], "items": ["全套過橋八方連（存世唯一）及相關試印樣"], "qa": [["什麼是「過橋」？", "郵票全張中間兩個版面之間的空白分隔帶稱「過橋」，跨過這段的連票稱過橋連，較少見。"], ["打狗是哪裡？", "今高雄。"]]}, {"id": "C01", "cat": "C", "star": 3, "title": "台灣：台灣印花稅票（1908–1949）", "en": "Taiwan: Revenue of Taiwan (1908–1949)", "year": "1908–1949｜8框", "src": "資料② p.1–2", "tags": ["臺灣", "印花稅票", "日治", "光復", "加蓋", "錯體", "存世唯一"], "hook": "從日治「印紙」到光復後加蓋「中華民國臺灣省」——稅票也見證了政權交替。", "script": "1895年臺灣割讓給日本，1908年6月21日日本政府施行《臺灣印紙稅規則》，日本印花稅票開始在臺灣使用。1945年10月25日臺灣光復，印花稅的徵收中斷，但民眾仍守法沿用日本收入印紙來保障財產與權利。1946年1月初，臺灣省行政長官公署財政處請郵電管理委員會停售日本印紙，並把庫存印紙加蓋「中華民國臺灣省」後交郵局出售，依1944年1月18日公告的中華民國印花稅率表貼花。1946年8月16日公布《臺灣印花稅法》，臺灣省專用印花稅票正式使用。這部郵集展出樣票、變體票和各種單據證書上的使用實例，重要珍品加襯紅底。", "facts": ["1908-06-21（明治41年）施行《臺灣印紙稅規則》", "1945-10-25 臺灣光復，日本印紙停用但民間沿用", "1946年1月初：庫存日本印紙加蓋「中華民國臺灣省」由郵局出售；依1944-01-18稅率表", "1946-08-16 公布《臺灣印花稅法》，臺灣省專用印花稅票啟用", "看展提示：重要珍品「加襯紅底」"], "frames": [["第1–2框", "日治時期：明治型印紙、震災暫用印紙、大正型印紙、臺灣娛樂稅證紙、臺灣總督府草帽檢查證紙、印紙貼用濟", "臺灣最早使用印花稅票實單；存世唯一在臺使用明治型50圓實單；大正型白紙10圓及100圓全格新票；存世三枚之一紅色臺灣總督府帽子檢查證紙"], ["第3–4框", "日本收入印紙手蓋「中華民國臺灣省」", "最早日期貼用實例；《臺灣省印花稅法》施行首日使用實例；已知唯一10錢加蓋倒蓋變體票（貼於收據）；存世兩件之一貼3錢實用收據；已知唯一10錢L3型加蓋票；存世兩件之一1錢實用收據；已知唯一10圓加蓋票"], ["第5框", "日本收入印紙機蓋「中華民國臺灣省」", "已知唯一50錢小字加蓋及貼用實單；5圓四方連；貼1圓的大學畢業證書"], ["第6框", "日本收入印紙改值加蓋（臺幣）", "收據貼10c/5s漏印面值「台幣拾錢」變體票；薪資明細表貼$1/3s兩枚錯體加蓋「台華民國」與「中民華國」；抵押借款契約書貼$50/5r補蓋票"], ["第7框", "國父像印花稅票", "國父像印花稅票樣本冊；免役證"], ["第8框", "國父像椰樹圖印花稅票；國父像椰樹圖臺幣改值新臺幣", "「貳伍分角」錯體票（第2、3、4字位置誤植）；已知唯一「貳圓分伍」錯體新票"]], "qa": [["印花稅票跟郵票有什麼不同？", "印花稅票是繳稅憑證，貼在收據、契約、證書等文件上；郵票是付郵資用。"], ["「台華民國」「中民華國」是什麼？", "加蓋文字排錯的錯體票，貼在薪資明細表上（第6框）。"]], "tip": "民眾最有感：第6框「台華民國／中民華國」錯字票、第5框大學畢業證書貼印花。", "refs": "臺灣省行政長官公署公報；She Horng Wu, Revenue stamps of Taiwan area Republic of China, 1st ed., 1981"}, {"id": "C02", "cat": "C", "star": 2, "title": "台灣郵資票（美規）", "en": "Taiwan ATM Stamps (US Style)", "year": "1995–2000｜5框", "src": "資料② p.3–5", "tags": ["郵資票", "ATM", "自動售票機", "國父紀念館", "中正紀念堂", "現代郵政"], "hook": "全世界只有臺灣、美國、阿根廷用過的「美規」郵資票。", "script": "中華郵政看準自動化機器的便利與趨勢，1995年7月31日從美國引進3部郵資票出售機，發行第一版「國父紀念館」郵資票30萬枚。反應很好，1996年11月5日再發行第二版「中正紀念堂」郵資票270萬枚，實際使用大約45萬多枚。但機器常故障、廠商也無法有效維護，2000年初停用。所謂「美規」，是指由美國鈔票印刷公司（ABN）印製的特有規格，約22.1×25.0公釐，上下無齒、左右有齒，只能用美國Unisys PMC製造的出售機販售；全世界只有臺灣、美國和阿根廷用過。這部郵集研究兩版郵資票的版式、列印字型與裁切變異，並搭配國內外實寄封片簡與單據。", "facts": ["1995-07-31：引進3部美國 Unisys PMC 郵資票出售機；第一版「國父紀念館」（資常1）30萬枚", "1996-11-05：第二版「中正紀念堂」（資常2）270萬枚，實際使用約45萬餘枚", "2000年初：機器故障頻繁、廠商無法有效維護而停用", "規格：American Banknote Co.（ABN）印製，約22.1×25.0 mm；上下無齒、左右有齒", "使用國家：僅臺灣、美國、阿根廷"], "frames": [["第1框", "第一版：印刷版式、測試票、列印研究及變異", "最高面額500元實寄郵件及變異票實寄"], ["第2框", "第一版：面額列印之墨漬、墨色深淺、漏印、複印", "各種國內外資費實寄郵件"], ["第3框", "第二版：印刷版式、固定版式、破版、列印字體、墨漬", "高面額票（條）及最高面額實寄郵件"], ["第4框", "第二版：漏印、複印、多重模式變體", "國內資費實寄郵件"], ["第5框", "第二版用於郵政特種資費及執據", "寄大陸、國際各類資費實寄，尤其貼高面額票之郵件"]], "qa": [["郵資票是郵票嗎？", "是由機器現場列印面額的郵資憑證，功能等同郵票，可貼用寄信。"]]}, {"id": "C03", "cat": "C", "star": 1, "title": "中華郵政國際航空郵簡（1953–1972）（暫譯）", "en": "Chunghwa Post – International Aerogramme 1953–1972", "year": "1953–1972", "src": "資料② p.6", "tags": ["航空郵簡", "郵資", "政府遷臺", "香港", "澳門", "亞洲大洋洲"], "hook": "一張紙折起來就是信封——看郵簡面值如何反映不同地區的航空郵資。", "script": "為符合萬國郵政聯盟規定、方便民眾使用，中華郵政在1953年7月1日發行預印郵資的航空郵簡；1949年在大陸印的郵簡只是沒有預印郵資的格式郵簡。國際航空郵簡有1953年3元運輸機圖、1954年3元四引擎機圖，以及6元噴射機圖，用到1972年。寄港澳的郵資在1955年4月20日起調為1.5元，之前和國內一樣是1元；有1.5元四引擎機圖和1962到1970年的2元噴射機圖。寄亞洲及大洋洲則在1966年11月1日起發行4元噴射機圖郵簡，用到1972年。這部郵集只展國際郵簡，不含國內郵簡，包括印樣、樣張、新票與實寄，特別蒐集加資、掛號、少見目的地的實寄品。", "facts": ["1953-07-01 首發預印郵資航空郵簡（1949年大陸版為無預印郵資之格式郵簡）", "國際：1953 NT$3.00 運輸機；1954 NT$3.00 四引擎；噴射機 NT$6.00（至1972）", "港澳：1955-04-20 起 NT$1.50（之前同國內 NT$1.00）；四引擎 NT$1.50；噴射機 NT$2.00（1962–1970）", "亞洲及大洋洲：1966-11-01 起 NT$4.00 噴射機（至1972）；之前與國際同為 NT$5.00", "範圍：僅國際郵簡；含 proof、specimen、新票、實寄（加資、掛號、少見目的地）"], "frames": [["1.1", "1953 國際運輸機圖郵簡", ""], ["1.2", "1954 國際四引擎機圖郵簡", ""], ["1.3", "1962 國際噴射機圖郵簡", ""], ["2.1", "1955 港澳四引擎機圖郵簡", ""], ["2.2", "1962 港澳噴射機圖郵簡", ""], ["3.1", "1966 亞洲及大洋洲噴射機圖郵簡", ""]], "qa": [["什麼是航空郵簡？", "郵資已印好、信紙折疊後就是信封的航空郵件用紙，不可夾帶附件。"]], "refs": "Han Ho-Yun 1984；Donald R. Alexander 1993；Lin Chang-Long, Postal Letter Sheets of ROC (1894–2003)"}, {"id": "C04", "cat": "C", "star": 2, "title": "國父像紐約版郵票（暫譯）", "en": "Dr. Sun Yat-Sen, New York Print", "year": "抗戰時期｜8框", "src": "資料② p.7", "tags": ["抗戰", "國父像", "紐約版", "加蓋", "廣東", "改值", "證書"], "hook": "第一套由美國印刷廠為中國印製的郵票，背後是戰時的外交關係。", "script": "抗戰初期，大量中國郵票在香港印製，也有一部分由紐約的美國鈔票公司印製，就是「國父像紐約版」。它的郵史意義在於：這是第一次由美國印刷廠替中國印郵票，反映兩國務實的外交關係。紐約版共16種面值，發行時正逢通貨膨脹，有些面值並不適用。1942年因廣東大部分地區被日軍占領，為防止郵票從未占領區走私，加蓋「限廣東省貼用」等字樣，此後各地也自行加蓋；貼在信封上的地方加蓋極為罕見，有些存世不到10件。這部郵集涵蓋改值1分、20分、40分，加蓋軍郵、剿匪、儲金票，以及國幣改值，並有印樣、樣張、版式研究、錯體與實寄。展品右下角有標記者附有鑑定證書。", "facts": ["印製：American Bank Note Co.（紐約）；首家為中國印製郵票的美國印刷廠", "共16種面值；發行時值通貨膨脹", "1942：加蓋 \"Special for Use in Kwangtung District\"／\"For Use in Kwangtung Province\"／\"Kwangtung Temporarily Sold Surcharge\" 防走私", "地方加蓋實寄封極罕見，部分存世少於10件", "展品右下角標（C）記號者附證書"], "frames": [["第1框", "半分至1分：印樣、版式、錯體、郵政使用", ""], ["第2框", "2分至8分", ""], ["第3框", "8分至17分", ""], ["第4框", "25分至50分", ""], ["第5框", "1元至5元", ""], ["第6框", "5元至20元", ""], ["第7框", "改值1分、20分、40分；Pai Cheng 印刷局試印票（限東北使用）；軍郵、儲金票", ""], ["第8框", "剿匪票（貨幣管制）；國幣改值（暫售、上海聯合、重慶中央及大東〔Ta Tung〕加蓋）", ""]], "qa": [], "refs": "Lee Sung Ping 1969/1963；Ma Ren Quan 1988；Chan Shiu Hon 2000"}, {"id": "C05", "cat": "C", "star": 3, "title": "大清國家郵政史（1897–1911）", "en": "Postal History of Imperial China 1897–1911", "year": "1897–1911｜8框", "src": "資料② p.8–11", "tags": ["清代", "國家郵政", "海關郵政", "郵戳", "客郵", "民信局", "孫逸仙", "存世唯一"], "hook": "從海關代辦到國家郵政，大清郵政只有短短 15 年，卻為民國郵政打下基礎。", "script": "中國現代郵政起源於1867年由英國人主導的海關試辦郵政，外籍人員以海關郵政型態主持了三十年，到1897年2月20日成立「大清國家郵政局」。初期以原海關郵局為主，共31個郵局，之後迅速擴張。1899年4月起全國統一使用英漢日戳，一直用到1923年；1904年起又改為以陰曆干支紀年的第二階段郵戳，用到1911年底。這部郵集也整理國內外郵資，以及寄朝鮮、新疆、蒙古、西藏、雲南等邊疆與特殊地區的郵件。最後一框有一件寄給「中華臨時大總統孫逸仙君」的信封，是大清郵政最晚期的使用。", "facts": ["1867 海關試辦郵政（英國人主導）", "1897-02-20 成立大清國家郵政局（Chinese Imperial Post, CIP）；初期31局；幣制由銀兩改銀元", "1899年4月：第一階段統一英漢日戳（沿用至1923）；廣設分局、代辦、信櫃；山東、福建有特殊地區郵戳", "1904年起：第二階段陰曆干支戳，至1911年底", "重點地區：朝鮮、新疆、蒙古、西藏、雲南"], "frames": [["第1框", "1897年以前：海關時期、代管朝鮮海關、華洋書信館", "1876存世最早寧波海關封；1879鎮江海關存世第二早封；1880存世三件之一煙台海關封；存世少於10封的11分郵資；1884溫州第I型海關日戳及海關公文戳存世唯一封；1897仁川海關寄上海存世一件中式封；1878煙台華洋書信館存世唯一封"], ["第2框", "1897年國家郵政局成立初期：郵局設立與郵戳演變", "北京信力已付戳存世第二早；1897-02-17最早R字掛號戳；1897-05-07北京大圓戳最早使用；1897-06-07溫州大圓戳存世最早封；存世三件龍州大圓戳掛號封；存世三件瓊州閏月大圓戳實寄封；存世一件天津閏月大圓戳實寄封；最早與最晚使用的天津挖字海關戳封"], ["第3框", "1899年4月起第一階段英漢日戳、英漢橢圓戳；偏遠地區碑型戳", "7件首年使用英漢日戳（北京、廈門、福州、廣州、天津、沙市）；雲南河口開局第二早封；西藏地區打箭爐郵政局碑型戳；東北最早開局瓦房店郵政局碑型戳"], ["第4框", "山東、福建地區性特殊郵戳；第二次全國統一干支戳", "極早期日月戳；少見日月戳用於國際郵件；清三次片發行第二天使用"], ["第5框", "國內外郵資演變、減資時期、差別郵資；寄韓國、臺灣、香港、青島、廣州灣", "減資時期寄青島雙掛號特殊郵資；1897鎮江寄瑞典新聞紙封；煙台寄法國7.5分差別郵資；經日本客郵轉遞欠資明信片"], ["第6框", "邊疆郵政；民信局、客郵局與國家郵政的競爭與合作", "1898仁川海關寄上海封；1898新疆伊犁俄國郵局寄北京轉民信局到天津；巴塘IPO戳寄加爾各答；雲南馬幫郵件經安南客郵局；1897蒙自寄上海最早國內函件經國際郵路；1899-12蒙自海關戳最晚使用；馬幫民信局與官局合遞封（存世少於5封）；麻鄉約民信局合遞封（存世少於5封）；1902-09法國安南客郵局最晚使用封"], ["第7框", "新式業務：IPO戳、儲匯、大宗郵件、行動郵局、欠資、僑批", "存世唯一冬季郵資北京IPO；存世第二早匯銀執據；輪船信筒最早使用；進口封最早罰貼欠資票封"], ["第8框", "快信、對剖票、大清郵簡、收到已破郵局代封、郵政檢查、包裹、無法投遞、立券報紙", "北京文報局快信；存世一件湖南長沙對剖票實寄封；極早期收到已破郵局代封；存世最早無法投遞貼條；辛亥年寄「中華臨時大總統孫逸仙君」封（大清郵政最晚使用）"]], "qa": [["什麼是客郵？", "外國在中國境內自設的郵局（如法國安南客郵局、日本客郵）。"], ["什麼是干支戳？", "以天干地支（陰曆）紀年月日的郵戳，1904年起推行。"]], "tip": "最好講的兩件：第8框寄「孫逸仙君」封、第6框雲南馬幫郵件。", "refs": "孫君毅《清代郵戳志》1984；張愷升《中國郵戳史》1989；薛聘文《中國郵資》1981"}, {"id": "C06", "cat": "C", "star": 2, "title": "衝突與重建：抗戰時期中國軍郵（1937–1945）（暫譯）", "en": "Conflict and Reconstruction: Military Postal Services in China During the War of Resistance, 1937–1945 (Including a Comparative Study of the Imperial Japanese Army Field Post)", "year": "1894–1949｜8框", "src": "資料② p.12", "tags": ["抗戰", "軍郵", "戰區", "日軍野戰郵便", "滇緬", "戰俘", "國共內戰"], "hook": "用一封封戰時軍郵，把戰線推移畫成一張地圖。", "script": "這部郵集以國軍軍郵為主，同時放入日本陸軍野戰郵便作為比較，用敵我雙方的郵件來呈現戰線變化和國軍守土的艱困。時間從1894年甲午戰爭、1900年庚子事變講起，經過民初外蒙與西藏危機、1931年九一八事變後的偽滿洲國郵政不承認問題；1937年7月7日盧溝橋事變後，國府建立各戰區軍郵系統；1941年太平洋戰爭爆發後，中國戰區與盟軍在中緬印戰區合作；1945年日本投降後又轉入國共內戰。全集8框，透過戰時封、偽政權郵件、戰俘文物與郵路變化，呈現一個國家為生存而戰的郵政史。", "facts": ["主軸：國軍軍郵；對照：日本陸軍野戰郵便（IJA Field Post）", "關鍵年代：1894 甲午、1900 庚子、1931 九一八、1937-07-07 盧溝橋、1941 太平洋戰爭、1945 日本投降", "CBI＝中緬印戰區；CEF＝中國遠征軍"], "frames": [["第1框", "序幕：地緣起源與邊境危機（1894–1936）", "甲午戰爭、庚子日軍郵便、清代郵件；外蒙危機、軍閥、偽滿郵政不承認（1932–1936）"], ["第2框", "國軍軍郵體系建立與金融抗戰（1937起）", "軍郵系統建立；軍郵儲金／匯兌"], ["第3框", "衝突與對峙：華中戰場", "第3、第9戰區軍郵（1939–1944）"], ["第4框", "屏障西北：西線戰役、宜昌、晉陝防線", "第9、第5、第1戰區軍郵"], ["第5框", "黃河對峙：西北游擊與特種郵票", "第2戰區軍郵；軍郵票使用"], ["第6框", "淪陷區與南方前線", "偽政權、戰俘、平民拘留營、華南／西南防線"], ["第7框", "海上封鎖與中緬印戰區", "日本海軍沿海封鎖；中國遠征軍緬甸戰場"], ["第8框", "尾聲：戰後復員與兩岸分治（1945–1949）", "勝利接收、復員、國共內戰郵政轉折"]], "qa": [], "refs": "Elleman 2001 Modern Chinese Warfare；交通部郵政總局 1976《軍郵史》、1980《中國郵資研究》（英文書名直譯）"}, {"id": "C07", "cat": "C", "star": 1, "title": "中國童子軍郵政活動與歷史（暫譯）", "en": "Postal Activities and History of the Scouts of China", "year": "1912 起", "src": "資料① p.1", "tags": ["童子軍", "露營郵局", "紀念戳", "南京", "民國"], "hook": "童子軍大露營還會開「臨時郵局」，蓋專屬紀念戳。", "script": "中華民國童子軍運動始於民國元年，嚴家麟先生在湖北武昌文華書院試辦童子軍，之後推廣到全國。民國23年中國童子軍總會正式成立，依會章由蔣公擔任會長；民國26年申請加入世界童子軍組織。郵集首頁介紹中國童子軍第二次全國大檢閱暨大露營：在南京中山門外中山陵旁舉行，有一千多個團、13,268名童子軍，來自全國31個省市。露營期間設有臨時郵局，民國25年10月3日開局首日即有雙圈日戳實寄片，北平盲啞學校也參與營地郵局服務。", "facts": ["民國元年（1912）：嚴家麟於武昌文華書院試辦童子軍（英文作 Mr. Yan Jialin）", "民國23年（1934）：中國童子軍總會正式成立", "民國26年（1937）：申請加入世界童子軍組織", "第二次全國大檢閱暨大露營：南京中山門外；逾1,000團、13,268名、31省市", "南京露營郵局雙圈日戳：民國25年10月3日開局首日實寄", "另有：上海童子軍第七屆大會營地郵局紀念戳（1937.6）"], "frames": [["1", "首頁 Homepage", ""], ["2", "大陸時期活動 Mainland China Activities", ""], ["3", "全國大露營 National Jamboree", ""], ["4", "地方活動 Local Activities", ""], ["5", "紀念郵票與國際交流 Commemorative Stamps and International Reach", ""]], "qa": []}, {"id": "C08", "cat": "C", "star": 2, "title": "島嶼上的鳥類：邁向生物多樣性，卻步入瀕危之路", "en": "Birds on Islands: The Road to Biodiversity but Endangered", "year": "主題郵集｜40頁（5章）", "src": "資料① p.2–3", "tags": ["主題郵集", "鳥類", "生物多樣性", "演化", "保育", "達爾文", "華萊士", "親子"], "hook": "跟著賞鳥嚮導 Robert，用郵票走過島嶼鳥類的「探索、拓殖、演化、衰退、復育」。", "script": "這是一部用故事串起來的主題郵集。主角Robert是資深的鳥類導覽員，他一直在問：為什麼這麼多奇特的鳥只存在於島嶼上？島嶼只占地球陸地面積約3.5%，卻孕育了近20%的陸域物種，是演化的天然實驗室。郵集承襲達爾文與華萊士的研究，分成探索、拓殖、演化、衰退、復育五章。首頁展出的是2001年索羅門群島5分黃喉繡眼鳥郵票正式採用的水彩原作，獨一無二，評為三顆星。", "facts": ["島嶼約占陸地面積3.5%，孕育近20%陸域物種", "五章：探索 DISCOVERY（p.2，7頁）→ 拓殖 COLONIZATION（p.9，8頁）→ 演化 EVOLUTION（p.17，8頁）→ 衰退 DECLINE（p.25，8頁）→ 復育 RECOVERY（p.33，8頁）；共40頁", "首頁珍品：2001年索羅門群島 5c 黃喉繡眼鳥郵票採用之水彩原作（★★★，獨一無二）", "看展符號：★～★★★＝獨特、稀少、錯體或重要郵品；⇨＝主題發展流程；🔍＝個人集郵研究"], "frames": [["1 探索", "島嶼探索之旅的起點", "島嶼形成起源；科學以前的飛羽神話；啟發好奇心的博物學家；加拉巴哥群島演化奧秘；跨越華萊士線"], ["2 拓殖", "鳥類如何抵達島嶼", "最初登島足跡；穿越島嶼的旅程；生物多樣性程度差異；族群分化到特有種；地理隔離塑造獨特面貌"], ["3 演化", "近距離探索島嶼生物多樣性", "獨特生態角色；失去飛行能力；巨大與迷你體型；求偶與繁殖策略；工具運用；季節性遷移"], ["4 衰退", "當島嶼失去鳥鳴之時", "棲地消失；多重生存壓力；鳥類貿易危機；外來入侵種；氣候變遷；疾病威脅；追憶已消失的鳥類"], ["5 復育", "守護島嶼鳥類的未來", "重新發現；人與生態系共存；安全棲地與庇護所；控管外來掠食者；確保永續"]], "qa": [["主題郵集和傳統郵集差在哪？", "主題郵集用郵品講一個故事或主題；傳統郵集著重研究某套郵票本身的版式、變體與使用。"]], "tip": "帶小朋友的家庭首推：故事性強、圖像豐富。", "refs": "Quammen 1997, The Song of the Dodo；Myers et al. 2000, Nature 403:853–858"}], "top": [["B01", "宮門倒：角位僅兩件，右上角唯一"], ["B02", "劉銘傳龍馬票：紅綠全張存世唯一"], ["B06", "FORMOSA 小龍試印：過橋八方連存世唯一"], ["B05", "胡適父母從臺南寄出的家書"], ["A02", "臨時中立：只在福州賣出 4 種就停售"], ["A03", "十字加蓋：文意更不妥又停售"], ["A08", "西螺大橋：試印票 2 枚顏色與正式票不同"], ["A12", "1949 遷臺：無面值飛雁全張 200 枚"], ["C01", "印花稅票：「台華民國」「中民華國」錯字票"], ["C05", "大清郵政：寄「臨時大總統孫逸仙君」封"]], "routes": [{"name": "3分鐘精華（排隊人潮多時）", "path": ["B01", "B02", "A02", "A03"], "say": "四件存世唯一／極稀有，加上一段「郵票改朝換代」的故事。"}, {"name": "臺灣郵政故事線（約8分鐘）", "path": ["B02", "B04", "B06", "B05", "C01", "A12", "A06"], "say": "從劉銘傳驛站郵政、海關試印、胡適家書，到日治稅票與1949遷臺。"}, {"name": "民國郵票變奏曲（約6分鐘）", "path": ["A01", "A02", "A03", "A04", "A05", "B01"], "say": "開國紀念票換總統、臨時中立兩次加蓋、地區限定加蓋，到民國四珍。"}, {"name": "遷臺建設郵票（約5分鐘）", "path": ["A06", "A07", "A08", "A09", "A10", "A11"], "say": "看試印樣與母版：設計階段的顏色，和正式發行的不一樣。"}, {"name": "親子家庭（約5分鐘）", "path": ["C08", "C07", "A08", "C02"], "say": "鳥類故事、童子軍露營郵局、大橋與自動售票機，孩子最有感。"}], "timeline": [["1867", "海關試辦郵政（英國人主導）", "C05"], ["1876", "寧波海關封：存世最早", "C05"], ["1884", "劉銘傳主政臺灣", "B02"], ["1888.03", "劉銘傳創辦臺灣郵政（驛站體制更新）", "B02,B06"], ["1888.06", "倫敦精印龍馬票送達臺灣，未曾使用", "B02"], ["1888", "赫德試印小龍加蓋 FORMOSA／臺灣郵票", "B06"], ["1890.09.16", "臺北文報局寄南京大官封", "B03"], ["1892.04.04", "胡鐵花紅條封（臺南→屯溪）", "B05"], ["1893.07.01", "馮順弟紅條封（臺南→屯溪）", "B05"], ["1894", "鹿港→滬尾驛站封（6天）；甲午戰爭", "B04,C06"], ["1895", "臺灣割讓日本；海關郵政終未在臺開辦", "B06,C01"], ["1896.03.20", "郵政改由國家經營（郵政60週年起算）", "A10"], ["1897.02.20", "大清國家郵政局成立", "C05"], ["1899.04", "全國統一英漢日戳（用至1923）", "C05"], ["1904起", "第二階段陰曆干支戳（至1911）", "C05"], ["1908.06.21", "《臺灣印紙稅規則》施行", "C01"], ["1912", "民國成立；童子軍於武昌試辦", "C07"], ["1912.01", "「臨時中立」加蓋票福州售出4種", "A02"], ["1912.03", "「中華民國臨時中立」十字加蓋，漢口／南京／長沙", "A03"], ["1912.12.15", "光復暨共和紀念郵票發行", "A01"], ["1913–1936", "帆船票發行期（民國四珍誕生）", "B01"], ["1914", "宮門倒（貳元中心倒印）", "B01"], ["1915", "限新省貼用「新」「省」倒置", "B01"], ["1922", "3分加蓋暫作貳分倒蓋", "B01"], ["1925", "「黔」區加蓋；4分加蓋暫作叁分倒蓋", "A04,B01"], ["1926", "「限滇省貼用」加印", "A05"], ["1930", "定3月12日為植樹節", "A09"], ["1934", "中國童子軍總會成立", "C07"], ["1936.10.03", "南京童子軍大露營郵局開局（民國25年）", "C07"], ["1937.07.07", "盧溝橋事變；軍郵體系建立", "C06"], ["1942", "紐約版加蓋限廣東使用", "C04"], ["1945.10.25", "臺灣光復", "C01"], ["1946.01", "日本印紙加蓋「中華民國臺灣省」", "C01"], ["1946.08.16", "《臺灣印花稅法》公布", "C01"], ["1949底", "郵政總局遷臺北；飛雁無面值票加蓋新臺幣", "A12"], ["1950.06.26", "鄭成功像郵票發行", "A06"], ["1953.01.28", "西螺大橋通車", "A08"], ["1953.07.01", "防癆紀念票；預印郵資航空郵簡", "A07,C03"], ["1954.01.28", "西螺大橋紀念票", "A08"], ["1954.03.12", "造林保林第一組", "A09"], ["1955.04.01", "造林保林第二組高額票", "A09"], ["1956.03.20", "郵政60週年紀念票", "A10"], ["1957.10.25", "橫貫公路開工週年紀念票", "A11"], ["1966.11.01", "亞洲及大洋洲 4元郵簡", "C03"], ["1995.07.31", "第一版郵資票（國父紀念館）", "C02"], ["1996.11.05", "第二版郵資票（中正紀念堂）", "C02"], ["2000初", "美規郵資票出售機停用", "C02"]], "glossary": [["全張／全格", "印刷完成、未經分割的一整張郵票；保留邊紙與印刷資訊。"], ["方連／大方連", "相連未撕開的郵票塊，如四方連（2×2）；較大塊稱大方連。"], ["過橋（interpanneau）", "全張中兩個版面之間的空白帶；跨過這段的連票稱過橋連。"], ["加蓋", "在已印好的郵票上再加印文字或面值，用來改值、限地區或改用途。"], ["改值", "加蓋新面值，改變郵票原本的面額。"], ["倒印／倒蓋", "中心圖案或加蓋文字印反（上下顛倒）的錯體，極為稀少。"], ["變體／錯體", "印刷或加蓋出錯的郵票，如漏印、複印、倒置、字序錯誤。"], ["試印樣張／試樣（proof）", "正式印製前檢查圖案、顏色用的印樣，常見顏色與正式票不同。"], ["母版試樣（die proof）", "由原始雕刻母版直接印出的樣張，是設計流程最早期的實物。"], ["樣票（specimen）", "加印「樣票」等字樣供存檔或交換用的郵票，不能用來寄信。"], ["無齒／有齒", "郵票之間有沒有打孔（齒孔）以便撕開。"], ["無水印", "紙張沒有防偽水印。"], ["實寄封／實寄片", "真正經郵局寄遞過、蓋有郵戳的信封或明信片。"], ["大官封", "清代官府公文用的大型信封。"], ["紅條封", "傳統中式信封，中間有紅色長條，用於民間書信。"], ["文報局", "清代官辦的公文遞送機構。"], ["驛站", "劉銘傳在臺灣改良的官辦郵遞系統，沿途各站接力傳送。"], ["民信局", "民間經營的信件遞送商號。"], ["客郵（IPO）", "外國在中國境內自設的郵局。"], ["日戳", "標示日期的郵戳；英漢日戳為中英文並列。"], ["碑型戳", "形似石碑的郵戳，常見於清代偏遠地區郵局。"], ["干支戳", "以天干地支（陰曆）標示年月日的郵戳。"], ["印花稅票／印紙", "繳納印花稅的憑證，貼在契約、收據、證書上。"], ["郵資票（ATM stamp）", "由自動售票機現場列印面額的郵資憑證。"], ["航空郵簡（aerogramme）", "預印郵資、折疊後即成信封的航空郵件用紙。"], ["框（Frame）", "郵展展示單位，一框通常 16 頁貼片。"], ["紅底襯（red mat）", "郵集中重要珍品加襯紅色底紙以示重點。"], ["存世記錄", "目前已知存在的數量。"], ["Ex（舊藏）", "曾經收藏過這件郵品的知名收藏家，表示來源履歷。"], ["證書（certificate）", "專家委員會出具的真偽鑑定證明。"]], "faq": [["這件值多少錢？", "展品多為存世稀少的珍品，沒有公開定價；導覽不做價格評估，歡迎欣賞它的歷史故事。"], ["為什麼印錯的郵票反而珍貴？", "錯票大多在出廠前就被檢出銷毀，能流出的極少，數量少所以稀有。"], ["為什麼要展一整張，不是一枚？", "全張保留了邊紙、版號與排列方式，可以研究印刷過程，而且完整保存下來的更少。"], ["試印票跟正式票差在哪？", "試印是正式印製前的樣張，常常沒有齒孔、沒有面值，或顏色和正式票不同。"], ["我家有舊郵票，怎麼知道值不值錢？", "建議洽詢專業郵會或鑑定機構；導覽現場無法鑑定。"], ["可以拍照嗎？／哪裡買紀念品？", "依大會現場公告及工作人員指示（請於開展前向主辦確認後填入）。"], ["看不懂從哪看起？", "先看「必看清單」或跟一條導覽路線；每件展品先抓一個故事就好。"]], "scripts": [["排隊開場（20秒）", "各位好，我是今天的導覽員。這一區分成三類：中華郵政自己典藏的精選珍郵、邀請收藏家展出的世界級珍品，還有各參展郵集。時間有限，我先帶大家看幾件「全世界只有這一件」的寶貝，大家跟著我的手勢往前移動。"], ["移動分流（10秒）", "前面這件看完的朋友，請往右手邊繼續前進，下一件精彩的在那邊，後面的朋友就能往前看清楚，謝謝大家配合。"], ["一句話鉤子模板", "「這件是〔存世唯一／只有幾件〕的〔物件〕，它特別的地方是〔一個故事〕。」"], ["結尾（10秒）", "以上是今天的精華，其他展品歡迎大家慢慢欣賞；看到有紅色底紙的，就是郵集裡的重點珍品。謝謝大家！"], ["被問到不會的問題", "這個問題很好，我先查一下展品說明／幫您請教現場專家，先不給您不確定的答案。"]], "notes": [["郵政成立日期兩說", "A10 說明「1896年3月20日改由國家經營」，C05 說「1897年2月20日成立大清國家郵政局」。一般說法為：1896年3月20日奉准開辦，1897年2月20日正式開辦。被問到可兩者並陳。"], ["C05 第3框年份", "中文說明寫「1894年4月起」，英文及前言均為 April 1899；講解採 1899年4月。"], ["C05 第5框年份", "煙台寄法國7.5分差別郵資：中文寫1898年、英文寫1899年；講解建議不講年份。"], ["C03 噴射機郵簡年份", "前言寫「1965年 NT$6.00 噴射機郵簡」，章節寫「1962 國際噴射機圖」；講解建議只說「6元噴射機圖，用到1972年」。"], ["C07 日期", "說明為民國25年（1936）10月3日開局，但戳記圖說寫 October 4, 1937；講解採民國25年。"], ["C01 第1–2框", "中文「台灣娛樂稅證紙」，英文為 eating drinking and lodging tax stamps；以展框實物為準。"], ["暫譯標題", "C03、C04、C06、C07 原資料僅有英文標題，本講稿中文名稱為暫譯。"], ["現場資訊", "展位編號、開放時間、拍照規定、紀念品販售點，本次資料未提供，請開展前向主辦確認後補上。"]]}, "en": {"meta": {"title": "PHILATAIPEI 2026 — Docent Quick-Reference Script", "subtitle": "臺北2026世界郵展｜專業導覽速查講稿", "venue": "Taipei World Trade Center, Hall 1", "dates": "20 (Fri) – 25 (Wed) Nov 2026", "version": "v1.1 | Compiled 16 Nov 2026 from organiser materials", "sources": ["Source ① (3 pp.): Exhibit title pages — Scouts of China; Birds on Islands (Chinese/English)", "Source ② (12 pp.): Exhibit synopses — Revenue of Taiwan, Taiwan ATM Stamps (US style), International Aerogramme, Dr. SYS New York Print, Postal History of Imperial China, Wartime Military Post", "Source ③ (28 pp.): Exhibition catalogue pp.120–175 — Chunghwa Post Philatelic Rarities; Invited Philatelic Rarities"]}, "cats": [{"key": "A", "name": "Chunghwa Post Philatelic Rarities", "en": "中華郵政精選珍郵", "desc": "Highlights from Chunghwa Post's holdings and private collections: full sheets, large blocks and trial proofs from the founding of the Republic to the post-1949 Taiwan era. (Catalogue pp.120–155)"}, {"key": "B", "name": "Invited Philatelic Rarities", "en": "邀請類珍郵", "desc": "World-class pieces from invited collectors: the Four Treasures of the Republic, Liu Ming-chuan's Dragon & Horse stamps, Qing-era Taiwan official and red-band covers, and the FORMOSA Small Dragon essays. (Catalogue pp.156–175)"}, {"key": "C", "name": "Exhibits", "en": "參展郵集", "desc": "Theme, frame plan and key items of each exhibit. Titles marked \"(tr.)\" are translations; the source gave only one language."}], "items": [{"id": "A01", "cat": "A", "star": 2, "en": "中華民國光復紀念郵票（國父像）全張", "title": "National Revolution Commemorative Issue (Dr. Sun Yat-sen) — Full Sheets", "year": "1912 (ROC Year 1)", "src": "Catalogue pp.122–125", "tags": ["Early Republic", "Commemorative", "Full sheet", "Sun Yat-sen", "Yuan Shih-kai"], "hook": "A founding-of-the-Republic issue that was scrapped and redesigned because the president changed.", "script": "When the Republic was founded, two commemorative sets were planned: a Revolution issue with Dr. Sun Yat-sen's portrait, and a Republic issue showing a map of China with the five characters \"Great Republic of China\". The stamps were printed and about to be released when Dr. Sun stepped down and Yuan Shih-kai became president. Yuan insisted that his own portrait be used on the Republic stamps, so the Sun portrait and map designs were discarded. On 15 December 1912 two new sets of the same design were issued — Sun for the Revolution issue, Yuan for the Republic issue. On display are complete sheets of the Sun Yat-sen Revolution stamps in $1, $2 and $5, fifty stamps each.", "facts": ["Issued 15 December 1912", "Two sets of 12 stamps each, same denominations and colours; portrait in the centre", "How to tell them apart: rice ears beside the frame = Revolution issue (Sun); wheat ears = Republic issue (Yuan)"], "items": ["Sun Yat-sen Revolution issue $1, $2 and $5 — one complete sheet of 50 each (3 sheets)"], "qa": [["How do I tell the two sets apart?", "Look at either side of the portrait frame: rice ears mean the Revolution issue (Sun); wheat ears mean the Republic issue (Yuan)."], ["What happened to the map stamps?", "According to the label, the original Sun portrait and map printings were discarded and never used."]]}, {"id": "A02", "cat": "A", "star": 3, "en": "臨時中立郵票", "title": "Provisional Neutrality Issue", "year": "1912 (January)", "src": "Catalogue pp.126–131", "tags": ["Early Republic", "Overprint", "Unissued", "Large block", "Foochow"], "hook": "Qing stamps overprinted \"Provisional Neutrality\" to serve the new Republic — only 4 values were sold, in Foochow, before sales stopped.", "script": "After the Republic was founded, Qing stamps were no longer appropriate. Stocks of 15 denominations of the unwatermarked Coiling Dragon, Jumping Carp and Flying Goose stamps were sent to the Bureau of Engraving and Printing and overprinted horizontally, in red or black No. 5 Sung-style type, with the four characters \"Provisional Neutrality\" for use during the transition. From January 1912 only four values — 3 cents, $1, $2 and $5 — were sold, and only at the Foochow Post Office. Sales soon stopped because the wording was considered inappropriate; the other 11 values were never issued. Here you can see all 15 values together in large blocks.", "facts": ["Basic stamps: Qing Coiling Dragon, Jumping Carp and Flying Goose, unwatermarked — 15 values", "Values: ½c, 1c, 2c, 3c, 4c, 5c, 7c, 10c, 16c, 20c, 30c, 50c, $1, $2, $5", "Overprint: Bureau of Engraving and Printing, No. 5 Sung type, horizontal, red or black", "From January 1912, sold only at Foochow: 3c, $1, $2, $5", "Withdrawn because the wording was deemed inappropriate; 11 values never issued"], "items": ["The 4 issued + 11 unissued values in large blocks (4×5, 5×5 or 8×6), one set"], "qa": [["Why was the wording inappropriate?", "The label only says the wording was \"deemed inappropriate\"; it is best not to speculate further."], ["What are the numbers like 00027 in the margin?", "Sheet-margin printing numbers; they survive because the large blocks keep their margins."]], "tip": "Tell it together with A03: \"First a horizontal overprint, then a vertical one forming a cross — both were withdrawn quickly.\""}, {"id": "A03", "cat": "A", "star": 3, "en": "中華民國臨時中立郵票（十字加蓋）", "title": "Republic of China & Provisional Neutrality Issue (cross-shaped overprint)", "year": "1912 (March)", "src": "Catalogue pp.132–137", "tags": ["Early Republic", "Overprint", "Unissued", "Large block", "Hankow", "Nanking", "Changsha"], "hook": "\"Republic of China\" added vertically across \"Provisional Neutrality\" to form a cross — the wording became even more awkward, and it was withdrawn again.", "script": "Soon after the Provisional Neutrality stamps were withdrawn, the Bureau of Engraving and Printing added a second overprint: the four characters \"Republic of China\" in red or black, printed vertically so that they form a cross with the original horizontal overprint. In March 1912 these were sent to Hankow, Nanking and Changsha. Of the same 15 values, only eight were sold at Hankow, six at Nanking and just one at Changsha. Because the double overprint made the wording even more inappropriate, sales soon stopped and seven values were never issued. On display: the eight issued and seven unissued values in large blocks.", "facts": ["Second overprint \"Republic of China\" vertical, crossing \"Provisional Neutrality\" (red or black, No. 5 Sung type)", "Distributed March 1912 to Hankow, Nanking, Changsha", "Hankow sold 8: 1c, 3c, 7c, 16c, 50c, $1, $2, $5", "Nanking sold 6: 1c, 3c, 16c, $1, $2, $5", "Changsha sold 1: 1c", "7 values never issued"], "items": ["The 8 issued + 7 unissued values in large blocks (4×5, 5×5 or 8×6), one set"], "qa": [["How do I tell A02 and A03 apart at a glance?", "A02 has only the horizontal overprint; A03 adds a vertical one, forming a cross."]]}, {"id": "A04", "cat": "A", "star": 2, "en": "北京二版辟雍「黔」區貼用郵票（未發行全張）", "title": "Second Peking Print Hall of Classics Issue overprinted \"Ch'ien\" (Kweichow) — unissued sheets", "year": "1925 (ROC 14)", "src": "Catalogue pp.138–139", "tags": ["Regional overprint", "Kweichow", "Unissued", "Full sheet", "2nd Peking Print"], "hook": "In Kweichow, high-value stamps were used as money orders — which made them a target for bandits.", "script": "Kweichow, or Guizhou, is mountainous, and in the early Republic transport was difficult and remittance fees were high. Merchants and the public bought and mailed high-value stamps instead of money orders. But with widespread banditry, those stamps became targets for robbery, affecting postal business and mail security. In 1925 the Directorate General of Posts in Peking had the character \"Ch'ien\", the abbreviation for Kweichow, overprinted in red on the arch above the bridge on high-value Hall of Classics stamps, so they could only circulate within the province. Five values were prepared: $1, $2 and $5 were issued; $10 and $20 were not. On display are complete sheets of both unissued values, 50 stamps each.", "facts": ["Cause: stamps used as remittances → targets for robbery → restricted to the province", "Overprint on the arch above the bridge; red No. 5 Sung type \"黔\"", "5 values: $1, $2, $5 issued; $10, $20 unissued"], "items": ["Unissued $10 and $20 \"Ch'ien\" overprints — one complete sheet of 50 each"], "qa": [["What does \"黔 Ch'ien\" mean?", "It is the abbreviation for Kweichow (Guizhou) Province."]], "tip": "Link the three regional overprints: A04 Kweichow, A05 Yunnan, and Sinkiang in B01."}, {"id": "A05", "cat": "A", "star": 2, "en": "北京二版帆船「限滇省貼用」郵票（未發行全格）", "title": "Second Peking Print Junk Issue overprinted \"Restricted for Use in Yunnan\" — unissued sheet", "year": "1926 (ROC 15)", "src": "Catalogue pp.140–141", "tags": ["Regional overprint", "Yunnan", "Unissued", "Full sheet", "2nd Peking Print", "Junk"], "hook": "Stamps valid only in Yunnan — and one brown 6-cent value was overprinted but never issued.", "script": "In 1926 the Printing Bureau of the Ministry of Finance used a letterpress plate in regular script to overprint the five characters \"For Use in Yunnan Province Only\" across the upper part of Second Peking Print Junk, Reaper and Hall of Classics stamps. Twenty values were issued: the $5 on thin paper, the 3 cents on both thick and thin paper, the rest on thick paper. A brown 6-cent stamp was also overprinted but never issued. On display is a complete sheet of 50 of that unissued brown 6 cents.", "facts": ["Ministry of Finance Printing Bureau; regular-script letterpress; horizontal across the top", "Basic stamps: 2nd Peking Print Junk, Reaper, Hall of Classics", "20 values issued: $5 thin paper; 3c thick and thin; others thick", "Brown 6c overprinted but unissued"], "items": ["Unissued brown 6c, one complete sheet (10×5, 50 stamps)"], "qa": [["Where is \"滇 Dian\"?", "It is the abbreviation for Yunnan Province."]]}, {"id": "A06", "cat": "A", "star": 2, "en": "鄭成功像郵票　5元全張", "title": "Cheng Cheng-kung (Koxinga) Issue — NT$5 full sheet", "year": "1950 (from 26 June)", "src": "Catalogue pp.142–143", "tags": ["Post-1949 Taiwan", "Definitive", "Full sheet", "Koxinga"], "hook": "A complete sheet of 200 of the top-value NT$5 Koxinga definitive.", "script": "After the government relocated to Taiwan, Koxinga was held up as a role model for recovering lost territory and building Taiwan as a base for national revival, so the definitive stamps of all values carried his portrait. The issue was released from 26 June 1950. The design is based on the portrait of Koxinga, Prince of Yanping, held by the National Taiwan Museum, and is inscribed \"Koxinga, Prince of Yanping\". The set has 13 values; on display is a complete sheet of 200 of the highest value, NT$5.", "facts": ["Design source: portrait of Koxinga, Prince of Yanping, National Taiwan Museum", "13 values: 3c, 10c, 15c, 20c, 30c, 40c, 50c, 80c, NT$1, NT$1.50, NT$1.60, NT$2, NT$5"], "items": ["NT$5, one complete sheet (10×20, 200 stamps)"], "qa": []}, {"id": "A07", "cat": "A", "star": 1, "en": "臺灣防癆協會成立紀念票　陰版反印試樣票", "title": "Taiwan Anti-Tuberculosis Association Commemorative — reverse-printed proofs", "year": "1953 (1 July)", "src": "Catalogue pp.144–145", "tags": ["Post-1949 Taiwan", "Commemorative", "Proof", "Public health"], "hook": "Stamps used to promote TB prevention — shown here as rare reverse-printed proofs.", "script": "In 1952 the Ministry of the Interior strengthened tuberculosis prevention, asking the Central Hygienic Laboratory and health agencies across Taiwan to carry out tuberculin testing and BCG vaccination. The Anti-Tuberculosis Association was founded on 1 August that year. To support the campaign, the Directorate General of Posts issued this commemorative set on 1 July 1953 in four values: 40 cents, NT$1.60, NT$2 and NT$5. On display is a complete set of special reverse-printed proofs.", "facts": ["1952: tuberculin testing + BCG vaccination; association founded 1 August", "Issued 1 July 1953, 4 values: 40c, NT$1.60, NT$2, NT$5"], "items": ["Complete set of special reverse-printed die proofs"], "qa": [["What is a proof?", "A trial print made before production to check design and colour; very few exist and they were never sold."]]}, {"id": "A08", "cat": "A", "star": 3, "en": "西螺大橋落成紀念票　無齒試印樣張", "title": "Silo (Xiluo) Bridge Commemorative — imperforate trial proofs", "year": "1954 (28 January)", "src": "Catalogue pp.146–147", "tags": ["Post-1949 Taiwan", "Commemorative", "Proof", "Imperforate", "Infrastructure", "Xiluo Bridge"], "hook": "Once the longest highway bridge in the Far East — and two of these proofs are in different colours from the issued stamps.", "script": "Taiwan's wide rivers were major barriers to north–south travel. The Zhuoshui is Taiwan's largest river, so a bridge was essential. The Silo Bridge opened on 28 January 1953, built with Sino-American technical cooperation: 1,938 metres long, 7.5 metres wide, with 31 spans — at the time the longest highway bridge in the Far East — and with railway tracks linking to the Taiwan Sugar Corporation network. On its first anniversary, 28 January 1954, four stamps were issued. Here are imperforate trial proofs of all four; compare the NT$1.60 and NT$3.60 — their colours differ from the issued stamps.", "facts": ["Opened 28 Jan 1953; Sino-American technical cooperation", "1,938 m long, 7.5 m wide, 31 spans; longest highway bridge in the Far East at the time", "Railway tracks connected to the Taiwan Sugar network", "Stamps issued 28 Jan 1954: 40c, NT$1.60, NT$3.60, NT$5"], "items": ["Imperforate trial proofs of all 4 values; NT$1.60 and NT$3.60 differ in colour from the issued stamps"], "qa": [["How are they different from the issued stamps?", "They have no perforations, and the NT$1.60 and NT$3.60 are in different colours."]]}, {"id": "A09", "cat": "A", "star": 2, "en": "造林保林常用票　未印面值無齒試印樣張", "title": "Reforestation Movement Issue — imperforate proofs without denomination", "year": "1954 / 1955", "src": "Catalogue pp.148–149", "tags": ["Post-1949 Taiwan", "Definitive", "Proof", "Imperforate", "Arbor Day", "Environment"], "hook": "Six proofs with no face value — five of them in colours different from the issued stamps.", "script": "National development needs long-term planning and environmental protection; forests are a key resource. Following Dr. Sun Yat-sen's vision, 12 March was designated Arbor Day in 1930. After the move to Taiwan, afforestation supported greening and hydroelectric development. The Directorate General of Posts issued the Reforestation set on 12 March 1954 in 40 cents and NT$10, followed by high values of NT$20 and NT$50 on 1 April 1955. On display are six imperforate proofs without denominations; except for the NT$50, all differ in colour from the issued stamps.", "facts": ["1930: 12 March designated Arbor Day", "First set 12 Mar 1954: 40c, NT$10", "High values 1 Apr 1955: NT$20, NT$50"], "items": ["6 imperforate proofs without denomination: two each of 40c and NT$10, one each of NT$20 and NT$50; all but the NT$50 differ in colour"], "qa": []}, {"id": "A10", "cat": "A", "star": 1, "en": "郵政60週年紀念票　無齒母版試樣", "title": "60th Anniversary of Postal Service — imperforate master die proofs", "year": "1956 (20 March)", "src": "Catalogue pp.150–151", "tags": ["Post-1949 Taiwan", "Commemorative", "Die proof", "Postal Day"], "hook": "Marking 60 years of the national post — one value in two different proof colours.", "script": "The post is a vital national communications institution. In China, postal services were first run by the Imperial Maritime Customs and became state-operated on 20 March 1896. After the move to Taiwan, post offices reached every town and village and became familiar neighbours. For the 60th anniversary, four stamps were issued on 20 March 1956: 40 cents, NT$1, NT$1.60 and NT$2. On display are two imperforate master die proofs of the 40 cents in different colours.", "facts": ["20 Mar 1896: postal service became state-operated (per label)", "Issued 20 Mar 1956: 40c, NT$1, NT$1.60, NT$2"], "items": ["Two imperforate master die proofs of the 40c in different colours"], "qa": [["Why 20 March?", "The label dates state operation to 20 March 1896; it is also Taiwan's Postal Day (supplementary note)."]]}, {"id": "A11", "cat": "A", "star": 1, "en": "臺灣省橫貫公路開工週年紀念票　母版試印樣", "title": "1st Anniversary of Cross-Island Highway Construction — master die proofs", "year": "1957 (25 October)", "src": "Catalogue pp.152–153", "tags": ["Post-1949 Taiwan", "Commemorative", "Die proof", "Infrastructure", "Central Cross-Island Highway"], "hook": "Six colour trials of the same 40-cent stamp — see how the colour was chosen.", "script": "Taiwan's east and west are separated by the Central Mountain Range; travellers once had to detour around the island's ends. Construction of the East–West Cross-Island Highway began on 7 July 1956, with a 186 km main route and 120 km of branches, promoting mining, agriculture, forestry, animal husbandry and water resources along the way. A set of three stamps was issued on 25 October 1957. On display are six master die proofs of the 40 cents in different colours.", "facts": ["Construction began 7 Jul 1956; main route 186 km, branches 120 km", "Issued 25 Oct 1957: 40c, NT$1.40, NT$2"], "items": ["Six master die proofs of the 40c in different colours"], "qa": []}, {"id": "A12", "cat": "A", "star": 3, "en": "上海版飛雁無面值郵票　全張", "title": "Shanghai Print Flying Geese Stamps without denomination — full sheet", "year": "1949 (end of year)", "src": "Catalogue pp.154–155", "tags": ["Post-1949 Taiwan", "No denomination", "Full sheet", "Flying Geese"], "hook": "A stamp with no face value that records the moment the postal administration moved to Taiwan in 1949.", "script": "At the end of 1949 the Directorate General of Posts moved with the government to Taipei. Before new stamps could be printed, Shanghai Print Flying Geese stamps brought from the mainland were overprinted with New Taiwan Dollar values for use. The original stamps were printed by the Dah Tung Book Co. Shanghai plant, showing a pair of geese flying over the globe, with no denomination printed. On display is a complete original sheet of 200 (20×10), described as extremely rare in Taiwan.", "facts": ["DGP began operating in Taipei, December 1949", "Printed by Dah Tung Book Co., Shanghai; two geese over the globe; no denomination", "Used in Taiwan after overprinting NT$ values"], "items": ["Complete original sheet (20×10, 200 stamps)"], "qa": [["How can a stamp with no value be used?", "In Taiwan it was overprinted with an NT$ value first; this sheet is the unoverprinted original."]]}, {"id": "B01", "cat": "B", "star": 3, "en": "「民國四珍」錯異票", "title": "Four Treasures of the Republic", "year": "1914–1925", "src": "Catalogue pp.156–159", "tags": ["Four Treasures", "Inverted center", "Inverted surcharge", "Error", "Junk issue", "World-class"], "hook": "The four great errors born from the 24-year Junk series — all four together today.", "script": "The Junk stamps were the first regular series of the Republic of China, used from 1913 to 1936. That long run produced many rare essays, proofs and varieties — and four world-class gems known as the Four Treasures of the Republic. One: the First Peking Print $2 Hall of Classics with inverted centre — only two sheets of fifty reached the market, only two corner examples are recorded, and this is the only top-right corner. Two: First Peking Print 2 cents on 3 cents, surcharge inverted — 14 singles and 2 covers recorded. Three: Second Peking Print 3 cents on 4 cents, surcharge inverted — only 10 known. Four: First Peking Print $1 overprinted \"Limited for Use in Sinkiang\" with the 2nd and 3rd characters transposed — only two blocks of four recorded.", "facts": ["① 1914 First Peking Print $2 black & blue, centre inverted | Only 2 sheets of 50 (100 stamps) reached the market; 2 corner copies recorded, only 1 top-right (this one) | Ex Huang", "② 1922 First Peking Print 2c on 3c blue-green, surcharge inverted | 14 singles and 2 covers recorded | Ex Fletcher, Beckeman", "③ 1925 Second Peking Print 3c on 4c slate-grey, surcharge inverted | 10 recorded (7 mint, 3 used) | Ex Ruland, Starr, Olsson", "④ 1915 First Peking Print $1 black & orange \"Limited for Use in Sinkiang\", 2nd & 3rd characters transposed | Only 2 blocks of four recorded (one shown) | Ex Pederson, Lee"], "items": ["All four treasures (the $2 inverted centre is the top-right corner copy; the Sinkiang variety is a block of four)"], "qa": [["Why are errors more valuable?", "Most printing errors were caught and destroyed before release; very few escaped, so they are extremely scarce."], ["What does \"Ex Huang\" mean?", "\"Ex\" names a famous previous owner — part of the item's provenance."], ["How much is it worth?", "Suggested reply: these are extremely rare items with no public price; docents do not give valuations."]], "tip": "Best queue opener: \"Only two corner copies of the inverted centre exist — and this is the only top-right one.\"", "exhibitor": "Mr. Frank Yao (姚頡林)"}, {"id": "B02", "cat": "B", "star": 3, "en": "劉銘傳印備未用的臺灣龍馬郵票全張（紅、綠）", "title": "Taiwan Dragon & Horse Stamps under Liu Ming-chuan — complete sheets (red & green), prepared but never issued", "year": "1888", "src": "Catalogue pp.160–161", "tags": ["Qing Taiwan", "Liu Ming-chuan", "Dragon & Horse", "Full sheet", "Unique", "Unused"], "hook": "Finely printed in London, arrived three months late and never used — the only surviving red and green sheets.", "script": "In 1884 Liu Ming-chuan took charge of Taiwan. Learning from the French attacks in the Sino-French War, he wanted military and civil administration closely coordinated and fast communication in wartime. In 1888 he modernised Taiwan's courier relay stations and wanted well-designed, finely printed stamps as proof of postage. Through the British Consulate in Tamsui he ordered them from P. W. Wastnace, a London stationer, who had Bradbury, Wilkinson & Co. produce them in recess-engraved intaglio. They came in red and green, 20 cash each, in sheets of 25 (5×5), with a dragon above a horse, \"Great Qing Taiwan Post Office\" on the right and \"20 cash\" on the left, with English above and below. Production took so long that they reached Taiwan only in June 1888, three months after the service began, and Liu had already adopted simple locally printed stamps. These were never used for postage and were later overprinted as railway tickets. On display: the only two surviving complete sheets, red and green.", "facts": ["Order route: British Consulate, Tamsui → P. W. Wastnace, London → Bradbury, Wilkinson & Co. (recess-engraved)", "Red and green; 20 cash each; sheets of 5×5 = 25", "Design: dragon above horse; right \"大清臺灣郵政局\", left \"制錢貳拾文\", English above and below", "Arrived June 1888, three months after the relay post opened; local paper \"Taiwan Postage Stamps\" and \"Postal Merchant Stamps\" were already in use", "Never used for postage; later overprinted as railway tickets"], "items": ["The only surviving complete sheets in red and green (5×5, 25 each)"], "qa": [["Why were they never used?", "They arrived in June 1888, three months after the service opened, by which time simple local stamps were in use."], ["What happened to them later?", "Per the label, they were later overprinted for use as railway tickets."]], "tip": "Link with B04 and B06 as \"Liu Ming-chuan's Taiwan Post\".", "exhibitor": "Mr. King Yue Lee (李鏡禹)"}, {"id": "B03", "cat": "B", "star": 2, "en": "官辦文報局跨省寄遞大官封", "title": "Large Official Covers Carried Between Provinces by the Wenbaoju (Official Dispatch Bureau)", "year": "1890, 1892", "src": "Catalogue pp.162–165", "tags": ["Qing Taiwan", "Wenbaoju", "Official cover", "Documents", "Interprovincial"], "hook": "How did official documents get from Qing Taiwan across the strait to Nanking and Fukien? Read the red handwritten markings.", "script": "These are large official covers carried by the government's Wenbaoju, or Official Dispatch Bureau. Figure 1 was sent on 16 September 1890 by the Taiwan General Bureau for Postwar Affairs in Taipei to an official of Zhili Zhou in Nanking; the original document is still inside. At the lower left is a vertical, unframed red handstamp — \"arrived at Taipei Wenbaoju on … dispatched on …\" — with the date filled in by hand. Figure 2 was sent on 20 October 1892 by Shao You-lien, Taiwan's second governor, to the chief magistrate of Funing Prefecture, Fukien, via the Foochow Wenbaoju; its marking shows it was received on the 8th day of the 10th lunar month and forwarded on the 9th.", "facts": ["Fig. 1: 16 Sep 1890, Taiwan General Bureau for Postwar Affairs, Taipei → Nanking official (5th rank); document enclosed; red Taipei Wenbaoju marking filled by hand; no arrival date noted", "Fig. 2: 20 Oct 1892, Governor Shao You-lien → Funing Prefecture, Fukien; Foochow Wenbaoju marking: received 10th month 8th day, forwarded 9th day"], "items": ["Fig. 1 Taipei Wenbaoju cover to Nanking", "Fig. 2 cover forwarded via Foochow Wenbaoju"], "qa": [["What was the Wenbaoju?", "A Qing government bureau for carrying official documents."]], "exhibitor": "Mr. Huei-Ching Ho (何輝慶)"}, {"id": "B04", "cat": "B", "star": 2, "en": "官辦驛站郵政島內寄遞大官封", "title": "Large Official Covers Carried Within Taiwan by the Postal Relay Station System", "year": "1894", "src": "Catalogue pp.166–169", "tags": ["Qing Taiwan", "Relay stations", "Official cover", "Lukang", "Hobe", "Tamsui"], "hook": "In 1894 a letter from Lukang to Tamsui took six days — every station stamped and timed it.", "script": "These covers travelled on the relay-station post created by Liu Ming-chuan. Figure 3 was sent by the Lukang tax office to the Hobe Customs in Tamsui on 10 June 1894. It passed Changhua, Dajia, Tunxiao, Houlong, Zhuqian, Zhongli and Taipei Main Station before reaching Hobe Branch Station, collecting timed markings along the way, and arrived in Taipei six days later. Figure 4 was sent on 19 December 1894 by the magistrate of Tamsui County to an official at Hobe Customs. It passed Taipei Main Station in the Mao hour, 5 to 7 a.m., and arrived at Hobe the same day in the Wu hour, 11 a.m. to 1 p.m. — an exceptionally short-distance relay cover and the latest recorded one passing Taipei Main Station.", "facts": ["Fig. 3: 10 Jun 1894 Lukang → Hobe (Tamsui); 6 days", "Route: Changhua → Dajia → Tunxiao → Houlong → Zhuqian → Zhongli → Taipei Main → Hobe Branch", "Fig. 4: 19 Dec 1894 Tamsui County → Hobe Customs; Taipei Main at Mao hour, Hobe at Wu hour same day; 2 relay markings", "Fig. 4 is the latest recorded relay cover via Taipei Main Station"], "items": ["Fig. 3 Lukang–Hobe relay cover", "Fig. 4 short-distance Tamsui–Hobe relay cover"], "qa": [["Where are these stations today?", "Changhua, Dajia, Tunxiao (now Tongxiao), Houlong, Zhuqian (now Hsinchu), Zhongli, Taipei, Hobe (now Tamsui)."], ["What time are Mao and Wu hours?", "Mao ≈ 5–7 a.m.; Wu ≈ 11 a.m.–1 p.m."]], "exhibitor": "Mr. Huei-Ching Ho (何輝慶)"}, {"id": "B05", "cat": "B", "star": 3, "en": "民辦民信局跨省寄遞紅條封（胡適父母家書）", "title": "Red-Band Covers Carried Between Provinces by Private Letter Agencies (Hu Shih's parents)", "year": "1892, 1893", "src": "Catalogue pp.170–173", "tags": ["Qing Taiwan", "Private letter agency", "Red-band cover", "Hu Shih", "Family letter", "Tainan"], "hook": "Letters home to Anhui from scholar Hu Shih's father and mother in Tainan — relayed by private steamship letter agencies.", "script": "A red-band cover is a traditional Chinese envelope with a red strip down the middle. Figure 5 was sent by Hu Tiehhwa, father of the renowned scholar Hu Shih, who was then an official in Tainan. Dispatched on 4 April 1892 through the Chuan Tai Cheng Steamship Letter Agency, it travelled via the agency's network in Amoy, Shanghai and Nanking to the Hu family in Tunxi, Anhui. Figure 6 was sent on 1 July 1893 by Feng Shundi, Hu Shih's mother, through the Hsieh Hsing Chang Chi agency and its Amoy branch to Hu San-laoye Chia-yen in Tunxi. She had just arrived in Tainan with Hu Shih and the other children, so this was probably a letter to say they had arrived safely.", "facts": ["Fig. 5: 4 Apr 1892 Hu Tiehhwa (Hu Shih's father), Tainan → Tunxi, Anhui; via Chuan Tai Cheng (Tainan, Amoy), Chuan Tai Sheng (Shanghai, Nanking)", "Fig. 6: 1 Jul 1893 Feng Shundi (Hu Shih's mother), Tainan → Hu Chia-yen, Tunxi; via Hsieh Hsing Chang Chi (Tainan, Amoy)", "Context: Mrs. Feng had just come to Tainan with the children — likely a 'safe arrival' letter"], "items": ["Fig. 5 Hu Tiehhwa red-band cover", "Fig. 6 Feng Shundi red-band cover"], "qa": [["What is a private letter agency?", "A privately run mail business; these two covers were relayed between coastal steamship letter agencies."], ["Did Hu Shih live in Taiwan as a child?", "Per the label, in 1893 his mother brought him and the other children to Tainan."]], "tip": "Famous-name stories grab a queue's attention — a great opening hook.", "exhibitor": "Mr. Huei-Ching Ho (何輝慶)"}, {"id": "B06", "cat": "B", "star": 3, "en": "小龍郵票紅色加蓋「臺灣郵票」／\"FORMOSA\"（海關郵政試印）", "title": "Small Dragon Stamps overprinted \"FORMOSA\" / \"臺灣郵票\" — Customs Post essays", "year": "c. 1888", "src": "Catalogue pp.174–175", "tags": ["Qing Taiwan", "Customs Post", "Small Dragon", "FORMOSA", "Essay", "Interpanneau", "Unique", "Robert Hart"], "hook": "Essays made when the Customs tried to absorb the Taiwan Post — a design for Taiwan that was never used.", "script": "In 1888 Sir Robert Hart, Inspector General of the Imperial Customs, saw that the Taiwan Post founded by Governor Liu Ming-chuan in March 1888 was working well and had published postal regulations. He tried to bring it into the national Customs Post. A small experimental printing of Customs Small Dragon 3- and 5-candarin stamps was overprinted \"FORMOSA\" or \"臺灣郵票\", some perforated 12 on a new machine. They were on unwatermarked paper with cliché settings unlike any issued stamps — the 3c is called Setting V and the 5c Setting VI. The set has six stamps. The imperforate 5c \"FORMOSA\" is the scarcest — only one sheet recorded — and the interpanneau block of eight of the whole set is unique: it's this one. Although Customs offices existed at Tamsui and Takow (Kaohsiung), the Customs Post never opened in Taiwan before the 1895 Japanese occupation, so these stamps remain the only trace of it.", "facts": ["People: Sir Robert Hart (Inspector General of Customs); Governor Liu Ming-chuan (Taiwan Post, March 1888)", "Essays: Customs Small Dragon 3c and 5c, red overprint \"FORMOSA\" or \"臺灣郵票\"", "Unwatermarked paper; settings differ from issued stamps (3c = Setting V, 5c = Setting VI); some perf 12", "Set of 6: perf 3c ×2, perf 5c ×2, imperf 5c ×2 (Chinese and English overprints)", "Scarcest: imperf 5c \"FORMOSA\" — only one sheet recorded", "Interpanneau block of eight with bottom margin — the only one known (on display)", "Plate flaws: Setting VI cliché #15 broken bottom-right corner; Setting V cliché #12 broken \"3\""], "items": ["Unique interpanneau block of eight and related essays"], "qa": [["What is an interpanneau?", "The blank gutter between two panes of a sheet; blocks spanning it are scarce."], ["Where is Takow?", "Present-day Kaohsiung."]], "exhibitor": "Mr. Ming-Jeng Huang (黃明正)"}, {"id": "C01", "cat": "C", "star": 3, "en": "台灣：台灣印花稅票（1908–1949）", "title": "Taiwan: Revenue of Taiwan (1908–1949)", "year": "1908–1949 | 8 frames", "src": "Source ② pp.1–2", "tags": ["Taiwan", "Revenue stamps", "Japanese era", "Retrocession", "Overprint", "Error", "Unique"], "hook": "From Japanese revenue stamps to \"Taiwan Province, Republic of China\" overprints — revenue stamps also mark a change of government.", "script": "Taiwan was ceded to Japan in 1895, and on 21 June 1908 the Taiwan Stamp Duty Rules brought Japanese revenue stamps into use. After retrocession on 25 October 1945 stamp duty stopped, yet law-abiding people kept affixing Japanese stamps to protect their property and rights. In early January 1946 the Finance Department of the Taiwan Provincial Administration asked the postal authority to stop selling them; remaining stock was overprinted \"Taiwan Province, Republic of China\" and sold at post offices under the ROC rate table of 18 January 1944. On 16 August 1946 the Taiwan Stamp Duty Law was promulgated and provincial revenue stamps came into use. This exhibit shows specimens, errors and usages on documents; the most important items are on red mats.", "facts": ["21 Jun 1908 (Meiji 41): Taiwan Stamp Duty Rules", "25 Oct 1945: retrocession; Japanese stamps still used by the public", "Early Jan 1946: Japanese stamps overprinted \"中華民國臺灣省\" and sold at post offices; 18 Jan 1944 rate table", "16 Aug 1946: Taiwan Stamp Duty Law; provincial revenue stamps", "Viewing tip: key items have a red mat"], "frames": [["Frames 1–2", "Japanese era: Meiji, Earthquake provisional, Taisho revenues; entertainment tax, Government hat inspection stamps; Stamp Duty Paid", "Earliest revenue usage in Taiwan; only known Meiji ¥50 usage in Taiwan; Taisho ¥10 & ¥100 mint panes; one of three red hat inspection stamps"], ["Frames 3–4", "Japanese revenues hand-overprinted \"Taiwan Province, ROC\"", "Earliest dated usage; first-day usage of the Stamp Duty Law; only known 10 sen inverted overprint on receipt; one of two receipts with 3 sen; only known 10 sen type L3; one of two receipts with 1 sen; only known ¥10 overprint"], ["Frame 5", "Machine overprint \"Taiwan Province, ROC\"", "Only known small-character 50 sen and usage; ¥5 block of four; ¥1 on a college diploma"], ["Frame 6", "Surcharged in Taiwan currency", "Receipt with 10c/5s value omitted; wage list with $1/3s errors \"台華民國\" and \"中民華國\"; mortgage with $50/5r repair overprint"], ["Frame 7", "Dr. Sun Yat-sen portrait revenues", "Specimen booklet; military exemption certificate"], ["Frame 8", "Sun Yat-sen & Taiwan map (palm tree) revenues; surcharged in New Taiwan dollars", "\"貳伍分角\" error (characters 2–4 misplaced); only known mint \"貳圓分伍\" error"]], "qa": [["How are revenue stamps different from postage stamps?", "Revenue stamps show payment of tax and go on receipts, contracts and certificates; postage stamps pay for mail."], ["What are \"台華民國\" and \"中民華國\"?", "Overprint errors with the characters in the wrong order, used on a wage list (Frame 6)."]], "tip": "Crowd-pleasers: the jumbled-character errors in Frame 6 and the college diploma in Frame 5.", "refs": "Bulletin of the Taiwan Province Administrative Official Public Ministry; She Horng Wu, Revenue stamps of Taiwan area Republic of China, 1st ed., 1981"}, {"id": "C02", "cat": "C", "star": 2, "en": "台灣郵資票（美規）", "title": "Taiwan ATM Stamps (US Style)", "year": "1995–2000 | 5 frames", "src": "Source ② pp.3–5", "tags": ["ATM stamps", "Vending machine", "Sun Yat-sen Memorial Hall", "CKS Memorial Hall", "Modern"], "hook": "A \"US-style\" ATM stamp format used only by Taiwan, the USA and Argentina.", "script": "Seeing the convenience of vending machines, Chunghwa Post brought in three Unisys PMC machines from the USA on 31 July 1995 and issued 300,000 of the first ATM stamp, Sun Yat-sen Memorial Hall. Response was good, so on 5 November 1996 a second issue, Chiang Kai-shek Memorial Hall, followed — 2.7 million printed, about 450,000 actually used. The machines broke down often and could not be maintained, so they were withdrawn in early 2000. \"US style\" refers to the American Banknote Company format: about 22.1 × 25.0 mm, imperforate top and bottom, perforated left and right, sold only from Unisys machines. Only Taiwan, the USA and Argentina used it. The exhibit studies imprint types, typefaces and cutting varieties, with domestic and international covers and forms.", "facts": ["31 Jul 1995: 3 Unisys PMC machines; 1st issue Sun Yat-sen Memorial Hall, 300,000", "5 Nov 1996: 2nd issue CKS Memorial Hall, 2.7 million printed, ~450,000 used", "Early 2000: withdrawn due to breakdowns", "Format: ABN, ~22.1×25.0 mm, imperf top/bottom, perf left/right", "Used only in Taiwan, USA, Argentina"], "frames": [["Frame 1", "1st issue: imprint types, test labels, typing studies, varieties", "Covers with the top NT$500 value"], ["Frame 2", "1st issue: stains, ink shades, omitted and duplicated typing", "Domestic and international covers"], ["Frame 3", "2nd issue: imprint types, fixed typing, broken plates, typefaces, stains", "High-value strip and covers"], ["Frame 4", "2nd issue: omitted, duplicated and multi-variety typing", "Domestic covers"], ["Frame 5", "2nd issue on special-service mail and receipts", "Mainland China and international covers with high values"]], "qa": [["Is an ATM stamp a real stamp?", "Yes — the value is printed by the machine and it is used just like a stamp."]]}, {"id": "C03", "cat": "C", "star": 1, "en": "中華郵政國際航空郵簡（1953–1972）（暫譯）", "title": "Chunghwa Post – International Aerogramme 1953–1972", "year": "1953–1972", "src": "Source ② p.6", "tags": ["Aerogramme", "Postal rates", "Post-1949 Taiwan", "Hong Kong", "Macao", "Asia & Oceania"], "hook": "A sheet that folds into its own envelope — the printed values trace airmail rates to different regions.", "script": "To follow UPU rules and make airmail convenient, Chunghwa Post issued aerogrammes with pre-printed postage on 1 July 1953; the 1949 mainland version was a formula sheet without printed postage. International aerogrammes: NT$3 transport plane (1953), NT$3 four-engine plane (1954), and an NT$6 jet plane used until 1972. For Hong Kong and Macao the rate rose to NT$1.50 on 20 April 1955, previously the domestic NT$1; there was a NT$1.50 four-engine design and a NT$2 jet design from 1962 to 1970. For Asia and Oceania a NT$4 jet aerogramme appeared on 1 November 1966, used until 1972. The exhibit covers international aerogrammes only — proofs, specimens, mint and used, especially uprated, registered and unusual destinations.", "facts": ["1 Jul 1953: first pre-printed aerogrammes (1949 mainland sheet had no printed postage)", "International: 1953 NT$3 transport plane; 1954 NT$3 four-engine; NT$6 jet (to 1972)", "HK & Macao: from 20 Apr 1955 NT$1.50 (previously NT$1); four-engine NT$1.50; jet NT$2 (1962–1970)", "Asia & Oceania: from 1 Nov 1966 NT$4 jet (to 1972); previously same as international, NT$5", "Scope: international only; proofs, specimens, mint, used (uprated, registered, unusual destinations)"], "frames": [["1.1", "1953 International Transport Airplane", ""], ["1.2", "1954 International Four-Engine", ""], ["1.3", "1962 International Jet-Plane", ""], ["2.1", "1955 Hong Kong & Macao Four-Engine", ""], ["2.2", "1962 Hong Kong & Macao Jet-Plane", ""], ["3.1", "1966 Asia & Oceania Jet-Plane", ""]], "qa": [["What is an aerogramme?", "A lightweight sheet with postage printed on it that folds into its own envelope; enclosures are not allowed."]], "refs": "Han Ho-Yun 1984; Donald R. Alexander 1993; Lin Chang-Long, Postal Letter Sheets of ROC (1894–2003)"}, {"id": "C04", "cat": "C", "star": 2, "en": "國父像紐約版郵票（暫譯）", "title": "Dr. Sun Yat-Sen, New York Print", "year": "Wartime | 8 frames", "src": "Source ② p.7", "tags": ["War of Resistance", "Sun Yat-sen", "New York Print", "Overprint", "Kwangtung", "Surcharge", "Certificate"], "hook": "The first stamps an American printer produced for China — a sign of wartime diploma
